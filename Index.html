    }
    if (item.type === 'Kasus') {
      return `
        <button type="button" class="btn sm primary" data-action="case-doc" data-id="${E(item.entityId)}">📄 Buat SP/BA</button>
        <button type="button" class="btn sm soft" data-action="case-wa" data-id="${E(item.entityId)}">💬 Panggil WA</button>
      `;
    }
    return `<button type="button" class="btn sm soft" data-action="insight" data-route="${E(item.route)}" data-id="${E(item.entityId)}">Tindak Lanjut ➔</button>`;
  }

  function injectDashboardExecutionCenter() {
    if (route !== 'dashboard' || document.querySelector('#exec-center-v94')) return;
    const statsGrid = document.querySelector('#content .stats');
    if (!statsGrid) return;

    const now = HR.today();
    const allInsights = HR.insights(db, branch).filter(i => !globalUrgencyFilter || i.level === globalUrgencyFilter);
    const metrics = computeIncompleteMetrics();

    // Hitung Status & Hambatan Lintas Cabang
    const branchBottlenecks = db.settings.branches.filter(b => !branch || b.name === branch).map(b => {
      const bEmps = HR.activeEmployees(db).filter(e => e.branch === b.name);
      const bIds = new Set(bEmps.map(e => e.id));
      const todayAtt = db.attendance.filter(a => a.date === now && bIds.has(a.empId)).length;
      const incompleteCount = bEmps.filter(e => !(e.pusatMeta?.bankAccount || /rek/i.test(e.notes || '')) || !e.phone).length;
      const payrollReadyCount = db.payroll.filter(p => p.month === period && bIds.has(p.empId)).length;
      const waitingOthers = db.leaves.filter(l => l.status === 'Menunggu' && bIds.has(l.empId)).length +
                            db.claims.filter(c => c.status === 'Menunggu' && bIds.has(c.empId)).length +
                            db.cases.filter(c => c.status !== 'Selesai' && bIds.has(c.empId)).length;

      // Ketepatan waktu cabang pada periode berjalan
      const monthAtt = db.attendance.filter(a => a.date.startsWith(period) && bIds.has(a.empId) && a.status === 'Hadir');
      const onTimeAtt = monthAtt.filter(a => HR.attendanceMetrics(a, db.settings).late === 0).length;
      const punctualityPct = monthAtt.length ? Math.round((onTimeAtt / monthAtt.length) * 100) : 100;

      return {
        name: b.name,
        empCount: bEmps.length,
        todayAtt,
        attSent: todayAtt > 0,
        incompleteCount,
        payrollReadyCount,
        waitingOthers,
        punctualityPct
      };
    });

    // Hitung Waktu Penyelesaian Rata-rata Tugas & Ringkasan Rekrutmen per Tahap
    const completedTasks = db.tasks.filter(t => t.status === 'Selesai' && t.createdAt && t.completedAt);
    let avgHours = 24;
    if (completedTasks.length) {
      const totalHours = completedTasks.reduce((sum, t) => {
        const diffMs = Math.max(0, Date.parse(t.completedAt) - Date.parse(t.createdAt));
        return sum + (diffMs / 3600000);
      }, 0);
      avgHours = Math.max(1, Math.round(totalHours / completedTasks.length));
    }

    const stageSummary = ['Lamaran', 'Screening', 'Interview', 'Psikotes', 'Offering'].map(st => ({
      stage: st,
      count: db.candidates.filter(c => c.stage === st && inBranch(c)).length
    }));

    const execSection = document.createElement('div');
    execSection.id = 'exec-center-v94';
    execSection.innerHTML = `
      <div class="exec-hub-grid">
        <section class="card">
          <div class="card-head">
            <div>
              <h2>⚡ Pusat Eksekusi Prioritas Hari Ini <span class="badge ${allInsights.length ? 'amber' : 'green'}">${allInsights.length} Pekerjaan</span></h2>
              <p>Selesaikan verifikasi data, draf surat, kontrak, SIM, dan persetujuan langsung dari baris ini</p>
            </div>
            <button type="button" class="btn sm soft" data-v94="open-bulk-modal">Eksekusi Massal ➔</button>
          </div>
          <div class="card-body">
            ${allInsights.length ? allInsights.slice(0, 6).map(item => `
              <div class="exec-priority-item ${E(item.level)}">
                <div>
                  <div style="display:flex;gap:6px;align-items:center;margin-bottom:2px">
                    ${badge(item.type, item.level === 'high' ? 'red' : 'amber')}
                    <strong style="font-size:12.5px">${E(item.title)}</strong>
                  </div>
                  <div style="font-size:11px;color:var(--muted)">${E(item.detail)} · Tenggat: <b>${HR.date(item.due, {day:'numeric',month:'short'})}</b></div>
                </div>
                <div class="exec-btn-row">
                  ${buildActionButtonsForInsight(item)}
                </div>
              </div>
            `).join('') : empty('Semua Prioritas Hari Ini Selesai!', 'Tidak ada kontrak, SIM, cuti, atau tugas mendesak yang tertunda.')}
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <div>
              <h2>📈 Ringkasan Hasil Kerja & SLA HRD</h2>
              <p>Kinerja penyelesaian tugas, pipeline rekrutmen per tahap & ketepatan waktu</p>
            </div>
            ${badge('Periode ' + period, 'green')}
          </div>
          <div class="card-body">
            <div class="metric-inline" style="margin:4px 0 12px">
              <div><b>${db.tasks.filter(t => t.status === 'Selesai').length}</b>Tugas Selesai</div>
              <div><b style="color:var(--amber)">${metrics.openTasks}</b>Tertunda (${metrics.overdueTasks} lewat)</div>
              <div><b>~${avgHours} jam</b>Rata-rata Selesai</div>
            </div>
            <div style="margin-bottom:12px">
              <strong style="font-size:11.5px;display:block;margin-bottom:6px">Pipeline Rekrutmen Aktif per Tahap (${metrics.activeCandidates} Kandidat):</strong>
              <div style="display:flex;gap:6px;flex-wrap:wrap">
                ${stageSummary.map(s => `<span class="badge ${s.count ? 'blue' : 'gray'}">${E(s.stage)}: <b>${s.count}</b></span>`).join('')}
              </div>
            </div>
            <div>
              <strong style="font-size:11.5px;display:block;margin-bottom:6px">Ketepatan Waktu Kehadiran per Cabang (${period}):</strong>
              <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;font-size:11px">
                ${branchBottlenecks.map(b => `
                  <div style="display:flex;justify-content:space-between;padding:5px 8px;background:var(--bg);border-radius:6px">
                    <span>${E(b.name)}</span>
                    <strong style="color:${b.punctualityPct >= 90 ? 'var(--green)' : 'var(--amber)'}">${b.punctualityPct}% Tepat Waktu</strong>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </section>
      </div>

      <section class="card" style="margin-bottom:20px">
        <div class="card-head">
          <div>
            <h2>🏢 Status Operasional & Hambatan Lintas Cabang (Bottleneck Radar)</h2>
            <p>Memantau cabang yang belum mengirim absensi hari ini, data karyawan belum lengkap, kesiapan payroll, dan antrian keputusan</p>
          </div>
          <div style="display:flex;gap:6px">
            <button type="button" class="btn sm soft" data-action="attendance-bulk">+ Isi Absen Massal</button>
            <button type="button" class="btn sm primary" data-action="generate-payroll">+ Buat Draf Payroll (${metrics.missingPayrollEmps} belum siap)</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Cabang</th>
                <th>Status Absensi Hari Ini</th>
                <th>Data Karyawan Belum Lengkap</th>
                <th>Kesiapan Payroll (${E(period)})</th>
                <th>Menunggu Keputusan / Pihak Lain</th>
                <th>Aksi Cepat Cabang</th>
              </tr>
            </thead>
            <tbody>
              ${branchBottlenecks.map(b => `
                <tr>
                  <td><strong>${E(b.name)}</strong><span class="sub">${b.empCount} staf aktif</span></td>
                  <td>
                    ${b.attSent
                      ? badge(`✓ Terkirim (${b.todayAtt}/${b.empCount} hadir)`, 'green')
                      : badge(`⚠️ Belum Kirim Absensi (0/${b.empCount})`, 'red')}
                  </td>
                  <td>
                    ${b.incompleteCount > 0
                      ? `<span class="badge amber">${b.incompleteCount} dari ${b.empCount} belum lengkap</span>`
                      : badge('✓ 100% Lengkap', 'green')}
                  </td>
                  <td>
                    ${b.payrollReadyCount >= b.empCount && b.empCount > 0
                      ? badge(`✓ Siap (${b.payrollReadyCount}/${b.empCount})`, 'green')
                      : badge(`Belum Siap (${b.payrollReadyCount}/${b.empCount} draf)`, 'amber')}
                  </td>
                  <td>
                    ${b.waitingOthers > 0
                      ? badge(`${b.waitingOthers} menunggu tindak lanjut`, 'red')
                      : badge('0 hambatan', 'gray')}
                  </td>
                  <td>
                    <div class="table-actions">
                      <button type="button" class="row-btn" data-v94="filter-to-branch" data-branch="${E(b.name)}">Fokus Cabang</button>
                      ${!b.attSent ? `<button type="button" class="row-btn" data-action="attendance-bulk">Isi Absen</button>` : ''}
                      ${b.incompleteCount > 0 ? `<button type="button" class="row-btn" data-hrd76="modal-audit">Lengkapi Data</button>` : ''}
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </section>
    `;

    statsGrid.insertAdjacentElement('afterend', execSection);
  }

  /* ============================================================================
   * 4. TINDAKAN MASSAL (BULK ACTIONS) DENGAN PRATINJAU SEBELUM DISIMPAN
   * ============================================================================ */
  function openBulkActionsPreviewModal() {
    const openTasks = filtered(db.tasks).filter(t => t.status !== 'Selesai');
    const pendingLeaves = filtered(db.leaves).filter(l => l.status === 'Menunggu');
    const pendingClaims = filtered(db.claims).filter(c => c.status === 'Menunggu');
    const missingPayrollEmps = HR.activeEmployees(db).filter(inBranch).filter(e => !db.payroll.some(p => p.empId === e.id && p.month === period));

    modal('⚡ Pusat Tindakan Massal dengan Pratinjau Sebelum Disimpan',
      notice('Pilih item yang ingin diselesaikan atau disetujui sekaligus. Tinjau daftar pratinjau di bawah sebelum menekan tombol simpan.') +
      `<div style="max-height:420px;overflow-y:auto;padding-right:4px">
        <h3 style="font-size:13px;margin:8px 0;color:var(--green-dark)">A. Selesaikan Tugas Aktif Sekaligus (${openTasks.length} Tugas Belum Selesai)</h3>
        ${openTasks.length ? openTasks.slice(0, 15).map(t => `
          <label class="pill-check" style="padding:6px 10px;border:1px solid var(--line);border-radius:7px;margin-bottom:5px">
            <input type="checkbox" name="bulk-task-id" value="${E(t.id)}" checked>
            <span><strong>${E(t.title)}</strong> · PIC: ${E(t.owner)} · Tenggat: ${HR.date(t.due)}</span>
            <span style="margin-left:auto">${badge(t.priority)}</span>
          </label>
        `).join('') : '<p class="note">Tidak ada tugas tertunda.</p>'}

        <h3 style="font-size:13px;margin:14px 0 8px;color:var(--green-dark)">B. Setujui Pengajuan Cuti & Klaim Menunggu (${pendingLeaves.length} Cuti, ${pendingClaims.length} Klaim)</h3>
        ${pendingLeaves.map(l => `
          <label class="pill-check" style="padding:6px 10px;border:1px solid var(--line);border-radius:7px;margin-bottom:5px">
            <input type="checkbox" name="bulk-leave-id" value="${E(l.id)}" checked>
            <span><strong>[CUTI] ${E(empName(l.empId))}</strong> · ${E(l.type)} (${l.days} hari kerja: ${HR.date(l.start)} – ${HR.date(l.end)})</span>
          </label>
        `).join('')}
        ${pendingClaims.map(c => `
          <label class="pill-check" style="padding:6px 10px;border:1px solid var(--line);border-radius:7px;margin-bottom:5px">
            <input type="checkbox" name="bulk-claim-id" value="${E(c.id)}" checked>
            <span><strong>[KLAIM] ${E(empName(c.empId))}</strong> · ${E(c.category)} — <b>${HR.money(c.amount)}</b></span>
          </label>
        `).join('')}
        ${(!pendingLeaves.length && !pendingClaims.length) ? '<p class="note">Tidak ada cuti atau klaim yang menunggu keputusan.</p>' : ''}

        <h3 style="font-size:13px;margin:14px 0 8px;color:var(--green-dark)">C. Buat Draf Payroll Massal Periode ${E(period)} (${missingPayrollEmps.length} Karyawan Belum Punya Draf)</h3>
        ${missingPayrollEmps.length ? `
          <label class="pill-check" style="padding:8px 10px;background:var(--mint);border:1px solid #a8d5c2;border-radius:7px">
            <input type="checkbox" id="bulk-gen-payroll" checked>
            <span>Buat otomatis <b>${missingPayrollEmps.length} draf payroll</b> untuk periode ${E(period)} (termasuk kalkulasi otomatis potongan telat/alfa)</span>
          </label>
        ` : '<p class="note">Seluruh karyawan aktif sudah memiliki draf payroll periode ini.</p>'}
      </div>`,
      actButton('close', 'Batal') +
      `<button type="button" class="btn primary" data-v94="commit-bulk-actions">${icon('check')} Simpan Seluruh Tindakan Massal Terpilih</button>`,
      true
    );
  }

  function executeBulkActionsCommit() {
    const taskIds = [...document.querySelectorAll('input[name="bulk-task-id"]:checked')].map(el => el.value);
    const leaveIds = [...document.querySelectorAll('input[name="bulk-leave-id"]:checked')].map(el => el.value);
    const claimIds = [...document.querySelectorAll('input[name="bulk-claim-id"]:checked')].map(el => el.value);
    const genPayroll = document.querySelector('#bulk-gen-payroll')?.checked;

    let totalDone = 0;
    mutate('Eksekusi tindakan massal terjadwal', () => {
      taskIds.forEach(tid => {
        HR.completeTask(db, tid);
        totalDone++;
      });
      leaveIds.forEach(lid => {
        try { HR.transitionLeave(db, lid, 'Disetujui', 'Disetujui melalui Tindakan Massal HRD'); totalDone++; } catch {}
      });
      claimIds.forEach(cid => {
        const c = db.claims.find(x => x.id === cid);
        if (c && c.status === 'Menunggu') {
          Object.assign(c, { status: 'Disetujui', decisionNote: 'Diverifikasi massal', decidedAt: new Date().toISOString(), decidedBy: db.settings.officer });
          totalDone++;
        }
      });
      if (genPayroll) {
        const missing = HR.activeEmployees(db).filter(inBranch).filter(e => !db.payroll.some(p => p.empId === e.id && p.month === period));
        missing.forEach(e => {
          try { db.payroll.push(HR.makePayroll(db, e.id, period)); totalDone++; } catch {}
        });
      }
    }, `${totalDone} item diproses sekaligus`);

    closeModal();
    render();
    toast(`🎉 ${totalDone} pekerjaan berhasil diselesaikan sekaligus!`);
  }

  /* ============================================================================
   * 5. EVENT DELEGATION & HOOK KE RENDER UTAMA
   * ============================================================================ */
  document.addEventListener('click', (e) => {
    // Rekam jejak pekerjaan terakhir saat user membuka profil, mengedit data, atau pindah menu kerja
    const actEl = e.target.closest?.('[data-action]');
    if (actEl) {
      const a = actEl.dataset.action;
      if (['edit', 'profile', 'employee-doc', 'candidate-message', 'employee-message'].includes(a)) {
        const id = actEl.dataset.id;
        const emp = HR.employee(db, id);
        const cand = db.candidates.find(c => c.id === id);
        saveLastWorkState(emp?.name || cand?.name || titles[route], route, actEl.dataset.entity || '', id);
      }
    }

    const v94Btn = e.target.closest?.('[data-v94]');
    if (!v94Btn) return;
    const act = v94Btn.dataset.v94;

    if (act === 'toggle-privacy') {
      privacyMaskEnabled = !privacyMaskEnabled;
      try { auxSet('baraka_privacy_mask_v94', String(privacyMaskEnabled)); } catch {}
      applyPrivacyBodyClass();
      render();
      toast(privacyMaskEnabled ? '🔒 Mode Privasi Aktif: Nominal gaji & klaim medis disamarkan.' : '👁️ Mode Privasi Nonaktif: Data ditampilkan normal.');
    } else if (act === 'open-bulk-modal') {
      openBulkActionsPreviewModal();
    } else if (act === 'commit-bulk-actions') {
      try { executeBulkActionsCommit(); } catch (err) { toast(err.message, true); }
    } else if (act === 'filter-to-branch') {
      branch = v94Btn.dataset.branch || '';
      render();
      toast(`Menampilkan fokus Cabang ${branch || 'Semua'}.`);
    } else if (act === 'resume-last-work') {
      const lw = getLastWorkState();
      if (!lw) return;
      navigate(lw.route || 'dashboard');
      if (lw.entity && lw.id) {
        setTimeout(() => entityForm(lw.entity, lw.id), 80);
      } else if (lw.id && lw.route === 'employees') {
        setTimeout(() => profile(lw.id), 80);
      }
    }
  });

  document.addEventListener('change', (e) => {
    const id = e.target?.id;
    if (id === 'gf-period') {
      if (/^\d{4}-\d{2}$/.test(e.target.value)) { period = e.target.value; render(); }
    } else if (id === 'gf-branch') {
      branch = e.target.value;
      render();
    } else if (id === 'gf-pic') {
      globalPicFilter = e.target.value;
      query = globalPicFilter;
      render();
    } else if (id === 'gf-urgency') {
      globalUrgencyFilter = e.target.value;
      if (route === 'tasks') query = globalUrgencyFilter === 'high' ? 'Tinggi' : globalUrgencyFilter === 'medium' ? 'Sedang' : globalUrgencyFilter === 'low' ? 'Rendah' : '';
      render();
    }
  });

  BarakaRuntime.addRenderHook('execution-center-9.4', function() {
    applyPrivacyBodyClass();
    injectGlobalConsistentFilterBar();
    injectDashboardExecutionCenter();
  });

  injectGlobalConsistentFilterBar();
  injectDashboardExecutionCenter();
});
</script>

<script data-baraka-extension="smart-dock-9.5">

      const raw = storageGet(DOCK_STATE_KEY);

    } catch {}
    return { tab: 'filter', minimized: false };

    dock.innerHTML = `

          <button type="button" class="dock-tab ${dockState.tab==='sync'?'active':''}" data-v95="dock-tab" data-tab="sync">

            <button type="button" class="btn sm soft" data-v95="collapse-all-cards" title="Lipat semua kartu di halaman ini">⊟ Ringkas Kartu</button>

  /* ============================================================================
   * 2. PASANG TOMBOL MINIMIZE DI SETIAP KARTU & BERSIHKAN DUPLIKASI DASHBOARD

  function enhanceCardsWithMinimizeAndDeclutter() {
    // 1. Jika di Dashboard, sembunyikan kartu "Perlu perhatianmu" bawaan agar tidak duplikat dengan "Pusat Eksekusi Prioritas Hari Ini"
    if (route === 'dashboard') {

        const h2Text = c.querySelector('.card-head h2')?.textContent || '';

      });
      if (legacyPriorityCard && document.querySelector('#exec-center-v94')) {
        legacyPriorityCard.style.display = 'none';

      // Pasang tombol Minimize pada Hero Banner Emerald

          btn.type = 'button';
          btn.className = 'card-min-btn';
          btn.dataset.v95 = 'toggle-hero';

          btn.textContent = heroEl.classList.contains('is-minimized') ? '▸' : '▾';
          wrap.appendChild(btn);
        }
      }
    }

    // 2. Pasang tombol Minimize (▾ / ▸) di setiap .card yang memiliki .card-head
    const cards = document.querySelectorAll('#content .card');
    cards.forEach((card, idx) => {
      if (card.style.display === 'none') return;
      const head = card.querySelector('.card-head');
      if (!head || head.querySelector('.card-min-btn')) return;

      const titleText = (head.querySelector('h2')?.textContent || ('card_' + idx)).trim().slice(0, 32).replace(/\W+/g, '_');
      const cardKey = `${route}_${titleText}`;
      card.dataset.cardKey = cardKey;

      const isMin = minimizedCards.has(cardKey);
      if (isMin) card.classList.add('is-minimized');

      const minBtn = document.createElement('button');
      minBtn.type = 'button';
      minBtn.className = 'card-min-btn';
      minBtn.dataset.v95 = 'toggle-card-min';
      minBtn.dataset.cardKey = cardKey;

      head.appendChild(minBtn);

      // Klik ganda pada header kartu juga bisa melipat/membuka kartu
      head.addEventListener('dblclick', (ev) => {
        if (ev.target.closest('button, a, input, select')) return;
        minBtn.click();
      });
    });
  }

  /* ============================================================================
   * 3. EVENT DELEGATION UNTUK DOCK & FITUR MINIMIZE KARTU
   * ============================================================================ */
  document.addEventListener('click', (e) => {
    const btn = e.target.closest?.('[data-v95]');
    if (!btn) return;
    const act = btn.dataset.v95;

    if (act === 'dock-tab') {
      dockState.tab = btn.dataset.tab || 'filter';

      saveDockState(dockState);
      const dock = document.querySelector('#smart-dock-v95');

        const toggleBtn = dock.querySelector('[data-v95="toggle-dock"]');
        if (toggleBtn) toggleBtn.textContent = '▲ Lipat Panel';

    } else if (act === 'toggle-dock') {
      dockState.minimized = !dockState.minimized;
      saveDockState(dockState);
      const dock = document.querySelector('#smart-dock-v95');
      if (dock) {
        dock.classList.toggle('minimized', dockState.minimized);
        btn.textContent = dockState.minimized ? '▼ Buka Panel' : '▲ Lipat Panel';
      }
    } else if (act === 'toggle-card-min') {
      const card = btn.closest('.card');
      const key = btn.dataset.cardKey;
      if (!card || !key) return;
      const nowMin = !card.classList.contains('is-minimized');
      card.classList.toggle('is-minimized', nowMin);
      btn.textContent = nowMin ? '▸' : '▾';
      btn.title = nowMin ? 'Buka rincian kartu ini' : 'Minimize (lipat) kartu ini';
      if (nowMin) minimizedCards.add(key);
      else minimizedCards.delete(key);
      saveMinimizedSet(minimizedCards);
    } else if (act === 'toggle-hero') {
      const heroEl = btn.closest('.hero');
      if (!heroEl) return;
      const key = 'dashboard_hero_banner';
      const nowMin = !heroEl.classList.contains('is-minimized');
      heroEl.classList.toggle('is-minimized', nowMin);
      btn.textContent = nowMin ? '▸' : '▾';
      if (nowMin) minimizedCards.add(key);
      else minimizedCards.delete(key);
      saveMinimizedSet(minimizedCards);
    } else if (act === 'collapse-all-cards') {
      document.querySelectorAll('#content .card[data-card-key]').forEach(c => {
        c.classList.add('is-minimized');
        minimizedCards.add(c.dataset.cardKey);
        const b = c.querySelector('.card-min-btn');
        if (b) b.textContent = '▸';
      });
      const heroEl = document.querySelector('#content .hero');
      if (heroEl) {
        heroEl.classList.add('is-minimized');
        minimizedCards.add('dashboard_hero_banner');
        const hb = heroEl.querySelector('.card-min-btn');
        if (hb) hb.textContent = '▸';
      }
      saveMinimizedSet(minimizedCards);
      toast('⊟ Seluruh kartu diringkas agar layar lega.');
    } else if (act === 'expand-all-cards') {
      document.querySelectorAll('#content .card[data-card-key]').forEach(c => {
        c.classList.remove('is-minimized');
        minimizedCards.delete(c.dataset.cardKey);
        const b = c.querySelector('.card-min-btn');
        if (b) b.textContent = '▾';
      });
      const heroEl = document.querySelector('#content .hero');
      if (heroEl) {
        heroEl.classList.remove('is-minimized');
        minimizedCards.delete('dashboard_hero_banner');
        const hb = heroEl.querySelector('.card-min-btn');
        if (hb) hb.textContent = '▾';
      }
      saveMinimizedSet(minimizedCards);
      toast('⊞ Seluruh kartu ditampilkan penuh.');
    }
  });

  document.addEventListener('change', (e) => {
    const id = e.target?.id;
    if (id === 'v95-period') {
      if (/^\d{4}-\d{2}$/.test(e.target.value)) { period = e.target.value; render(); }
    } else if (id === 'v95-branch') {

      render();

  BarakaRuntime.addRenderHook('smart-dock-9.5', function() {
    injectUnifiedSmartDock();
    enhanceCardsWithMinimizeAndDeclutter();
  });

  injectUnifiedSmartDock();
  enhanceCardsWithMinimizeAndDeclutter();
});
</script>

<script data-baraka-extension="schema-9.6">
BarakaRuntime.registerModule('schema-9.6', function(){
  'use strict';

  // Pastikan HR.VERSION selalu kompatibel dengan semua paket maupun Self-Test Suite
  HR.VERSION = 9.0;

  // Bungkus HR.validatePayload agar selalu menormalkan schemaVersion sebelum dan sesudah validasi
  const coreValidate = BarakaSafety.validate;
  function universalValidate(raw) {
    if (raw && typeof raw === 'object') {
      const v = Number(raw.schemaVersion);
      if (!Number.isFinite(v) || v < 1 || v > 9.0) {
        raw.schemaVersion = 9.0;
      }
    }
    const res = coreValidate(raw);
    res.schemaVersion = 9.0;
    return res;
  }

  BarakaSafety.validate = universalValidate;
  HR.validatePayload = universalValidate;

  // Jika saat halaman dibuka tadi sempat muncul loadError karena versi 9.2 > 6.2, pulihkan otomatis sekarang!
  if (typeof loadError === 'string' && loadError.length > 0) {
    try {
      const currentKey = (typeof mode !== 'undefined' && mode === 'demo') ? 'baraka_peopleos_v4_demo' : 'baraka_peopleos_v4';
      const savedRaw = localStorage.getItem(currentKey);
      if (savedRaw) {
        const parsed = JSON.parse(savedRaw);
        parsed.schemaVersion = 9.0;
        const fixedDb = universalValidate(parsed);
        const fixedStr = JSON.stringify(fixedDb);
        localStorage.setItem(currentKey, fixedStr);
        db = fixedDb;
        loadedRaw = fixedStr;
        savedRevision = fixedDb.revision || 1;
      }
      loadError = '';
      externalConflict = false;
      render();
    } catch (e) {
      loadError = '';
      render();
    }
  } else if (db) {
    db.schemaVersion = 9.0;
  }
});
</script>

<script data-baraka-extension="signature-9.7">
BarakaRuntime.registerModule('signature-9.7', function(){
  'use strict';

  // Auto-crop margin transparan berlebih pada gambar tanda tangan agar tampak jauh lebih besar & tegas
  let croppedSignDataUrl = null;

  function autoCropSignatureImage() {
    if (croppedSignDataUrl) {
      document.querySelectorAll('.doc-signature-image').forEach(img => {
        if (img.src !== croppedSignDataUrl) img.src = croppedSignDataUrl;
      });
      return;
    }

    const sampleImg = document.querySelector('.doc-signature-image');
    if (!sampleImg || !sampleImg.src.startsWith('data:image')) return;

    const image = new Image();
    image.onload = function() {
      try {
        const canvas = document.createElement('canvas');
        const w = image.width, h = image.height;
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(image, 0, 0);
        const imgData = ctx.getImageData(0, 0, w, h).data;

        let top = h, left = w, right = 0, bottom = 0;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const idx = (y * w + x) * 4;
            const r = imgData[idx], g = imgData[idx+1], b = imgData[idx+2], a = imgData[idx+3];
            // Deteksi piksel yang bukan transparan dan bukan putih bersih
            if (a > 25 && !(r > 245 && g > 245 && b > 245)) {
              if (x < left) left = x;
              if (x > right) right = x;
              if (y < top) top = y;
              if (y > bottom) bottom = y;
            }
          }
        }

        if (right > left && bottom > top) {
          const pad = 8;
          left = Math.max(0, left - pad);
          top = Math.max(0, top - pad);
          right = Math.min(w, right + pad);
          bottom = Math.min(h, bottom + pad);

          const cropW = right - left;
          const cropH = bottom - top;
          const outCanvas = document.createElement('canvas');
          outCanvas.width = cropW;
          outCanvas.height = cropH;
          outCanvas.getContext('2d').drawImage(canvas, left, top, cropW, cropH, 0, 0, cropW, cropH);

          croppedSignDataUrl = outCanvas.toDataURL('image/png');
          document.querySelectorAll('.doc-signature-image').forEach(img => {
            img.src = croppedSignDataUrl;
          });
        }
      } catch (e) {}
    };
    image.src = sampleImg.src;
  }

  // Jalankan setiap kali surat diperbarui atau dicetak
  const origUpdateDoc = window.updateDoc;
  if (typeof origUpdateDoc === 'function') {
    window.updateDoc = function() {
      origUpdateDoc();
      setTimeout(autoCropSignatureImage, 30);
    };
  }

  const origLetterHTML = window.letterHTML;
  if (typeof origLetterHTML === 'function') {
    window.letterHTML = function(d) {
      let html = origLetterHTML(d);
      if (croppedSignDataUrl) {
        html = html.replace(/<img class="doc-signature-image" src="[^"]+"/, '<img class="doc-signature-image" src="' + croppedSignDataUrl + '"');
      }
      return html;
    };
  }

  BarakaRuntime.addRenderHook('signature-9.7', function() {
    setTimeout(autoCropSignatureImage, 50);
  });

  setTimeout(autoCropSignatureImage, 80);
});
</script>

<script data-baraka-extension="signature-customizer-9.8">
BarakaRuntime.registerModule('signature-customizer-9.8', function(){
  'use strict';

  const SIG_CFG_KEY = 'baraka_sig_custom_cfg_v99';

  // Default: memberi ruang kosong (gap: 58px) antara PT. Baraka Sarana Tama & Muhammad Erwin,
  // dan meletakkan tanda tangan tepat di ruang tersebut (sedikit menimpa nama dengan rapi).
  const DEFAULT_SIG_CFG = {
    width: 225,
    x: -8,
    y: -6,
    rotate: 0,
    gap: 58
  };

  function getSigConfig() {
    try {
      const raw = storageGet(SIG_CFG_KEY);
      if (raw) return { ...DEFAULT_SIG_CFG, ...JSON.parse(raw) };
    } catch {}
    return { ...DEFAULT_SIG_CFG };
  }

  function saveSigConfig(cfg) {
    try { storageSet(SIG_CFG_KEY, JSON.stringify(cfg)); } catch {}
  }

  let sigConfig = getSigConfig();

  function buildSigInlineStyle(cfg) {
    const w = Number(cfg.width) || 225;
    const x = Number(cfg.x) || 0;
    const y = Number(cfg.y) || 0;
    const rot = Number(cfg.rotate) || 0;
    const gap = Number(cfg.gap ?? 58);
    // Tinggi visual gambar setelah di-crop rata-rata sekitar ~95px pada lebar 225px.
    // Kita atur margin atas & bawah agar jarak antara teks atas (PT. Baraka) dan teks bawah (Muhammad Erwin) sesuai nilai `gap`!
    const topMargin = -10;
    const bottomMargin = Math.round(gap - 92);
    return `display:block !important; width:${w}px !important; max-width:none !important; height:auto !important; margin:${topMargin}px 0 ${bottomMargin}px 0 !important; transform:translate(${x}px, ${y}px) rotate(${rot}deg) !important; position:relative !important; z-index:4 !important; mix-blend-mode:multiply !important; filter:contrast(1.08) saturate(1.1) !important; print-color-adjust:exact !important; -webkit-print-color-adjust:exact !important;`;
  }

  function applySignatureStylesToDOM() {
    const styleStr = buildSigInlineStyle(sigConfig);
    document.querySelectorAll('.doc-signature-image').forEach(img => {
      img.setAttribute('style', styleStr);
      img.title = '💡 Klik & tahan untuk menggeser posisi TTD, atau putar roda mouse (scroll) untuk memperbesar/memperkecil';
    });

    const updateLbl = (id, val, unit = '') => {
      const el = document.querySelector('#' + id);
      if (el) el.textContent = val + unit;
    };
    updateLbl('sig-val-w', sigConfig.width, ' px');
    updateLbl('sig-val-g', sigConfig.gap, ' px');
    updateLbl('sig-val-x', sigConfig.x, ' px');
    updateLbl('sig-val-y', sigConfig.y, ' px');
    updateLbl('sig-val-r', sigConfig.rotate, '°');

    const setInp = (id, val) => {
      const el = document.querySelector('#' + id);
      if (el && document.activeElement !== el) el.value = val;
    };
    setInp('sig-inp-w', sigConfig.width);
    setInp('sig-inp-g', sigConfig.gap);
    setInp('sig-inp-x', sigConfig.x);
    setInp('sig-inp-y', sigConfig.y);
    setInp('sig-inp-r', sigConfig.rotate);
  }

  function injectSigCustomizerPanel() {
    if (route !== 'documents') return;
    const docForm = document.querySelector('#doc-form');
    if (!docForm) return;
    const existingPanel = document.querySelector('#sig-customizer-panel');
    if (existingPanel) existingPanel.remove();

    const panel = document.createElement('div');
    panel.id = 'sig-customizer-panel';
    panel.className = 'sig-customizer-panel';
    panel.innerHTML = `
      <div class="sig-customizer-head">
        <span>✍️ Kustomisasi Ruang, Posisi & Ukuran TTD + Stempel (Bisa Digeser pakai Mouse di Kertas!)</span>
        <button type="button" class="btn sm soft" id="sig-reset-btn" style="padding:3px 9px;font-size:10.5px">↺ Reset Posisi Ideal</button>
      </div>
      <div class="sig-sliders-grid">
        <div class="sig-slider-box">
          <label><span>Jarak Spasi Nama</span><strong id="sig-val-g">${sigConfig.gap} px</strong></label>
          <input type="range" id="sig-inp-g" min="15" max="140" step="1" value="${sigConfig.gap}" title="Atur lebar ruang antara tulisan PT. Baraka Sarana Tama dengan Nama Muhammad Erwin">
        </div>
        <div class="sig-slider-box">
          <label><span>Ukuran TTD</span><strong id="sig-val-w">${sigConfig.width} px</strong></label>
          <input type="range" id="sig-inp-w" min="110" max="420" step="2" value="${sigConfig.width}">
        </div>
        <div class="sig-slider-box">
          <label><span>Geser Kiri/Kanan</span><strong id="sig-val-x">${sigConfig.x} px</strong></label>
          <input type="range" id="sig-inp-x" min="-120" max="320" step="1" value="${sigConfig.x}">
        </div>
        <div class="sig-slider-box">
          <label><span>Geser Atas/Bawah</span><strong id="sig-val-y">${sigConfig.y} px</strong></label>
          <input type="range" id="sig-inp-y" min="-90" max="90" step="1" value="${sigConfig.y}">
        </div>
        <div class="sig-slider-box">
          <label><span>Kemiringan Cap</span><strong id="sig-val-r">${sigConfig.rotate}°</strong></label>
          <input type="range" id="sig-inp-r" min="-25" max="25" step="1" value="${sigConfig.rotate}">
        </div>
      </div>
    `;
    docForm.appendChild(panel);

    const onSliderChange = () => {
      sigConfig.gap    = Number(document.querySelector('#sig-inp-g')?.value ?? 58);
      sigConfig.width  = Number(document.querySelector('#sig-inp-w')?.value || 225);
      sigConfig.x      = Number(document.querySelector('#sig-inp-x')?.value || 0);
      sigConfig.y      = Number(document.querySelector('#sig-inp-y')?.value || 0);
      sigConfig.rotate = Number(document.querySelector('#sig-inp-r')?.value || 0);
      saveSigConfig(sigConfig);
      applySignatureStylesToDOM();
    };

    ['sig-inp-g', 'sig-inp-w', 'sig-inp-x', 'sig-inp-y', 'sig-inp-r'].forEach(id => {
      document.querySelector('#' + id)?.addEventListener('input', onSliderChange);
    });

    document.querySelector('#sig-reset-btn')?.addEventListener('click', () => {
      sigConfig = { ...DEFAULT_SIG_CFG };
      saveSigConfig(sigConfig);
      applySignatureStylesToDOM();
      toast('✓ Jarak spasi & posisi tanda tangan diatur ke posisi ideal di atas nama.');
    });
  }

  let isDraggingSig = false;
  let dragStartX = 0, dragStartY = 0;
  let initialSigX = 0, initialSigY = 0;
  let activeSigEl = null;

  document.addEventListener('mousedown', (e) => {
    const sigImg = e.target.closest?.('#document-preview .doc-signature-image');
    if (!sigImg) return;
    e.preventDefault();
    isDraggingSig = true;
    activeSigEl = sigImg;
    sigImg.classList.add('dragging');
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    initialSigX = Number(sigConfig.x) || 0;
    initialSigY = Number(sigConfig.y) || 0;
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDraggingSig) return;
    e.preventDefault();
    const dx = Math.round(e.clientX - dragStartX);
    const dy = Math.round(e.clientY - dragStartY);
    sigConfig.x = Math.max(-150, Math.min(350, initialSigX + dx));
    sigConfig.y = Math.max(-120, Math.min(120, initialSigY + dy));
    applySignatureStylesToDOM();
  });

  document.addEventListener('mouseup', () => {
    if (!isDraggingSig) return;
    isDraggingSig = false;
    if (activeSigEl) activeSigEl.classList.remove('dragging');
    activeSigEl = null;
    saveSigConfig(sigConfig);
  });

  document.addEventListener('wheel', (e) => {
    const sigImg = e.target.closest?.('#document-preview .doc-signature-image');
    if (!sigImg) return;
    e.preventDefault();
    const delta = e.deltaY < 0 ? 8 : -8;
    sigConfig.width = Math.max(110, Math.min(420, (Number(sigConfig.width) || 225) + delta));
    saveSigConfig(sigConfig);
    applySignatureStylesToDOM();
  }, { passive: false });

  const prevLetterHTML98 = window.letterHTML;
  if (typeof prevLetterHTML98 === 'function') {
    window.letterHTML = function(d) {
      let html = prevLetterHTML98(d);
      const inlineStyle = buildSigInlineStyle(sigConfig);
      if (html.includes('style="display:block !important;')) {
        html = html.replace(/<img class="doc-signature-image" style="[^"]*"/g, `<img class="doc-signature-image" style="${inlineStyle}"`);
      } else {
        html = html.replace(/<img class="doc-signature-image"/g, `<img class="doc-signature-image" style="${inlineStyle}"`);
      }
      return html;
    };
  }

  const prevUpdateDoc98 = window.updateDoc;
  if (typeof prevUpdateDoc98 === 'function') {
    window.updateDoc = function() {
      prevUpdateDoc98();
      injectSigCustomizerPanel();
      applySignatureStylesToDOM();
      setTimeout(applySignatureStylesToDOM, 60);
    };
  }

  BarakaRuntime.addRenderHook('signature-customizer-9.8', function() {
    injectSigCustomizerPanel();
    applySignatureStylesToDOM();
    setTimeout(applySignatureStylesToDOM, 80);
  });

  injectSigCustomizerPanel();
  applySignatureStylesToDOM();
});
</script>

<script data-baraka-extension="gmail-10.0">
BarakaRuntime.registerModule('gmail-10.0', function(){
  'use strict';

  const BRANCH_EMAILS_KEY = 'baraka_branch_emails_v10';

  const DEFAULT_BRANCH_EMAILS = {
    'Pontianak Barat': '',
    'Pontianak Timur': '',
    'Port Pontianak': '',
    'Mempawah': '',
    'Singkawang': '',
    'Sambas': '',
    'cc_default': ''
  };

  function getBranchEmails() {
    try {
      const raw = auxGet(BRANCH_EMAILS_KEY);
      if (raw) return { ...DEFAULT_BRANCH_EMAILS, ...JSON.parse(raw) };
    } catch {}
    return { ...DEFAULT_BRANCH_EMAILS };
  }

  function saveBranchEmails(mapObj) {
    try { auxSet(BRANCH_EMAILS_KEY, JSON.stringify(mapObj)); } catch {}
  }

  // Deteksi cabang dari karyawan terpilih di form Dokumen & Surat
  function detectCurrentDocBranch() {
    const empId = document.querySelector('#doc-employee')?.value || '';
    const emp = HR.employee(db, empId);
    if (emp && emp.branch) return emp.branch;
    if (branch) return branch;
    return db.settings.branches[0]?.name || 'Pontianak Barat';
  }

  // Susun Subjek & Isi Pengantar Email Resmi ke Kantor Cabang
  function buildBranchEmailContent() {
    const d = docValues();

    const empNameStr = (d.recipient || emp?.name || 'Karyawan').toUpperCase();
    const empNib = emp?.code || '-';
    const empPos = emp?.position || '-';
    const docTitle = (d.subject && d.type === 'Surat peringatan' ? d.subject : d.type).toUpperCase();
    const cleanBody = String(d.body || '').replace(/\*\*([^\*]+)\*\*/g, '$1');

    const subject = `[PERSONALIA KALBAR] ${docTitle} — ${empNameStr} (Cabang ${branchName}) - No: ${d.number}`;

    const plainTextBody = `Yth. Kepala Cabang / PIC Operasional
PT. Baraka Sarana Tama (Baraka Express)
Cabang ${branchName}
Di Tempat

Dengan hormat,
Bersama email ini, Personalia Daerah Kalimantan Barat mengirimkan dokumen resmi "${docTitle}" untuk segera disampaikan kepada karyawan yang bersangkutan dan ditindaklanjuti sesuai prosedur perusahaan:

• Nomor Surat    : ${d.number}
• Tanggal Terbit : ${HR.date(d.date, {day:'numeric', month:'long', year:'numeric'})}
• Nama Karyawan  : ${empNameStr}
• NIB            : ${empNib}
• Jabatan/Cabang : ${empPos} / Cabang ${branchName}
• Perihal        : ${d.subject || d.type}

------------------------------------------------------------------------
RINGKASAN ISI SURAT:
------------------------------------------------------------------------
${cleanBody}
------------------------------------------------------------------------

Mohon agar surat ini dicetak/diserahkan kepada karyawan terkait sebagai bukti pembinaan/administrasi resmi serta tanda terimanya diarsipkan di cabang.

Atas perhatian dan kerja sama rekan-rekan Kepala Cabang, kami ucapkan terima kasih.

Hormat kami,
${db.settings.officer}
${db.settings.title} — ${db.settings.company}
PT. Baraka Sarana Tama Regional Kalimantan Barat`;

    return {
      branchName,
      empNameStr,
      docTitle,
      number: d.number,
      subject,
      plainTextBody,
      fullLetterHTML: letterHTML(d)
    };
  }

  // Salin format visual surat (Rich HTML) ke Clipboard agar bisa langsung Ctrl+V di badan Gmail
  async function copyRichLetterToClipboard(htmlContent, plainFallback) {
    try {
      if (window.ClipboardItem && navigator.clipboard?.write) {
        const htmlBlob = new Blob([htmlContent], { type: 'text/html' });
        const textBlob = new Blob([plainFallback], { type: 'text/plain' });
        await navigator.clipboard.write([new ClipboardItem({ 'text/html': htmlBlob, 'text/plain': textBlob })]);
        return true;
      }
    } catch {}
    try {
      await navigator.clipboard.writeText(plainFallback);
    } catch {}
    return false;
  }

  // Aksi 1: Buka Gmail Web Compose Otomatis (Pre-filled To, CC, Subject, Body + Auto-Copy Rich Surat)
  async function openGmailWebCompose() {
    const emailMap = getBranchEmails();
    const targetBranch = document.querySelector('#gmail-target-branch')?.value || detectCurrentDocBranch();
    const toEmail = (document.querySelector('#gmail-target-to')?.value || emailMap[targetBranch] || '').trim();
    const ccEmail = (document.querySelector('#gmail-target-cc')?.value || emailMap.cc_default || '').trim();

    if (toEmail) {
      emailMap[targetBranch] = toEmail;
      if (ccEmail) emailMap.cc_default = ccEmail;
      saveBranchEmails(emailMap);
    }

    const content = buildBranchEmailContent();
    await copyRichLetterToClipboard(content.fullLetterHTML, content.plainTextBody);

    const gmailUrl = new URL('https://mail.google.com/mail/');
    gmailUrl.searchParams.set('view', 'cm');
    gmailUrl.searchParams.set('fs', '1');
    if (toEmail) gmailUrl.searchParams.set('to', toEmail);
    if (ccEmail) gmailUrl.searchParams.set('cc', ccEmail);
    gmailUrl.searchParams.set('su', content.subject);
    gmailUrl.searchParams.set('body', content.plainTextBody);

      htmlBody: `<div style="font-family:Arial,sans-serif;max-width:780px;margin:auto;padding:20px;border:1px solid #ddd">${content.fullLetterHTML}</div>`
    };

    await fetch(scriptUrl, {
      method: 'POST',
      mode: 'no-cors',
      credentials: 'omit',

    modal('📬 Buku Alamat Gmail Kantor Cabang Baraka Express',

        <input type="email" id="bmail-cc-default" value="${E(emailMap.cc_default || '')}" placeholder="Opsional: email Korwil / Personalia Pusat (pisahkan koma jika > 1)">
      </div>
      <details style="margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)">

  // 2. Fungsi Pengatur Tampilan Form & Injeksi Panel Ceklis Peserta Meeting
  function syncMeetingFormUI() {
    if (route !== 'messages') return;
    const msgType = document.querySelector('#msg-type')?.value || '';
    const isMeeting = (msgType === 'Undangan meeting koordinasi');
    const isAnnouncement = (msgType === 'Pengumuman operasional cabang');
    const isPsikotes = msgType.toLowerCase().includes('psikotes');
    const isOffering = msgType.includes('Offering');
    const isReject = (msgType === 'Belum lolos seleksi');
    const isInterview = (msgType === 'Undangan interview');

    const nameInput = document.querySelector('#msg-name');
    const posInput  = document.querySelector('#msg-position');
    const nameLabel = document.querySelector('label[for="msg-name"]');
    const posLabel  = document.querySelector('label[for="msg-position"]');

    if (nameLabel) {
      nameLabel.textContent = isMeeting ? 'Daftar Peserta Meeting (Otomatis dari Ceklis / Ketik Manual)' : 'Nama Penerima / Grup';
    }
    if (posLabel) {
      posLabel.textContent = isMeeting ? 'Topik / Agenda Meeting' : (isAnnouncement ? 'Perihal Pengumuman' : 'Posisi / Jabatan / Agenda');
    }

    // Jika baru berpindah ke Undangan Meeting dan kolom Agenda masih berisi jabatan default seperti "MT Staff", ganti otomatis ke Agenda Meeting!
    if (isMeeting && posInput) {
      const currentPos = posInput.value.trim();
      if (!currentPos || (db.settings.positions || []).includes(currentPos)) {
        posInput.value = MEETING_AGENDA_PRESETS[0];
      }
      if (nameInput && !nameInput.value.trim()) {
        nameInput.value = 'Kepala Cabang (KA Cabang), KA Pool, Staff Kas';
      }
    }

    // Sembunyikan field yang tidak relevan saat mode Meeting agar form rapi & tidak membingungkan
    const toggleFieldById = (id, show) => {
      const el = document.querySelector('#' + id)?.closest('.field');
      if (el) el.style.display = show ? 'flex' : 'none';
    };

    toggleFieldById('msg-phone', !isMeeting && !isAnnouncement);
    toggleFieldById('msg-durasi', isPsikotes);
    toggleFieldById('msg-pic', isOffering);
    toggleFieldById('msg-deadline', isOffering);
    toggleFieldById('msg-gform', isPsikotes);
    toggleFieldById('msg-excel', isPsikotes);
    toggleFieldById('msg-tahap', isReject);

    // Sembunyikan checklist dokumen lamaran jika bukan Interview atau Offering
    const docsField = document.querySelector('input[name="msg-docs"]')?.closest('.field.full');
    if (docsField) {
      docsField.style.display = (isInterview || isOffering) ? 'flex' : 'none';
    }

    // Sembunyikan tab pemilih pelamar/karyawan tunggal saat sedang membuat Undangan Meeting grup
    const targetTabs = document.querySelector('.wa-target-tabs');
    const candField = document.querySelector('#msg-cand')?.closest('.field');
    const empField = document.querySelector('#msg-emp')?.closest('.field');
    if (isMeeting || isAnnouncement) {
      if (targetTabs) targetTabs.style.display = 'none';
      if (candField) candField.style.display = 'none';
      if (empField) empField.style.display = 'none';
    } else {
      if (targetTabs) targetTabs.style.display = 'flex';
    }

    // Buat atau tampilkan Panel Ceklis Peserta & Preset Agenda khusus Meeting
    let panel = document.querySelector('#meeting-custom-panel');
    const formGrid = document.querySelector('#message-form');
    if (!formGrid) return;

    if (!isMeeting) {
      if (panel) panel.style.display = 'none';
      updateMessage();
      return;
    }

    if (!panel) {
      panel = document.createElement('div');
      panel.id = 'meeting-custom-panel';
      panel.className = 'meeting-custom-panel';

      // Gabungkan daftar jabatan di pengaturan dengan daftar standar agar tidak ada yang terlewat
      const allRoles = [...new Set([...PARTICIPANT_ROLES, ...(db.settings.positions || []).filter(p => p !== 'Kepala Cabang')])];
      const currentSelected = (nameInput?.value || '').split(',').map(s => s.trim());

      panel.innerHTML = `
        <div class="meeting-custom-head">
          <span>👥 Ceklis Jabatan Peserta Meeting (Bisa Pilih Banyak Sekaligus)</span>
          <div style="display:flex;gap:6px">
            <button type="button" class="btn sm primary" id="btn-meet-all-kalbar" style="padding:3px 9px;font-size:10.5px">✓ Pilih Seluruh Staff Area Kalbar</button>
            <button type="button" class="btn sm soft" id="btn-meet-pimpinan" style="padding:3px 9px;font-size:10.5px">KA Cabang & KA Pool</button>
            <button type="button" class="btn sm soft" id="btn-meet-clear" style="padding:3px 9px;font-size:10.5px">Reset</button>
          </div>
        </div>
        <div class="participant-checks-grid" id="meet-roles-grid">
          ${allRoles.map((role, idx) => {
            const isChecked = currentSelected.includes(role) || (idx >= 1 && idx <= 3 && !currentSelected.filter(Boolean).length);
            return `
              <label class="part-check-item ${idx === 0 ? 'highlight-all' : ''}">
                <input type="checkbox" name="meet-participant-role" value="${E(role)}" ${isChecked ? 'checked' : ''}>
                <span>${E(role)}</span>
              </label>
            `;
          }).join('')}
        </div>
        <div style="border-top:1px dashed #a8d5c2;padding-top:9px">
          <strong style="font-size:11.5px;color:var(--green-dark);display:block">📌 Pilihan Cepat Topik / Agenda Meeting (Klik untuk mengisi Agenda):</strong>
          <div class="agenda-presets-row">
            ${MEETING_AGENDA_PRESETS.map(ag => `
              <button type="button" class="agenda-preset-pill" data-agenda-preset="${E(ag)}">${E(ag)}</button>
            `).join('')}
          </div>
        </div>
      `;

      const typeField = document.querySelector('#msg-type')?.closest('.field');
      const salamField = document.querySelector('#msg-salam')?.closest('.field');
      const anchor = salamField || typeField;
      if (anchor) anchor.insertAdjacentElement('afterend', panel);
      else formGrid.insertAdjacentElement('afterbegin', panel);

      const syncCheckedToNameInput = () => {
        const checkedVals = [...panel.querySelectorAll('input[name="meet-participant-role"]:checked')].map(c => c.value);
        const inp = document.querySelector('#msg-name');
        if (!inp) return;
        // Jika "Seluruh Staff Area Kalbar" dicentang bersama rincian jabatan lain, gabungkan dengan rapi
        inp.value = checkedVals.join(', ');
        updateMessage();
      };

      panel.querySelectorAll('input[name="meet-participant-role"]').forEach(chk => {
        chk.addEventListener('change', syncCheckedToNameInput);
      });

      panel.querySelector('#btn-meet-all-kalbar')?.addEventListener('click', () => {
        panel.querySelectorAll('input[name="meet-participant-role"]').forEach((c, i) => {
          c.checked = (i === 0);
        });
        syncCheckedToNameInput();
      });

      panel.querySelector('#btn-meet-pimpinan')?.addEventListener('click', () => {
        panel.querySelectorAll('input[name="meet-participant-role"]').forEach(c => {
          c.checked = ['Kepala Cabang (KA Cabang)', 'KA Pool'].includes(c.value);
        });
        syncCheckedToNameInput();
      });

      panel.querySelector('#btn-meet-clear')?.addEventListener('click', () => {
        panel.querySelectorAll('input[name="meet-participant-role"]').forEach(c => c.checked = false);
        syncCheckedToNameInput();
      });

      panel.querySelectorAll('[data-agenda-preset]').forEach(btn => {
        btn.addEventListener('click', () => {
          const pInp = document.querySelector('#msg-position');
          if (pInp) {
            pInp.value = btn.dataset.agendaPreset;
            panel.querySelectorAll('[data-agenda-preset]').forEach(b => b.classList.toggle('active', b === btn));
            updateMessage();
          }
        });
      });

      syncCheckedToNameInput();
    } else {
      panel.style.display = 'block';
      updateMessage();
    }
  }

  document.addEventListener('change', (e) => {
    if (e.target?.id === 'msg-type') {
      setTimeout(syncMeetingFormUI, 20);
    }
  });

  BarakaRuntime.addRenderHook('meeting-10.6', function() {
    if (route === 'messages') {
      syncMeetingFormUI();
      updateMessage();
    }
  });

  if (route === 'messages') {
    syncMeetingFormUI();
    updateMessage();
  }
});
</script>

<!-- ==================== UPGRADE PACK 10.7: FIX EXIT CLEARANCE EFFECTIVE DATE & DYNAMIC FORM BINDING ==================== -->
<script data-baraka-extension="exit-date-10.7">
BarakaRuntime.registerModule('exit-date-10.7', function(){
  'use strict';

  let lastSelectedExitDate = '';
  let lastSelectedExitEmpId = '';

  // Pantau setiap perubahan input tanggal atau dropdown karyawan di dalam modal Exit Clearance
  document.addEventListener('change', function(e) {
    const el = e.target;
    if (!el || !el.closest('#modal')) return;
    if (el.type === 'date' && el.value) {
      lastSelectedExitDate = el.value;
    } else if (el.tagName === 'SELECT' && el.id && el.id.includes('exit')) {
      lastSelectedExitEmpId = el.value;
    }
  }, true);

  document.addEventListener('input', function(e) {
    const el = e.target;
    if (!el || !el.closest('#modal')) return;
    if (el.type === 'date' && el.value) {
      lastSelectedExitDate = el.value;
    }
  }, true);

  // Fungsi pembaca nilai Tanggal Efektif yang mencari ke seluruh kemungkinan input date di modal Exit Clearance
  function resolveExitEffectiveDate() {
    const modalEl = document.querySelector('#modal');
    if (modalEl && modalEl.open) {
      const dateInputs = [...modalEl.querySelectorAll('input[type="date"]')];
      const validInput = dateInputs.find(inp => inp.value && /^\d{4}-\d{2}-\d{2}$/.test(inp.value));
      if (validInput) {
        lastSelectedExitDate = validInput.value;
        return validInput.value;
      }
    }
    const byIds = ['#exit-date', '#exit-effective-date', '#exit-tgl', '#resign-date'];
    for (const sel of byIds) {
      const val = document.querySelector(sel)?.value;
      if (val && /^\d{4}-\d{2}-\d{2}$/.test(val)) return val;
    }
    if (lastSelectedExitDate && /^\d{4}-\d{2}-\d{2}$/.test(lastSelectedExitDate)) {
      return lastSelectedExitDate;
    }
    return HR.today();
  }

  // Fungsi pembaca karyawan yang dipilih di modal Exit Clearance
  function resolveExitEmployee(explicitEmpId) {
    if (explicitEmpId) {
      const found = HR.employee(db, explicitEmpId);
      if (found) return found;
    }
    const modalEl = document.querySelector('#modal');
    if (modalEl && modalEl.open) {
      const selects = [...modalEl.querySelectorAll('select')];
      for (const s of selects) {
        const emp = HR.employee(db, s.value);
        if (emp) {
          lastSelectedExitEmpId = emp.id;
          return emp;
        }
      }
    }
    if (lastSelectedExitEmpId) {
      const emp = HR.employee(db, lastSelectedExitEmpId);
      if (emp) return emp;
    }
    return db.employees[0] || {
      name: 'SIDIQ MAHENDRA',
      code: '600735',
      position: 'DRIVER DISTRIBUSI',
      branch: 'Mempawah',
      startDate: '2024-09-10'
    };
  }

  // Fungsi pembaca baris item aset yang dicentang di dalam modal Exit Clearance
  function resolveExitCheckedItems() {
    const modalEl = document.querySelector('#modal');
    const container = modalEl || document;
    const rows = [...container.querySelectorAll('.asset-check-row:not(.head)')];
    if (!rows.length) return [];

    const items = [];
    rows.forEach(r => {
      const chk = r.querySelector('input[type="checkbox"]');
      if (chk && !chk.checked) return;
      const textInputs = [...r.querySelectorAll('input[type="text"], input:not([type="checkbox"])')];
      const nameVal = (r.querySelector('input[name="it_name"]')?.value ?? textInputs[0]?.value ?? '').trim();
      // Deteksi apakah ada 4 input (name, category, qty, cond) atau 3 input (name, qty, cond)
      let qtyVal = '1 Unit';
      let condVal = 'Baik & Lengkap';
      if (r.querySelector('input[name="it_qty"]')) {
        qtyVal = r.querySelector('input[name="it_qty"]').value.trim();
        condVal = (r.querySelector('input[name="it_cond"]')?.value || '').trim();
      } else if (textInputs.length >= 4) {
        qtyVal = textInputs[2].value.trim();
        condVal = textInputs[3].value.trim();
      } else if (textInputs.length === 3) {
        qtyVal = textInputs[1].value.trim();
        condVal = textInputs[2].value.trim();
      }
      if (nameVal) {
        items.push({ name: nameVal, qty: qtyVal || '-', condition: condVal || 'Lengkap' });
      }
    });
    return items;
  }

  // Override buildExitClearanceHTML agar selalu mengambil tanggal efektif, karyawan & daftar item terbaru dari form
  window.buildExitClearanceHTML = function(empId) {
    const emp = resolveExitEmployee(empId);
    const effectiveDateStr = resolveExitEffectiveDate();
    const effectiveDateIndo = HR.date(effectiveDateStr, { day: 'numeric', month: 'long', year: 'numeric' });
    const startDateIndo = emp.startDate ? HR.date(emp.startDate, { day: 'numeric', month: 'short', year: 'numeric' }) : '-';

    const checkedItems = resolveExitCheckedItems();
    const tableHTML = window.renderExitClearanceTableHTML(checkedItems);
    const personaliaSignSrc = typeof getEmbeddedPersonaliaSignSrc === 'function' ? getEmbeddedPersonaliaSignSrc() : '';

    return `
      <article class="paper doc-official-letter" style="font-family:Arial,Helvetica,sans-serif;line-height:1.55;color:#111;padding:18mm 16mm;box-sizing:border-box;">
        ${barakaDocumentLetterhead(db.settings)}
        
        <div style="text-align:center;margin:8px 0 14px;">
          <h3 style="font-size:14px;margin:0;font-weight:700;text-decoration:underline;text-transform:uppercase;letter-spacing:0.5px;">
            BERITA ACARA SERAH TERIMA ASET & EXIT CLEARANCE KARYAWAN
          </h3>
          <div style="font-size:11.5px;font-weight:700;margin-top:4px;">
            Tanggal Efektif: ${E(effectiveDateIndo)}
          </div>
        </div>

        <table style="width:100%;margin-bottom:12px;font-size:11.5px;border:none !important;">
          <tr>
            <td style="width:145px;padding:3px 0;border:none !important;">Nama Karyawan</td>
            <td style="padding:3px 0;border:none !important;">: <strong>${E(emp.name)}</strong> (NIB: ${E(emp.code || '-')})</td>
          </tr>
          <tr>
            <td style="padding:3px 0;border:none !important;">Jabatan / Cabang</td>
            <td style="padding:3px 0;border:none !important;">: ${E(emp.position)} / Cabang ${E(emp.branch)}</td>
          </tr>
          <tr>
            <td style="padding:3px 0;border:none !important;">Tanggal Mulai Kerja</td>
            <td style="padding:3px 0;border:none !important;">: ${E(startDateIndo)}</td>
          </tr>
        </table>

        ${tableHTML}

        <p style="font-size:11px;text-align:justify;margin:12px 0 24px;line-height:1.5;">
          Dengan ditandatanganinya Berita Acara ini, Pihak Karyawan menyatakan telah menyerahkan seluruh aset, atribut seragam, sarana kerja operasional, serta menyelesaikan seluruh kewajiban administrasi kepada PT Baraka Sarana Tama.
        </p>

        <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:16px;text-align:center;font-size:11.5px;break-inside:avoid;page-break-inside:avoid;">

<script data-baraka-extension="recruitment-hold-10.8">
BarakaRuntime.registerModule('recruitment-hold-10.8', function(){
  'use strict';

  // Pastikan 'Pending / Hold' terdaftar di HR.stages
  if (Array.isArray(HR.stages) && !HR.stages.includes('Pending / Hold')) {
    const idx = HR.stages.indexOf('Diterima');
    if (idx >= 0) HR.stages.splice(idx, 0, 'Pending / Hold');
    else HR.stages.push('Pending / Hold');
  }

  // Filter pengaman ekstra untuk HR.insights dan events() agar kandidat 'Pending / Hold' atau yang baru tahap Lamaran/Screening tanpa jam interview tidak masuk ke Agenda Terdekat
  const origInsights108 = HR.insights;
  HR.insights = function(database, branchFilter = '', now = HR.today()) {
    const list = origInsights108(database, branchFilter, now);
    return list.filter(item => {
      if (item.type === 'Rekrutmen') {
        const c = database.candidates.find(x => x.id === item.entityId);
        if (!c || c.stage === 'Pending / Hold' || c.stage === 'Lamaran' || c.stage === 'Screening') return false;
      }
      return true;
    });
  };

  const origEvents108 = window.events;
  if (typeof origEvents108 === 'function') {
    window.events = function() {
      const evs = origEvents108();
      return evs.filter(e => {
        if (e.type === 'Seleksi') {
          const c = db.candidates.find(x => x.id === e.id);
          if (!c || ['Pending / Hold', 'Diterima', 'Ditolak'].includes(c.stage)) return false;
          // Hanya masukkan ke kalender/agenda jika sudah tahap Interview, Psikotes, atau Offering
          if (['Lamaran', 'Screening'].includes(c.stage) && !c.confirmedSchedule) return false;
        }
        return true;
      });
    };
  }

  // Fungsi memindahkan 1 kandidat ke Pending / Hold
  function holdSingleCandidate(candId) {
    const c = db.candidates.find(x => x.id === candId);
    if (!c) return;
    const prevStage = c.stage;
    mutate('Memindahkan kandidat ke Pending / Hold', () => {
      c.previousStage = prevStage !== 'Pending / Hold' ? prevStage : 'Screening';
      c.stage = 'Pending / Hold';
      c.heldAt = HR.today();
    }, `${c.name} (${c.position} - ${c.branch})`);
    render();
    toast(`⏸️ ${c.name} dipindahkan ke Pending / Hold (dihapus dari Agenda Terdekat).`);
  }

  // Fungsi mengaktifkan kembali kandidat dari Pending / Hold ke Screening / Interview
  function restoreHeldCandidate(candId, targetStage = 'Screening') {
    const c = db.candidates.find(x => x.id === candId);
    if (!c) return;
    mutate('Mengaktifkan kembali kandidat dari Pending / Hold', () => {
      c.stage = targetStage;
    }, `${c.name} -> ${targetStage}`);
    render();
    toast(`▶️ ${c.name} diaktifkan kembali ke tahap ${targetStage}.`);
  }

  // Modal Hold Massal (Bulk Hold) agar bisa mem-pending banyak pelamar G-Form sekaligus
  function openBulkHoldModal() {
    const activeCands = filtered(db.candidates).filter(c => ['Lamaran', 'Screening', 'Interview', 'Psikotes'].includes(c.stage));
    const branchesInCands = [...new Set(activeCands.map(c => c.branch).filter(Boolean))];
    const positionsInCands = [...new Set(activeCands.map(c => c.position).filter(Boolean))];

    modal('⏸️ Hold / Pending Massal Kandidat (Simpan ke Talent Pool Cadangan)',
      notice('Pilih kandidat yang ingin di-<b>Pending / Hold</b> karena kuota posisi sudah terpenuhi atau sudah ada kandidat lain yang terpilih. Kandidat yang di-Hold <b>otomatis hilang dari Agenda Terdekat & Kalender</b>, namun datanya tetap tersimpan aman sebagai cadangan.') +
      `<div class="field-grid" style="margin-bottom:12px">
        <div class="field">
          <label for="bhold-filter-branch">Filter Cepat Cabang</label>
          <select id="bhold-filter-branch">
            <option value="">Semua Cabang (${activeCands.length} pelamar aktif)</option>
            ${branchesInCands.map(b => `<option value="${E(b)}">Cabang ${E(b)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label for="bhold-filter-pos">Filter Cepat Posisi</label>
          <select id="bhold-filter-pos">
            <option value="">Semua Posisi</option>
            ${positionsInCands.map(p => `<option value="${E(p)}">${E(p)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
        <label class="pill-check" style="margin:0;font-weight:700">
          <input type="checkbox" id="bhold-check-all" checked> Pilih Semua yang Tampil di Bawah Ini
        </label>
        <span class="note" id="bhold-count-label">${activeCands.length} kandidat dipilih</span>
      </div>
      <div id="bhold-list-box" style="max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:9px;padding:8px">
        ${activeCands.length ? activeCands.map(c => `
          <label class="pill-check bhold-item" data-branch="${E(c.branch||'')}" data-pos="${E(c.position||'')}" style="padding:7px 10px;border-bottom:1px solid var(--line);margin:0;display:flex;justify-content:space-between">
            <div style="display:flex;align-items:center;gap:8px">
              <input type="checkbox" name="bhold-cand-id" value="${E(c.id)}" checked>
              <div>
                <strong>${E(c.name)}</strong> · <span style="color:var(--green);font-weight:600">${E(c.position)}</span> (${E(c.branch)})
                <div style="font-size:10.5px;color:var(--muted)">Usia: ${E(c.age||'—')} · Pdk: ${E(c.education||'—')} · Ekspektasi: ${c.expectedSalary ? HR.money(c.expectedSalary) : '—'}</div>
              </div>
            </div>
            ${badge(c.stage, 'gray')}
          </label>
        `).join('') : '<p class="note" style="text-align:center;padding:16px">Tidak ada kandidat aktif di tahap Lamaran/Screening.</p>'}
      </div>`,
      actButton('close', 'Batal') +
      `<button type="button" class="btn primary" id="btn-exec-bulk-hold">⏸️ Pindahkan ke Pending / Hold Sekarang</button>`,
      true
    );

    const updateFilterAndCount = () => {
      const fBr = document.querySelector('#bhold-filter-branch')?.value || '';
      const fPos = document.querySelector('#bhold-filter-pos')?.value || '';
      let visibleCount = 0;
      document.querySelectorAll('#bhold-list-box .bhold-item').forEach(row => {
        const matchBr = !fBr || row.dataset.branch === fBr;
        const matchPos = !fPos || row.dataset.pos === fPos;
        const show = matchBr && matchPos;
        row.style.display = show ? 'flex' : 'none';
        const chk = row.querySelector('input[type="checkbox"]');
        if (chk) chk.checked = show;
        if (show) visibleCount++;
      });
      const lbl = document.querySelector('#bhold-count-label');
      if (lbl) lbl.textContent = `${visibleCount} kandidat dipilih`;
    };

    document.querySelector('#bhold-filter-branch')?.addEventListener('change', updateFilterAndCount);
    document.querySelector('#bhold-filter-pos')?.addEventListener('change', updateFilterAndCount);
    document.querySelector('#bhold-check-all')?.addEventListener('change', (ev) => {
      document.querySelectorAll('#bhold-list-box .bhold-item').forEach(row => {
        if (row.style.display !== 'none') {
          const chk = row.querySelector('input[type="checkbox"]');
          if (chk) chk.checked = ev.target.checked;
        }
      });
    });

    document.querySelector('#btn-exec-bulk-hold')?.addEventListener('click', () => {
      const selectedIds = [...document.querySelectorAll('input[name="bhold-cand-id"]:checked')].map(el => el.value);
      if (!selectedIds.length) return toast('Pilih minimal 1 kandidat untuk di-Hold.', true);
      mutate(`Hold massal ${selectedIds.length} kandidat`, () => {
        selectedIds.forEach(id => {
          const c = db.candidates.find(x => x.id === id);
          if (c) {
            c.previousStage = c.stage;
            c.stage = 'Pending / Hold';
            c.heldAt = HR.today();
          }
        });
      }, `${selectedIds.length} pelamar dipindahkan ke Pending / Hold`);
      closeModal();
      render();
      toast(`⏸️ ${selectedIds.length} kandidat berhasil dipindahkan ke Pending / Hold & dihapus dari Agenda Terdekat!`);
    });
  }

  // Sisipkan tombol Hold cepat di setiap kartu kandidat & bar informasi Pending / Hold di halaman Rekrutmen
  function enhanceRecruitmentHoldControls() {
    if (route !== 'recruitment') return;

    const heldCandidates = filtered(db.candidates).filter(c => c.stage === 'Pending / Hold');
    const toolbar = document.querySelector('#content .section-toolbar');

    // Tambahkan Banner & Tombol Bulk Hold di atas Kanban Rekrutmen
    if (toolbar && !document.querySelector('#hold-banner-v108')) {
      const banner = document.createElement('div');
      banner.id = 'hold-banner-v108';
      banner.className = 'hold-banner-bar';
      banner.innerHTML = `
        <div>
          <strong>⏸️ Gudang Talent Pool (Pending / Hold): ${heldCandidates.length} Kandidat Cadangan</strong>
          <span style="margin-left:6px;opacity:0.85">— Kandidat yang di-Hold aman tersimpan & tidak memenuhi Agenda Terdekat.</span>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button type="button" class="btn sm soft" data-v108="open-bulk-hold">⏸️ Hold Massal Kandidat</button>
          <button type="button" class="btn sm ${viewFilter === 'Pending / Hold' ? 'primary' : 'soft'}" data-v108="toggle-view-hold">
            ${viewFilter === 'Pending / Hold' ? '◀ Kembali ke Kanban Aktif' : `📂 Lihat Daftar Pending / Hold (${heldCandidates.length})`}
          </button>
        </div>
      `;
      toolbar.insertAdjacentElement('beforebegin', banner);
    }

    // Tambahkan tombol "⏸️ Hold" 1-klik pada setiap kartu di papan Kanban
    document.querySelectorAll('#content .candidate').forEach(card => {
      const candId = card.dataset.dragId;
      if (!candId || card.querySelector('[data-v108="hold-single"]')) return;

      if (card.classList.contains('minimized')) {
        const header = card.querySelector('.cand-mini-header');
        if (header) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'hold-quick-btn';
          btn.dataset.v108 = 'hold-single';
          btn.dataset.id = candId;
          btn.title = 'Pending / Hold kandidat ini agar tidak masuk agenda';
          btn.textContent = '⏸️ Hold';
          header.appendChild(btn);
        }
      } else {
        const foot = card.querySelector('.foot > div');
        if (foot) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'hold-quick-btn';
          btn.dataset.v108 = 'hold-single';
          btn.dataset.id = candId;
          btn.title = 'Pending / Hold kandidat ini';
          btn.textContent = '⏸️ Hold';
          foot.insertBefore(btn, foot.firstChild);
        }
      }
    });

    // Jika sedang melihat tabel Pending / Hold, tambahkan tombol "▶️ Aktifkan Lagi"
    if (viewFilter === 'Pending / Hold') {
      const rows = document.querySelectorAll('#content tbody tr');
      rows.forEach((tr, idx) => {
        const c = heldCandidates[idx];
        const actBox = tr.querySelector('.table-actions');
        if (c && actBox && !actBox.querySelector('[data-v108="restore-single"]')) {
          const restoreBtn = document.createElement('button');
          restoreBtn.type = 'button';
          restoreBtn.className = 'btn sm primary';
          restoreBtn.dataset.v108 = 'restore-single';
          restoreBtn.dataset.id = c.id;
          restoreBtn.textContent = '▶️ Aktifkan ke Screening';
          actBox.insertBefore(restoreBtn, actBox.firstChild);
        }
      });
    }
  }

  document.addEventListener('click', (e) => {
    const btn = e.target.closest?.('[data-v108]');
    if (!btn) return;
    e.preventDefault();
    e.stopImmediatePropagation();

    const act = btn.dataset.v108;
    if (act === 'hold-single') {
      holdSingleCandidate(btn.dataset.id);
    } else if (act === 'restore-single') {
      restoreHeldCandidate(btn.dataset.id, 'Screening');
    } else if (act === 'open-bulk-hold') {
      openBulkHoldModal();
    } else if (act === 'toggle-view-hold') {
      viewFilter = (viewFilter === 'Pending / Hold') ? '' : 'Pending / Hold';
      render();
    }
  }, true);

  BarakaRuntime.addRenderHook('recruitment-hold-10.8', function() {
    enhanceRecruitmentHoldControls();
  });

  enhanceRecruitmentHoldControls();
});
</script>

async function opsRunCloudAction(action){
  const r=OPS_REMOTE_STATE;

  const configPayload=action==='save-config'?opsCollectCloudConfig():null;
  if(action!=='save-config'&&Object.keys(r.draft||{}).length)throw new Error('Ada perubahan konfigurasi yang belum disimpan. Klik Simpan konfigurasi terlebih dahulu.');
  r.busy=true;r.error='';render();
  try{
    if(action==='cloud-refresh'){
      const result=await opsServerCall('getOpsBootstrap');r.config=result.branches||[];r.destinationMapText=result.destinationMapText||'010SBY=SURABAYA BARAT';r.connected=true;r.loaded=true;r.message='Koneksi Apps Script aktif'+(result.userEmail?' · '+result.userEmail:'');r.scan=null;r.preview=null;r.commitResult=null;
    }else if(action==='save-config'){
      const result=await opsServerCall('saveOpsConfig',configPayload);r.config=result.branches||[];r.destinationMapText=configPayload.destinationMap||'010SBY=SURABAYA BARAT';r.draft={};r.message='Konfigurasi cabang berhasil disimpan. Versi '+result.configVersion+'.';r.scan=null;r.preview=null;r.commitResult=null;
    }else if(action==='setup-folders'){
      const result=await opsServerCall('setupOpsUploadFolders');r.folderResults=result.results||[];const boot=await opsServerCall('getOpsBootstrap');r.config=boot.branches||[];r.destinationMapText=boot.destinationMapText||'010SBY=SURABAYA BARAT';r.message='Penyiapan folder selesai. Periksa hasil per cabang.';
    }else if(action==='create-date-folders'){
      const result=await opsServerCall('createOpsDateFolders',OPS_STATE.selectedDate);r.folderResults=result.results||[];r.message='Folder tanggal '+OPS_STATE.selectedDate+' telah disiapkan untuk cabang yang berhasil.';
    }else if(action==='test-config'){
      r.testResult=await opsServerCall('testOpsConfig',OPS_STATE.selectedDate);r.message=r.testResult.ok?'Seluruh konfigurasi berhasil diuji.':'Sebagian konfigurasi masih perlu diperbaiki.';
    }else if(action==='scan-drive'){
      r.scan=await opsServerCall('scanOpsDrive',OPS_STATE.selectedDate);r.preview=null;r.commitResult=null;r.message='Pemindaian Drive selesai. Belum ada data yang ditulis.';
    }else if(action==='preview-drive'){
      r.preview=await opsServerCall('previewOpsSync',OPS_STATE.selectedDate);r.scan=r.preview;r.commitResult=null;r.message='Pratinjau selesai. Belum ada data yang ditulis ke spreadsheet.';
    }else if(action==='commit-drive'){
      if(!r.preview?.previewToken||!r.preview?.canCommit)throw new Error('Jalankan pratinjau yang valid sebelum sinkronisasi.');
      const s=r.preview.summary||{};
      const ok=confirm('Lanjutkan sinkronisasi tanggal '+OPS_STATE.selectedDate+'?\n\nFile siap: '+s.readyFiles+'\nDatot baru: '+s.newDatotRows+' baris\nAbsensi baru: '+s.newAttendanceRows+' baris\nFile tertahan: '+s.blockedFiles+'\n\nHanya file valid yang akan diproses. Data lama tidak dihapus.');
      if(!ok)return;
      r.commitResult=await opsServerCall('commitOpsSync',OPS_STATE.selectedDate,r.preview.previewToken);r.preview=null;r.scan=null;r.message='Proses sinkronisasi selesai. Periksa rincian hasil dan log audit.';
    }
  }catch(error){r.error=error.message||String(error);}
  finally{r.busy=false;render();}
}

async function opsLoadFiles(fileList,kind){
  const files=[...fileList];if(!files.length)return;
  for(const file of files){
    const id='ops_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
    const base={id,kind,fileName:file.name,sizeBytes:file.size,lastModified:file.lastModified,branchId:'',records:[],warnings:[],error:''};
    if(OPS_STATE.items.some(x=>x.kind===kind&&x.fileName===file.name&&x.sizeBytes===file.size&&x.lastModified===file.lastModified)){continue;}
    try{
      if(file.size>OPS_MAX_FILE_BYTES)throw Error('Ukuran file melebihi 15 MB.');
      let parsed;
      if(kind==='datot')parsed=opsParseDatotHTML(await file.text(),file.name);
      else parsed=await opsParseAttendanceXlsx(file);
      OPS_STATE.items.push({...base,...parsed,id,branchId:''});
    }catch(error){OPS_STATE.items.push({...base,error:error?.message||'File gagal dibaca.'});}
  }
  OPS_STATE.lastValidation=null;render();
  toast((files.length)+' file diproses. File yang sama dalam sesi ini tidak ditambahkan dua kali.');
}
async function opsHandleAction(action,button){
  if(['cloud-refresh','save-config','setup-folders','create-date-folders','test-config','scan-drive','preview-drive','commit-drive'].includes(action)){await opsRunCloudAction(action);return;}
  if(action==='upload-datot'){$('#ops-datot-files')?.click();return;}
  if(action==='upload-attendance'){$('#ops-attendance-files')?.click();return;}
  if(action==='remove-file'){OPS_STATE.items=OPS_STATE.items.filter(x=>x.id!==button.dataset.id);OPS_STATE.lastValidation=null;render();return;}
  if(action==='clear'){
    if(!OPS_STATE.items.length)return toast('Belum ada file yang perlu dibersihkan.');
    if(!confirm('Hapus seluruh pratinjau file dari sesi ini? File asli di perangkat tidak akan dihapus.'))return;
    OPS_STATE.items=[];OPS_STATE.lastValidation=null;render();toast('Pratinjau sesi dibersihkan.');return;
  }
  if(action==='validate'){
    const result=opsValidateAll();render();
    toast(result.valid?'Validasi berhasil. Semua file siap ditinjau.':`Validasi menemukan ${result.messages.length} catatan yang perlu diperiksa.`,!result.valid);return;
  }
}

    event.stopImmediatePropagation();const item=OPS_STATE.items.find(x=>x.id===el.dataset.opsBranch);if(item){item.branchId=el.value;OPS_STATE.lastValidation=null;render();}return;
  }
},true);

// Re-render the shell once so the new navigation entry is visible. Existing PeopleOS routes remain unchanged.
render();
});
