.tab-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab-pill{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer}
.tab-pill.active{background:var(--green);color:#fff;border-color:var(--green)}
.filter-card-sub{background:var(--mint);padding:12px 14px;border-radius:9px;border:1px solid var(--line);margin:10px 0}

.candidate{transition:all .15s ease}
.candidate.minimized{padding:9px 12px;cursor:pointer;border-left:3px solid #78b59d}
.candidate.minimized:hover{background:var(--mint);border-color:var(--green)}
.cand-mini-header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cand-mini-name{font-size:12px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px}
.cand-mini-meta{font-size:10.5px;color:var(--muted);white-space:nowrap}
.cand-mini-meta b{color:var(--green);font-weight:600}
.cand-mini-toggle{font-size:9.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--surface)}
.cand-rich-info{margin:7px 0;padding:8px 10px;background:var(--bg);border-radius:8px;border:1px solid var(--line);font-size:11px;line-height:1.45}
.cand-rich-info div{display:flex;justify-content:space-between;gap:6px;margin-bottom:3px}
.cand-rich-info span{color:var(--muted)}
.cand-rich-info strong{color:var(--text)}
.cand-exp-box{margin-top:4px;padding-top:4px;border-top:1px dashed var(--line);font-size:10.5px;color:var(--text);white-space:normal}
.cand-exp-box strong{color:var(--green-dark);display:block;margin-bottom:1px}
.cv-link-btn{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--green);padding:4px 8px;border-radius:6px;background:var(--mint);border:1px solid #bfe3d3;margin-top:4px;text-decoration:none}
.cv-link-btn:hover{background:var(--green);color:#fff}
.batch-queue-box{max-height:360px;overflow-y:auto;border:1px solid var(--line);border-radius:9px;padding:8px}
.batch-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:7px;border-bottom:1px solid var(--line)}
.batch-item.sent{background:var(--mint);opacity:.7}
</style>
<script data-baraka-extension="hr-workflows-7.6">
BarakaRuntime.registerModule('hr-workflows-7.6', function(){
  'use strict';

  const MONTHLY_SOP_TEMPLATES = [
    { day: 5,  title: 'REKAP ABSENSI & AUDIT KETERLAMBATAN CABANG', category: 'Absensi', priority: 'Tinggi' },
    { day: 7,  title: 'BIKIN PENGAJUAN SUBSIDI SOPIR LUAR KOTA PORT PONTIANAK', category: 'General affair', priority: 'Tinggi' },
    { day: 15, title: 'EVALUASI KONTRAK PKWT & MASA BERLAKU SIM DRIVER', category: 'Administrasi', priority: 'Sedang' },
    { day: 25, title: 'FINALISASI DRAF PAYROLL & POTONGAN ABSENSI', category: 'Payroll', priority: 'Tinggi' },
    { day: 26, title: 'BUDGETING BPJS KESEHATAN BULAN BERIKUTNYA', category: 'Payroll', priority: 'Tinggi' },
    { day: 27, title: 'MINTA MT KIRIM LAPORAN MT', category: 'Administrasi', priority: 'Sedang' },
    { day: 28, title: 'CETAK STRUK GAJI KARYAWAN', category: 'Payroll', priority: 'Tinggi' }
  ];

  const PIC_CONSTANT_OPTIONS = ['Kepala Cabang', 'Kepala Port', 'Personalia', 'Korwil'];

  const ID_MONTHS = {
    januari:'01', februari:'02', pebruari:'02', maret:'03', april:'04', mei:'05', juni:'06',
    juli:'07', agustus:'08', september:'09', oktober:'10', november:'11', nopember:'11', desember:'12',
    jan:'01', feb:'02', mar:'03', apr:'04', jun:'06', jul:'07', agu:'08', ags:'08', sep:'09', okt:'10', nov:'11', des:'12'
  };

  let activeCategoryTab = '';
  let manuallyExpandedCards = new Set();
  let batchSentTracker = new Set();
  let waTargetMode = 'candidate';

  // Validasi dan pemulihan URL CV yang valid (harus diawali http:// atau https://)
  function getValidCvUrl(c){
    if(!c) return '';
    const raw = String(c.cvLink || '').trim();
    const mDirect = raw.match(/https?:\/\/[^\s,]+/i);
    if(mDirect) return mDirect[0];
    // Cek jika URL sempat tersimpan di dalam notes kandidat
    const notesStr = String(c.notes || '');
    const mNotes = notesStr.match(/https?:\/\/(drive|docs)\.google\.com\/[^\s,]+/i);
    if(mNotes) return mNotes[0];
    return '';
  }

  // Bersihkan kandidat lama di db yang cvLink-nya terisi teks pengalaman kerja bukan URL
  db.candidates.forEach(c => {
    const valid = getValidCvUrl(c);
    if(c.cvLink && !/^https?:\/\//i.test(c.cvLink)){
      if(!c.experience) c.experience = c.cvLink;
      c.cvLink = valid;
    } else if(!c.cvLink && valid){
      c.cvLink = valid;
    }
  });

  function parseIndoDate(raw){
    if(!raw) return '';
    let s = String(raw).trim();
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    let mIndo = s.match(/^(\d{1,2})\s+([a-zA-Z]+)\s+(\d{4})$/);
    if(mIndo){
      let d = mIndo[1].padStart(2,'0');
      let mo = ID_MONTHS[mIndo[2].toLowerCase()];
      if(mo) return `${mIndo[3]}-${mo}-${d}`;
    }
    let mSlash = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(mSlash){
      return `${mSlash[3]}-${mSlash[2].padStart(2,'0')}-${mSlash[1].padStart(2,'0')}`;
    }
    return '';
  }

  // 1. KARTU DISTRIBUSI KARYAWAN PER CABANG
  function enhanceBranchDistributionCard(){
    if(route !== 'dashboard') return;
    const cards = [...document.querySelectorAll('#content .card')];
    const distCard = cards.find(c => {
      const h2 = c.querySelector('h2')?.textContent || '';
      return h2.includes('Distribusi');
    });
    if(!distCard) return;

    const h2El = distCard.querySelector('h2');
    if(h2El) h2El.innerHTML = `Distribusi karyawan per cabang`;
    const descEl = distCard.querySelector('.card-head p');
    if(descEl) descEl.innerHTML = `Kekuatan personel aktif regional Kalimantan Barat (Klik baris cabang untuk melihat daftar karyawan)`;

    const cardBodyEl = distCard.querySelector('.card-body');
    if(!cardBodyEl) return;

    const branchData = db.settings.branches.map(b => {
      const bEmps = HR.activeEmployees(db).filter(e => e.branch === b.name);
      return { name: b.name, total: bEmps.length, emps: bEmps };
    });

    const maxCount = Math.max(1, ...branchData.map(b => b.total));

    cardBodyEl.innerHTML = branchData.map(b => {
      const pct = Math.round((b.total / maxCount) * 100);
      return `
      <div class="branch-clickable-row" data-hrd76="view-branch" data-branch="${E(b.name)}" title="Klik untuk melihat daftar karyawan Cabang ${E(b.name)}">
        <div class="branch-row" style="pointer-events:none">
          <span><strong>${E(b.name)}</strong></span>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <strong style="text-align:right;color:var(--green)">${b.total} org ➔</strong>
        </div>
      </div>`;
    }).join('');
  }

  function openBranchEmployeesModal(branchName){
    const bEmps = HR.activeEmployees(db).filter(e => e.branch === branchName);
    const counts = { STAFF: 0, TKBM: 0, SOPIR: 0, 'NON-STAFF': 0 };
    bEmps.forEach(e => {
      const cat = (e.pusatMeta?.categoryTab || '').toUpperCase();
      if(counts[cat] !== undefined) counts[cat]++;
    });

    modal(`🏢 Personel Cabang ${branchName} (${bEmps.length} Orang)`,
      notice(`Rincian kekuatan personel aktif di <b>${branchName}</b>: <b>${counts.STAFF} Staff</b> · <b>${counts.SOPIR} Sopir</b> · <b>${counts.TKBM} TKBM</b> · <b>${counts['NON-STAFF']} Non-Staff</b>.`) +
      `<div style="margin-bottom:10px">
        <input type="text" id="branch-modal-search" class="filter-input" style="width:100%" placeholder="🔍 Cari nama, NIB, atau jabatan di cabang ${E(branchName)}...">
      </div>
      <div class="branch-emp-list" id="branch-modal-list">
        ${bEmps.length ? bEmps.map((e, idx) => {
          const m = e.pusatMeta || {};
          return `
          <div class="branch-emp-item" data-search-text="${E((e.name+' '+e.code+' '+e.position+' '+(m.categoryTab||'')).toLowerCase())}">
            <div style="display:flex;align-items:center;gap:11px">
              ${avatar(e.name)}
              <div>
                <strong style="font-size:13px">${idx+1}. ${E(e.name)}</strong>
                <div style="font-size:11px;color:var(--muted);margin:2px 0">
                  NIB: <b>${E(e.code)}</b> · ${E(e.position)} ${m.categoryTab ? badge(m.categoryTab, 'blue') : ''}
                </div>
                <div style="font-size:11px;color:var(--text)">
                  ${e.phone ? `WA: <span style="color:var(--green);font-weight:600">${E(e.phone)}</span>` : '<span style="color:var(--muted)">Tanpa WA</span>'} 
                  · Masa Kerja: <b>${E(m.tenureText || (e.startDate ? Math.max(0,Math.floor(HR.days(HR.today(),e.startDate)/30))+' bln' : '—'))}</b>
                </div>
              </div>
            </div>
            <div style="display:flex;gap:6px">
              ${e.phone ? `<button type="button" class="btn sm soft" data-action="employee-message" data-id="${E(e.id)}">💬 WA</button>` : ''}
              <button type="button" class="btn sm primary" data-action="profile" data-id="${E(e.id)}">Profil</button>
            </div>
          </div>`;
        }).join('') : '<p class="note" style="padding:18px;text-align:center">Belum ada karyawan aktif yang tercatat di cabang ini.</p>'}
      </div>`,
      actButton('close','Tutup'),
      true
    );

    const searchInput = document.querySelector('#branch-modal-search');
    if(searchInput){
      searchInput.addEventListener('input', () => {
        const q = searchInput.value.toLowerCase().trim();
        document.querySelectorAll('#branch-modal-list .branch-emp-item').forEach(row => {
          row.style.display = (!q || row.dataset.searchText.includes(q)) ? 'flex' : 'none';
        });
      });
    }
  }

  // 2. SANITISASI TEKS & GENERATOR PESAN WHATSAPP RESMI
  function sanitizeWaNotes(rawNotes){
    if(!rawNotes) return '';
    const cleanLines = String(rawNotes).split('\n').filter(line => {
      const l = line.trim().toUpperCase();
      return !l.startsWith('WAKTU MASUK:') &&
             !l.startsWith('LINK CV:') &&
             !l.startsWith('SUMBER FORM:') &&
             !l.startsWith('SUMBER:') &&
             !l.startsWith('KONTAK DARURAT:') &&
             !l.includes('DRIVE.GOOGLE.COM');
    });
    return cleanLines.join('\n').trim();
  }

  window.buildMessage = function(m){
    const salam = (m.salam || 'Pagi').toLowerCase();
    const name = m.recipient || 'Bapak/Ibu';
    const job = m.position || 'Karyawan';
    const cleanNotes = sanitizeWaNotes(m.notes);
    const b = db.settings.branches.find(x => x.name === m.branch) || db.settings.branches[0];
    const hariTgl = HR.date(m.date, {weekday:'long', day:'numeric', month:'long', year:'numeric'});
    const jamStr = (m.time || '09:00').replace(':', '.') + ' WIB';
    const rentangPsikotes = jamRangeWIB(m.time || '09:00', m.durasiPsikotes || 120);
    const lokOffline = b ? `Kantor Baraka Express Cabang ${b.name}\n   ${b.address}\n   Maps: ${b.maps}` : `Cabang ${m.branch || 'Pontianak'}`;
    const lokStr = m.mode === 'Online' ? (m.link || db.settings.linkMeet || '(Tautan Google Meet menyusul)') : lokOffline;
    const dokList = (m.docs && m.docs.length) ? m.docs.map(d => '• ' + d).join('\n') : '• Sesuai arahan Tim HRD';
    const kontak = db.settings.contact || 'Tim HRD Baraka Express';
    const footer = `\n\nHormat kami,\n*${db.settings.officer}*\n${db.settings.title} — ${db.settings.company}\n_PT Baraka Sarana Tama Regional Kalimantan Barat_`;

    if(m.type === 'Undangan interview'){
      const dokSec = m.mode === 'Offline'
        ? `*Kelengkapan Berkas yang Dibawa:*\n${dokList}\n\n`
        : `*Kelengkapan Berkas (Kirim PDF via WA sebelum jadwal):*\n${dokList}\n\n`;
      return `*UNDANGAN INTERVIEW KERJA — BARAKA EXPRESS*\n\nSelamat ${salam}, Sdr/i. *${name}*.\n\nTerima kasih atas ketertarikan Anda melamar posisi *${job}* di Baraka Express. Berdasarkan hasil seleksi administrasi, kami mengundang Anda untuk mengikuti sesi wawancara (${m.mode === 'Offline' ? 'Tatap Muka' : 'Online'}) pada:\n\n• *Hari/Tanggal:* ${hariTgl}\n• *Pukul:* ${jamStr}\n• *${m.mode === 'Offline' ? 'Lokasi' : 'Tautan Meet'}:* ${lokStr}\n\n${dokSec}${cleanNotes ? `*Catatan Tambahan:*\n${cleanNotes}\n\n` : ''}Mohon hadir tepat waktu dan berpakaian rapi bersepatu. Konfirmasi kehadiran Anda dengan membalas pesan ini:\n👉 *BERSEDIA* / *TIDAK BERSEDIA*\n\n📞 *Kontak HRD:* ${kontak}${footer}`;
    }

    if(m.type === 'Undangan psikotes (Info Awal)'){
      return `*UNDANGAN SELEKSI PSIKOTES — BARAKA EXPRESS*\n\nSelamat ${salam}, Sdr/i. *${name}*.\n\nTerima kasih telah mengikuti tahapan seleksi posisi *${job}* di Baraka Express. Kami informasikan bahwa Anda dinyatakan lolos untuk mengikuti tahap *Seleksi Psikotes Online* yang terdiri dari:\n1. Tes Psikotes (logika, hitungan & pengetahuan dasar) via Google Form\n2. Tes Praktik Microsoft Excel (dikerjakan & dikirim kembali ke WhatsApp ini)\n\n*Jadwal Pelaksanaan:*\n• *Hari/Tanggal:* ${hariTgl}\n• *Waktu Pengerjaan:* Pukul ${rentangPsikotes} (Durasi ${m.durasiPsikotes || 120} menit)\n\n*Ketentuan Pengerjaan:*\n• Tautan soal Google Form dan file Excel akan dikirimkan tepat pada jam pelaksanaan setelah Anda mengonfirmasi kesiapan.\n• Khusus tes praktik Excel wajib dikerjakan menggunakan laptop/komputer dengan koneksi internet yang stabil.\n\n${cleanNotes ? `*Catatan Tambahan:*\n${cleanNotes}\n\n` : ''}Mohon konfirmasi kesediaan Anda dengan membalas pesan ini:\n👉 *BERSEDIA* — siap mengikuti psikotes sesuai jadwal\n👉 *TIDAK BERSEDIA* — berhalangan\n\n📞 *Kontak HRD:* ${kontak}${footer}`;
    }

    if(m.type === 'Pengiriman link soal psikotes'){
      return `*LEMBAR KERJA TES PSIKOTES — BARAKA EXPRESS*\n\nSelamat ${salam}, Sdr/i. *${name}*.\n\nBerikut adalah tautan pengerjaan Seleksi Psikotes untuk posisi *${job}*:\n\n*1. Tes Psikotes (Google Form):*\n${m.linkGform || db.settings.linkGform || '(Tautan Google Form belum diisi)'}\n_(Kirimkan tangkapan layar/screenshot bukti submit ke chat ini setelah selesai)_\n\n*2. Tes Praktik Microsoft Excel:*\n${m.linkExcel || db.settings.linkExcel || '(Tautan soal Excel belum diisi)'}\n_(Unduh soal, kerjakan di laptop/komputer, lalu kirimkan file hasilnya ke chat ini)_\n\n*Batas Waktu Pengerjaan:*\n• *Hari/Tanggal:* ${hariTgl}\n• *Rentang Waktu:* Pukul ${rentangPsikotes} (${m.durasiPsikotes || 120} menit)\n\n${cleanNotes ? `*Catatan Penting:*\n${cleanNotes}\n\n` : ''}Pastikan bukti screenshot dan file hasil kerja dikirimkan sebelum batas waktu berakhir. Selamat mengerjakan!${footer}`;
    }

    if(m.type === 'Penawaran bergabung (Offering)'){
      const dl = HR.date(m.deadlineDate || m.date, {weekday:'long', day:'numeric', month:'long', year:'numeric'});
      const pic = m.picCabang || 'Kepala Cabang';
      return `*PENAWARAN KERJA (OFFERING) — BARAKA EXPRESS*\n\nSelamat ${salam}, Sdr/i. *${name}*.\n\nSelamat! Berdasarkan hasil seluruh rangkaian tahapan seleksi yang telah Anda ikuti, Manajemen PT Baraka Sarana Tama menyatakan Anda *LULUS* dan diterima bergabung untuk penempatan:\n\n• *Posisi / Jabatan:* ${job}\n• *Hari Pertama Kerja:* ${hariTgl}\n• *Pukul:* ${jamStr}\n• *Bertemu PIC:* *${pic}*\n• *Lokasi Penempatan:* ${lokOffline}\n\n*Kelengkapan Berkas Administrasi yang Dibawa:*\n${dokList}\n\n${cleanNotes ? `*Ketentuan Tambahan:*\n${cleanNotes}\n\n` : ''}Mohon konfirmasi penerimaan penawaran kerja ini paling lambat pada *${dl}* dengan membalas:\n👉 *BERSEDIA BERGABUNG* / *MENGUNDURKAN DIRI*\n\n📞 *Kontak HRD:* ${kontak}\nSelamat bergabung bersama keluarga besar Baraka Express!${footer}`;
    }

    if(m.type === 'Belum lolos seleksi'){
      return `*PEMBERITAHUAN HASIL SELEKSI — BARAKA EXPRESS*\n\nSelamat ${salam}, Sdr/i. *${name}*.\n\nTerima kasih atas waktu dan partisipasi Anda dalam mengikuti ${m.tahapTolak || 'proses seleksi'} untuk posisi *${job}* di Baraka Express.\n\nBerdasarkan hasil evaluasi menyeluruh serta keterbatasan kuota formasi saat ini, kami sampaikan bahwa Anda belum dapat kami lanjutkan ke tahap berikutnya.\n\nData profil Anda telah kami simpan di dalam *Talent Pool* PT Baraka Sarana Tama apabila terdapat kebutuhan formasi yang sesuai di masa mendatang.\n\nKami mendoakan kesuksesan karier Anda selanjutnya.${footer}`;
    }

    if(m.type === 'Follow-up / reschedule jadwal'){
      return `*KONFIRMASI & PEMBARUAN JADWAL — BARAKA EXPRESS*\n\nSelamat ${salam}, Sdr/i. *${name}* (${job}).\n\nMenindaklanjuti proses seleksi/administrasi Anda di Baraka Express, mohon konfirmasi kehadiran Anda untuk jadwal berikut:\n\n• *Hari/Tanggal:* ${hariTgl}\n• *Pukul:* ${jamStr}\n• *Lokasi/Metode:* ${lokStr}\n\n${cleanNotes ? `*Catatan:*\n${cleanNotes}\n\n` : ''}Mohon membalas pesan ini dengan *BERSEDIA* atau *TIDAK BERSEDIA*.\n📞 *Kontak HRD:* ${kontak}${footer}`;
    }

    if(m.type === 'Undangan meeting koordinasi'){
      return `*UNDANGAN MEETING KOORDINASI — BARAKA EXPRESS KALBAR*\n\nSelamat ${salam}, Rekan-rekan Baraka Express (${name}).\n\nSehubungan dengan agenda koordinasi operasional Area Kalimantan Barat, kami mengundang rekan-rekan untuk hadir pada:\n\n• *Agenda:* ${job}\n• *Peserta:* ${name}\n• *Hari/Tanggal:* ${hariTgl}\n• *Pukul:* ${jamStr}\n• *${m.mode === 'Offline' ? 'Lokasi' : 'Tautan Meet'}:* ${lokStr}\n\n${cleanNotes ? `*Catatan Persiapan:*\n${cleanNotes}\n\n` : ''}Mohon hadir tepat waktu. Terima kasih atas kerja samanya.${footer}`;
    }

    if(m.type === 'Panggilan BA Kejadian / Insiden'){
      return `*TINDAK LANJUT DOKUMEN BA KEJADIAN — PERSONALIA*\n\nSelamat ${salam}, Sdr/i. *${name}* (${job} - Cabang ${m.branch}).\n\nMenindaklanjuti laporan insiden operasional cabang, Tim Personalia mewajibkan penyerahan dokumen *Berita Acara (BA) Kejadian* lengkap beserta bukti pendukung paling lambat pada:\n\n• *Hari/Tanggal:* ${hariTgl}\n• *Batas Waktu:* ${jamStr}\n\n*Kelengkapan Wajib:*\n${cleanNotes || '• Formulir BA Kejadian yang ditandatangani Saksi & Kepala Cabang\n• Foto dokumentasi bukti kejadian\n• Kronologi tertulis lengkap'}\n\nMohon segera ditindaklanjuti sesuai SOP perusahaan.\n📞 *Kontak Personalia:* ${kontak}${footer}`;
    }

    if(m.type === 'Teguran disiplin / absensi / SP'){
      return `*PANGGILAN KLARIFIKASI & PEMBINAAN DISIPLIN — PERSONALIA*\n\nSelamat ${salam}, Sdr/i. *${name}* (${job} - Cabang ${m.branch}).\n\nBerdasarkan evaluasi kedisiplinan dan rekapitulasi absensi Personalia Daerah Kalimantan Barat, bersama ini kami menyampaikan panggilan klarifikasi/pembinaan pada:\n\n• *Hari/Tanggal:* ${hariTgl}\n• *Pukul:* ${jamStr}\n\n*Rincian Catatan Personalia:*\n${cleanNotes || 'Tercatat keterlambatan/ketidakhadiran yang memerlukan klarifikasi resmi sesuai Peraturan Perusahaan.'}\n\nMohon konfirmasi dan hadir tepat waktu.\n📞 *Kontak Personalia:* ${kontak}${footer}`;
    }

    if(m.type === 'Konfirmasi klaim medis / BPJS'){
      return `*INFORMASI KLAIM MEDIS & BENEFIT — BARAKA EXPRESS*\n\nSelamat ${salam}, Sdr/i. *${name}* (${job} - Cabang ${m.branch}).\n\nBerikut informasi status pengajuan klaim biaya pengobatan / benefit BPJS Anda:\n\n*Rincian Status & Catatan Personalia:*\n${cleanNotes || 'Pengajuan klaim telah diverifikasi. Pastikan kwitansi asli berstempel dan rincian diagnosa telah diserahkan ke Personalia.'}\n\n📞 *Kontak Personalia:* ${kontak}${footer}`;
    }

    return `*PENGUMUMAN RESMI PERSONALIA — BARAKA EXPRESS KALBAR*\n\n*Perihal:* ${job}\n*Tanggal Berlaku:* ${hariTgl}\n*Kepada:* ${name}\n\nSelamat ${salam}, Seluruh Rekan Baraka Express Area Kalimantan Barat.\n\nBersama ini Personalia menyampaikan ketentuan berikut:\n\n${cleanNotes || '(Tuliskan isi pengumuman operasional di kolom Catatan Tambahan)'}\n\nDemikian pengumuman ini disampaikan untuk dilaksanakan dengan penuh tanggung jawab.${footer}`;
  };

  // 3. KUSTOMISASI FORM KOMUNIKASI WA
  function enhanceWaCommunicationView(){
    if(route !== 'messages') return;
    const formGrid = document.querySelector('#message-form');
    if(!formGrid) return;

    const picEl = document.querySelector('#msg-pic');
    if(picEl && picEl.tagName === 'INPUT'){
      const currentVal = PIC_CONSTANT_OPTIONS.includes(picEl.value) ? picEl.value : 'Kepala Cabang';
      const selectEl = document.createElement('select');

      table(['Karyawan & NIB', 'Cabang & Jabatan', 'Data yang Kurang / Kosong', 'Aksi Cepat HRD'],

      </div>

  function extractSheetOrFolderId(str){
    const clean = str.trim();
    const mFolder = clean.match(/\/folders\/([a-zA-Z0-9-_]+)/);
    if(mFolder) return { type: 'folder', id: mFolder[1] };
    const mSheet = clean.match(/\/d\/([a-zA-Z0-9-_]+)/);
    if(mSheet) return { type: 'sheet', id: mSheet[1] };
    return { type: 'sheet', id: clean };
  }

  async function executePullForms(){
    const rawInput = document.querySelector('#gform-sheets-input')?.value.trim() || '';
    const scriptUrl = auxGet('baraka_pusat_readonly_url') || '';
    if(!scriptUrl) throw Error('Harap hubungkan URL Google Apps Script terlebih dahulu di menu Sync Database Cabang.');
    if(!rawInput) throw Error('Masukkan minimal satu link/ID Spreadsheet Respons atau link Folder FORMULIR.');

    auxSet('baraka_gform_sheets', rawInput);

    const lines = rawInput.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean);
    const sheetIds = [];
    let folderId = '';

    lines.forEach(item => {
      const parsed = extractSheetOrFolderId(item);
      if(parsed.type === 'folder') folderId = parsed.id;
      else sheetIds.push(parsed.id);
    });

    const skipColored = document.querySelector('#gform-skip-colored')?.checked ? 'true' : 'false';
    const startDate = document.querySelector('#gform-start-date')?.value || '';
    const endDate   = document.querySelector('#gform-end-date')?.value || '';
    const defaultStage = document.querySelector('#gform-default-stage')?.value || 'Screening';
    const autoMatchPsi = document.querySelector('#gform-auto-match-psi')?.value === 'yes';

    toast('⏳ Membaca data pelamar & mengekstrak Link Google Drive CV asli...');
    const sep = scriptUrl.includes('?') ? '&' : '?';
    let fullUrl = `${scriptUrl}${sep}action=form_responses&skipColored=${skipColored}`;
    if(sheetIds.length) fullUrl += `&sheetIds=${encodeURIComponent(sheetIds.join(','))}`;
    if(folderId) fullUrl += `&folderId=${encodeURIComponent(folderId)}`;
    if(startDate) fullUrl += `&startDate=${encodeURIComponent(startDate)}`;
    if(endDate) fullUrl += `&endDate=${encodeURIComponent(endDate)}`;

    BarakaSafety.safeURL(fullUrl,{httpsOnly:true});
    const res = await fetch(fullUrl, { method: 'GET', redirect: 'follow',credentials:(['script.google.com','script.googleusercontent.com'].includes(new URL(fullUrl).hostname)?'omit':'include'),signal:AbortSignal.timeout(20000) });
    if(!res.ok)throw Error('Konektor HTTP '+res.status+'. Periksa akses privat dan izin akun.');
    const data = await res.json();
    BarakaSafety.inspect(data);
    if(data.status === 'error') throw Error('Google Script Error: ' + data.message);

    BarakaSafety.inspect(data);
    if(!Array.isArray(data.applicants))throw Error('Format respons pelamar tidak valid.');
    const applicants = data.applicants || [];
    if(!applicants.length) throw Error('Tidak ada pelamar baru yang memenuhi syarat filter.');

    let added = 0, updated = 0;
    mutate('Tarik & perbarui pelamar Google Form', () => {
      applicants.forEach(app => {
        const name = String(app.name||'').trim();
        const phone = String(app.phone||'').trim();
        if(!name) return;

        // Pastikan cvLink hanya berisi URL http/https murni
        const cleanCvUrl = (app.cvLink && /^https?:\/\//i.test(app.cvLink)) ? app.cvLink.trim() : '';

        let existing = db.candidates.find(c => 
          (phone && c.phone && c.phone === phone) || 
          (c.name.toLowerCase() === name.toLowerCase())
        );

        if(app.isPsikotes && autoMatchPsi && existing){
          existing.stage = 'Psikotes';
          let psiNote = `[Hasil Psikotes]: Skor ${app.score || 'Tercatat'} (Form: ${app.formSource})`;
          if(!existing.notes.includes(psiNote)){
            existing.notes = [existing.notes, psiNote].filter(Boolean).join('\n');
          }
          updated++;
        } else if(existing){
          if(app.age) existing.age = app.age;
          if(app.education) existing.education = app.education;
          if(app.experience) existing.experience = app.experience;
          if(app.expectedSalary) existing.expectedSalary = Number(app.expectedSalary);
          // TIMPA cvLink lama yang keliru dengan URL Google Drive yang valid
          if(cleanCvUrl) existing.cvLink = cleanCvUrl;
          if(app.phone) existing.phone = app.phone;
          updated++;
        } else {
          db.candidates.unshift({
            id: HR.id(),
            name: name,
            position: app.position || 'Staff',
            branch: app.branch || branch || 'Pontianak Barat',
            phone: phone,
            email: app.email || '',
            stage: app.isPsikotes ? 'Psikotes' : defaultStage,
            source: 'Google Form (' + app.formSource + ')',
            appliedDate: (app.timestamp ? (parseIndoDate(app.timestamp) || HR.today()) : HR.today()),
            schedule: (defaultStage === 'Interview' || defaultStage === 'Psikotes') ? HR.today() : '',
            time: '09:00',
            age: app.age || '',
            education: app.education || '',
            experience: app.experience || '',
            expectedSalary: Number(app.expectedSalary) || 0,
            cvLink: cleanCvUrl,
            notes: (app.score ? `Skor Tes: ${app.score}` : '')
          });
          added++;
        }
      });
    }, `${added} pelamar baru, ${updated} profil & link CV diperbarui`);

    const stamp = new Date().toLocaleString('id-ID', {timeZone:'Asia/Jakarta'});
    auxSet('baraka_last_form_pull', `${stamp} (${added} baru, ${updated} diperbarui)`);
    closeModal();
    navigate('recruitment');
    toast(`🎉 ${added} pelamar baru & ${updated} tautan CV Google Drive berhasil diperbarui!`);
  }

  function mergePusatEmployees(records, sourceLabel){
    if(!Array.isArray(records) || !records.length) throw Error('Tidak ada data karyawan.');
    let added = 0, updated = 0;

    mutate('Sinkronisasi Read-Only Database Pusat (' + sourceLabel + ')', () => {
      if(mode === 'demo')throw Error('Pilih Mulai data kerja saya sebelum mengimpor database pusat. Data contoh tidak digabungkan.');

      records.forEach(r => {
        const nib = String(r.nib || '').trim();
        const name = String(r.name || '').trim();
        if(!name) return;

        let existing = db.employees.find(e => (nib && e.code === nib) || (e.name.toLowerCase() === name.toLowerCase() && e.branch === r.branch));
        const parsedStart = parseIndoDate(r.startDateRaw);
        const empType = /tetap|pkwtt/i.test(r.workerType) ? 'PKWTT' : /kontrak|pkwt/i.test(r.workerType) ? 'PKWT' : /probation|percobaan|mt/i.test(r.workerType) ? 'Probation' : 'Harian / Mitra';
        const activeState = /non|keluar|resign|berhenti/i.test(r.activeStatus) ? 'Nonaktif' : 'Aktif';

        const metaObj = {
          categoryTab: r.categoryTab || 'STAFF',
          placementCode: r.placementCode || '',
          division: r.division || '',
          positionCode: r.positionCode || '',
          startDateRaw: r.startDateRaw || '',
          startDateNonStaff: r.startDateNonStaff || '',
          tenureText: r.tenureText || '',
          dailyNote: r.dailyNote || '',
          bankAccount: r.bankAccount || '',
          hrArea: r.hrArea || '',
          birthPlace: r.birthPlace || '',
          birthDate: r.birthDate || '',
          age: r.age || '',
          nikKtp: r.nikKtp || '',
          noKk: r.noKk || '',
          bpjsKes: r.bpjsKes || '',
          bpjsClass: r.bpjsClass || '',
          bpjsTk: r.bpjsTk || '',
          addressKtp: r.addressKtp || '',
          education: r.education || '',
          religion: r.religion || '',
          spouse: r.spouse || '',
          childrenCount: r.childrenCount || '',
          sourceFile: r.sourceFile || sourceLabel
        };

        const checklist = [];
        if(metaObj.nikKtp) checklist.push('Identitas');
        if(metaObj.education) checklist.push('Ijazah');
        if(metaObj.bpjsKes || metaObj.bpjsTk) checklist.push('BPJS');
        if(empType === 'PKWT' || empType === 'PKWTT') checklist.push('Kontrak');

        if(existing){
          existing.code = nib || existing.code;
          existing.name = name;
          existing.position = r.position || existing.position;
          existing.branch = r.branch || existing.branch;
          if(r.phone) existing.phone = r.phone;
          existing.employment = empType;
          existing.active = activeState;
          if(parsedStart) existing.startDate = parsedStart;
          if(r.notes) existing.notes = r.notes + (metaObj.bankAccount ? ' | Rek: ' + metaObj.bankAccount : '');
          existing.pusatMeta = { ...(existing.pusatMeta || {}), ...metaObj };
          existing.docChecklist = [...new Set([...(existing.docChecklist||[]), ...checklist])];
          updated++;
        } else {
          db.employees.push({
            id: HR.id(),
            code: nib || HR.nextEmployeeCode(db),
            name: name,
            position: r.position || 'Staff',
            branch: r.branch || 'Pontianak Barat',
            phone: r.phone || '',
            email: '',
            employment: empType,
            active: activeState,
            startDate: parsedStart || '',
            endDate: '',
            simExpiry: '',
            leaveQuota: HR.num(db.settings.leaveQuota) || 12,
            salary: 3500000,
            allowance: 0,
            manager: 'Kepala Cabang',
            notes: [r.notes, metaObj.bankAccount ? 'Rek: '+metaObj.bankAccount : ''].filter(Boolean).join(' | '),
            docChecklist: checklist,
            discipline: 'Tidak ada catatan',
            pusatMeta: metaObj
          });
          added++;
        }

        if(r.position && !db.settings.positions.includes(r.position)){
          db.settings.positions.push(r.position);
        }
      });
    }, `${added} baru, ${updated} diperbarui`);

    const stamp = new Date().toLocaleString('id-ID', {timeZone:'Asia/Jakarta'});
    auxSet('baraka_pusat_last_pull', `${stamp} (${added} baru, ${updated} diupdate)`);
    closeModal();
    navigate('employees');
    toast(`🎉 Sinkronisasi Database Berhasil!`);
  }

          <div>
            <strong>${E(e.name)}</strong> · ${E(e.position)} (${E(e.branch)})
            <div style="font-size:11px;color:var(--muted)">Berakhir: <b>${HR.date(e.endDate)}</b> (${d < 0 ? 'Lewat '+Math.abs(d)+' hari' : d+' hari lagi'})</div>
          </div>
          <div style="display:flex;gap:5px;flex-wrap:wrap">
            <button type="button" class="btn sm soft" data-hrd76="extend-contract" data-id="${E(e.id)}" data-months="3">+3 Bln</button>
            <button type="button" class="btn sm soft" data-hrd76="extend-contract" data-id="${E(e.id)}" data-months="6">+6 Bln</button>
            <button type="button" class="btn sm soft" data-hrd76="extend-contract" data-id="${E(e.id)}" data-months="12">+1 Thn</button>
            <button type="button" class="btn sm primary" data-hrd76="make-pkwtt" data-id="${E(e.id)}">Jadikan PKWTT</button>
          </div>
        </div>`;
      }).join('') : '<p class="note">Tidak ada kontrak yang jatuh tempo dalam waktu dekat.</p>'}
      <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
      <h3 style="margin:0 0 8px;font-size:13.5px">2. Masa Berlaku SIM Driver / Staf (${expSims.length})</h3>
      ${expSims.length ? expSims.map(e => {
        const d = HR.days(e.simExpiry, now);
        return `<div class="triage-row">
          <div>
            <strong>${E(e.name)}</strong> · ${E(e.position)} (${E(e.branch)})
            <div style="font-size:11px;color:var(--muted)">SIM Habis: <b>${HR.date(e.simExpiry)}</b> (${d < 0 ? 'Lewat '+Math.abs(d)+' hari' : d+' hari lagi'})</div>
          </div>
          <div style="display:flex;gap:5px">
            <button type="button" class="btn sm soft" data-hrd76="extend-sim" data-id="${E(e.id)}">Perpanjang +5 Thn</button>

    modal('⚡ Triage Eksekusi Kontrak PKWT & SIM 1-Klik', html, actButton('close','Tutup'), true);
  }

  // 11. EVENT DELEGATION
  document.addEventListener('click', async e => {
    const branchTarget = e.target.closest?.('[data-hrd76="view-branch"]');
    if(branchTarget){
      const bName = branchTarget.dataset.branch;
      if(bName) openBranchEmployeesModal(bName);
      return;
    }

    const tabTarget = e.target.closest?.('[data-hrd76="switch-wa-mode"]');
    if(tabTarget){
      waTargetMode = tabTarget.dataset.mode;
      enhanceWaCommunicationView();
      document.querySelectorAll('.wa-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === waTargetMode));
      return;
    }

    const toggleTarget = e.target.closest?.('[data-hrd76="toggle-card"]');
    if(toggleTarget){
      const cardId = toggleTarget.dataset.id;
      if(manuallyExpandedCards.has(cardId)) manuallyExpandedCards.delete(cardId);
      else manuallyExpandedCards.add(cardId);
      render();
      return;
    }

    const btn = e.target.closest?.('[data-hrd76]');
    if(!btn) return;
    const act = btn.dataset.hrd76;
    const id = btn.dataset.id;
    try {
      if(act === 'modal-pull-forms') openPullFormsModal();
      else if(act === 'exec-pull-forms') await executePullForms();
      else if(act === 'modal-broadcast-batch') openBroadcastBatchModal();
      else if(act === 'modal-radar') openOperationalRadarModal();
      else if(act === 'modal-audit') openDataHygieneAuditModal();
      else if(act === 'generate-pkwt') generatePkwtDocument(id);
      else if(act === 'modal-pusat-sync') openPusatSyncModal();
      else if(act === 'exec-pusat-pull') await executePusatPull();
      else if(act === 'filter-cat'){ activeCategoryTab = btn.dataset.cat || ''; render(); }
      else if(act === 'modal-sop') openSopModal();
      else if(act === 'exec-sop') executeSopGeneration();
      else if(act === 'modal-triage') openTriageModal();
      else if(act === 'wa-ask-data'){
        const emp = HR.employee(db, id);
        if(!emp) return;
        const m = emp.pusatMeta || {};
        const needed = [];
        if(!m.bankAccount) needed.push('• Nomor Rekening Payroll');
        if(!m.bpjsKes) needed.push('• Nomor Kartu BPJS Kesehatan');
        if(!m.bpjsTk) needed.push('• Nomor Kartu BPJS Ketenagakerjaan');
        if((/driver|sopir|armada/i.test(emp.position) || m.categoryTab === 'SOPIR') && !emp.simExpiry) needed.push('• Foto & Tanggal Masa Berlaku SIM');
        const txt = `Halo Sdr/i *${emp.name}* (${emp.position} - Cabang ${emp.branch}),\n\nBerdasarkan pembaruan database Personalia PT Baraka Sarana Tama, mohon kesediaannya mengirimkan kelengkapan data berikut melalui chat WhatsApp ini:\n\n${needed.join('\n')}\n\nData ini diperlukan untuk kelancaran administrasi Payroll dan kepesertaan BPJS Anda. Terima kasih.\n\n*${db.settings.officer}* — HRD Baraka Express`;
        let phone = (emp.phone||'').replace(/\D/g,'').replace(/^0/,'62');
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(txt)}`, '_blank');
      }
      else if(act === 'snooze-task'){
        const t = db.tasks.find(x => x.id === id);
        if(t){
          mutate('Menggeser tenggat tugas', () => { t.due = HR.addDays(HR.today(), 1); }, t.title);
          render(); toast('Tenggat tugas digeser ke besok.');
        }
      }
      else if(act === 'snooze-all-overdue'){
        const now = HR.today();
        const overTasks = db.tasks.filter(t => t.status !== 'Selesai' && t.due && t.due < now);
        if(!overTasks.length) return;
        mutate('Menggeser seluruh tugas terlewat ke hari ini', () => { overTasks.forEach(t => t.due = now); }, overTasks.length + ' tugas');
        render(); toast(`${overTasks.length} tugas terlewat berhasil digeser ke hari ini!`);
      }
      else if(act === 'extend-contract'){
        const emp = HR.employee(db, id);
        const months = Number(btn.dataset.months || 6);
        if(!emp) return;
        const baseDate = emp.endDate && emp.endDate > HR.today() ? emp.endDate : HR.today();
        let nextDate = baseDate;
        for(let i=0; i<months; i++) nextDate = HR.nextMonth(nextDate);
        mutate(`Perpanjang kontrak ${emp.name} (+${months} bln)`, () => { emp.endDate = nextDate; emp.employment = 'PKWT'; }, emp.name);
        openTriageModal(); render(); toast(`Kontrak ${emp.name} diperpanjang hingga ${HR.date(nextDate)}.`);
      }
      else if(act === 'make-pkwtt'){
        const emp = HR.employee(db, id);
        if(!emp) return;
        mutate(`Pengangkatan PKWTT ${emp.name}`, () => { emp.employment = 'PKWTT'; emp.endDate = ''; }, emp.name);
        openTriageModal(); render(); toast(`🎉 ${emp.name} resmi diupdate menjadi PKWTT!`);
      }
      else if(act === 'extend-sim'){
        const emp = HR.employee(db, id);
        if(!emp) return;
        const base = emp.simExpiry && emp.simExpiry > HR.today() ? emp.simExpiry : HR.today();
        const nextSim = (Number(base.slice(0,4)) + 5) + base.slice(4);
        mutate(`Perpanjang masa berlaku SIM ${emp.name}`, () => { emp.simExpiry = nextSim; }, emp.name);
        openTriageModal(); render(); toast(`Masa berlaku SIM ${emp.name} diperbarui ke ${HR.date(nextSim)}.`);
      }
      else if(act === 'wa-sim'){
        const emp = HR.employee(db, id);
        if(!emp) return;
        const txt = `Halo *${emp.name}* (${emp.position} - Cabang ${emp.branch}),\n\nMengingatkan bahwa masa berlaku SIM Anda tercatat akan berakhir pada *${HR.date(emp.simExpiry)}*. Mohon segera melakukan perpanjangan SIM dan mengirimkan foto SIM terbaru ke Personalia agar operasional distribusi tetap lancar.\n\nTerima kasih.\n*${db.settings.officer}* — HRD Baraka Express`;
        let phone = (emp.phone||'').replace(/\D/g,'').replace(/^0/,'62');
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(txt)}`, '_blank');
      }
      else if(act === 'send-bcast-single'){
        const c = db.candidates.find(x => x.id === id);
        if(!c) return;
        const bDate = document.querySelector('#bcast-date')?.value || HR.today();
        const bTime = document.querySelector('#bcast-time')?.value || '09:00';
        const txt = buildMessage({
          type: 'Undangan interview',
          salam: getAutoSalam(),
          recipient: c.name,
          phone: c.phone,
          position: c.position,
          branch: c.branch,
          date: bDate,
          time: bTime,
          mode: 'Offline',
          docs: HR.defaultDocs,
          notes: sanitizeWaNotes(c.notes)
        });
        let phone = (c.phone||'').replace(/\D/g,'').replace(/^0/,'62');
        batchSentTracker.add(c.id);
        const rowEl = document.querySelector(`#bcast-row-${c.id}`);
        if(rowEl) {
          rowEl.classList.add('sent');
          const btnEl = rowEl.querySelector('button');
          if(btnEl){ btnEl.textContent = '✓ Terkirim'; btnEl.className = 'btn sm soft'; }
        }
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(txt)}`, '_blank');
      }
    } catch(err){ toast(err.message || 'Gagal memproses aksi.', true); }
  });

  // 12. HOOK RENDER UTAMA
  BarakaRuntime.addRenderHook('hr-workflows-7.6', function() {
    enhanceBranchDistributionCard();
    enhanceWaCommunicationView();
    enhanceDashboardOverdueCard();
    enhanceAutopilotToolbar();
    enhanceEmployeeCategoryFilter();
    if(route === 'messages') updateMessage();

  enhanceBranchDistributionCard();
  enhanceWaCommunicationView();
  enhanceDashboardOverdueCard();
  enhanceAutopilotToolbar();
  enhanceEmployeeCategoryFilter();
  if(route === 'messages') updateMessage();
});
</script>

  // 2. COMMAND BAR INTERPRETER
  function runQuickCommand(raw){
    if(!raw) return;
    const parts = raw.split(/\s+/);
    const cmd = parts[0].toLowerCase();
    const q = parts.slice(1).join(' ').toLowerCase();

    const findEmp = (str) => db.employees.find(e => e.name.toLowerCase().includes(str) || (e.code||'').toLowerCase().includes(str));
    const findCand = (str) => db.candidates.find(c => c.name.toLowerCase().includes(str));

    if(['subsidi','sopir','ba','luarkota'].includes(cmd)){
      openBaSubsidiLuarKotaModal();
      return;
    }
    if(['aset','resign','exit','ceklis','seragam'].includes(cmd)){
      const emp = findEmp(q);
      openExitAssetChecklistModal(emp?.id || '');
      return;
    }
    if(['evaluasi','eval','probation','nilai','mt'].includes(cmd)){
      const emp = findEmp(q);
      openEvalSheetModal(emp?.id || '');
      return;
    }
    if(['cek','eks','blacklist','duplikat'].includes(cmd)){
      openExBarakaDetectorModal();
      return;
    }
    if(['sp','sp1','sp2','sp3'].includes(cmd)){
      const emp = findEmp(q);
      if(!emp) return toast('Karyawan "' + q + '" tidak ditemukan.', true);
      const level = cmd === 'sp2' ? 'SP-2' : cmd === 'sp3' ? 'SP-3' : 'SP-1';
      documentDraft = {
        type: 'Surat peringatan', empId: emp.id, number: nextDocNumber(),
        date: HR.today(), subject: `SURAT PERINGATAN (${level})`,
        recipient: emp.name, body: '', reviewed: false
      };
      documentDraft.body = docTemplate(documentDraft);
      navigate('documents');
      toast(`⚡ Draf ${level} untuk ${emp.name} siap dicetak!`);
      return;
    }
    if(['pkwt','kontrak'].includes(cmd)){
      const emp = findEmp(q);
      if(!emp) return toast('Karyawan "' + q + '" tidak ditemukan.', true);
      const btn = document.createElement('button');
      btn.dataset.hrd76 = 'generate-pkwt';
      btn.dataset.id = emp.id;
      document.body.appendChild(btn);
      btn.click();
      btn.remove();
      return;
    }
    if(['paklaring'].includes(cmd)){
      const emp = findEmp(q);
      if(!emp) return toast('Karyawan "' + q + '" tidak ditemukan.', true);
      documentDraft = {
        type: 'Paklaring', empId: emp.id, number: nextDocNumber(),
        date: HR.today(), subject: 'Surat Pengalaman Kerja (Paklaring)',
        recipient: emp.name, body: '', reviewed: false
      };
      documentDraft.body = docTemplate(documentDraft);
      navigate('documents');
      toast(`⚡ Paklaring ${emp.name} siap dicetak!`);
      return;
    }
    if(['wa','chat'].includes(cmd)){
      const emp = findEmp(q);
      const cand = findCand(q);
      if(emp){
        messageDraft = { type: 'Teguran disiplin / absensi / SP', salam: getAutoSalam(), recipient: emp.name, phone: emp.phone, position: emp.position, branch: emp.branch, date: HR.today(), time: '09:00', mode: 'Offline', docs: [] };
        navigate('messages');
        toast(`⚡ Chat WA untuk ${emp.name} siap dikirim.`);
      } else if(cand){
        messageDraft = { type: 'Undangan interview', salam: getAutoSalam(), recipient: cand.name, phone: cand.phone, position: cand.position, branch: cand.branch, date: cand.schedule||HR.today(), time: cand.time||'09:00', mode: 'Offline', docs: HR.defaultDocs };
        navigate('messages');
        toast(`⚡ Chat WA untuk kandidat ${cand.name} siap dikirim.`);
      } else {
        toast('Nama "' + q + '" tidak ditemukan.', true);
      }
      return;
    }
    toast('Gunakan perintah: subsidi, aset [nama], evaluasi [nama], sp [nama], pkwt [nama], paklaring [nama], atau wa [nama].', true);
  }

  function parseOutDriversPaste(){
    const raw = document.querySelector('#raw-out-drivers-paste')?.value.trim() || '';
    if(!raw) throw Error('Tempelkan baris dari tabel Sopir Luar Kota terlebih dahulu.');
    const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const parsed = [];

    lines.forEach(line => {
      if(/^no\s+/i.test(line) || /id driver/i.test(line)) return;
      const cols = line.split('\t').map(c => c.trim());
      const nibMatch = line.match(/DB-\d{4,6}/i);
      if(!nibMatch) return;
      const nib = nibMatch[0].toUpperCase();
      const nibIdx = cols.findIndex(c => c.toUpperCase() === nib);
      const name = (cols[nibIdx + 2] || cols[nibIdx + 1] || '').replace(/^DB-\d+\//i, '').trim();
      if(!name) return;

      const isResign = /\b(RESIGN|PHK|KELUAR|NONAKTIF)\b/i.test(line);
      const phoneMatch = line.match(/08\d{8,12}/);
      parsed.push({
        nib,
        name: name.toUpperCase(),
        phone: phoneMatch ? phoneMatch[0] : '',
        sim: /B\s*2\s*UMUM/i.test(line) ? 'B 2 UMUM' : /B\s*2/i.test(line) ? 'B 2' : 'B 1',
        simExpiry: '',
        pos: /DRIVER\s*1/i.test(line) ? 'DRIVER 1' : 'DRIVER 2',
        startDate: '',
        status: isResign ? 'RESIGN' : 'AKTIF',
        branch: 'PORT PONTIANAK',
        days: isResign ? 0 : 26,
        nominal: isResign ? 0 : 1000000,
        note: isResign ? 'Resign / Nonaktif' : '-'
      });
    });

    if(!parsed.length) throw Error('Tidak ditemukan kode DB-Sopir (format DB-xxxxx). Pastikan menyalin baris dari tabel.');
    saveOutDrivers(parsed);

    // Masukkan juga yang RESIGN ke daftar Eks-Karyawan agar otomatis terdeteksi jika melamar lagi
    const bl = getBlacklistArchive();
    parsed.filter(d => d.status === 'RESIGN').forEach(d => {
      if(!bl.some(x => x.name.toLowerCase() === d.name.toLowerCase())){
        bl.unshift({ name: d.name, phone: d.phone, branch: 'Port Pontianak - Sopir Luar Kota (' + d.nib + ')', reason: d.note });
      }
    });
    mutate('Memperbarui daftar Sopir Luar Kota & Eks-Driver', () => { saveBlacklistArchive(bl); }, parsed.length + ' sopir');
    openBaSubsidiLuarKotaModal();
    toast(`✅ ${parsed.length} data Sopir Luar Kota berhasil diperbarui!`);
  }

  // 4. DETEKTOR EKS-KARYAWAN BARAKA & PELAMAR LINTAS CABANG
  function normalizePhone(p){ return String(p||'').replace(/\D/g, '').replace(/^62/, '0'); }
  function normalizeName(n){ return String(n||'').toLowerCase().replace(/[^a-z\s]/g, '').replace(/\s+/g, ' ').trim(); }

  function getBlacklistArchive(){
    const baseList = db.blacklistArchive?.length ? db.blacklistArchive.slice() : [];
    // Pastikan 2 sopir luar kota yang sudah resign (JOHANDI & RISKI ADIKKA SAPUTRA) selalu terdaftar di radar Eks-Karyawan
    getSavedOutDrivers().filter(d => d.status === 'RESIGN').forEach(d => {
      if(!baseList.some(b => normalizeName(b.name) === normalizeName(d.name))){
        baseList.push({
          name: d.name,
          phone: d.phone || d.nik || '',
          branch: `Port Pontianak — Sopir Luar Kota (${d.nib})`,
          reason: d.note || 'Eks Sopir Luar Kota (Resign)'
        });
      }
    });
    return baseList;
  }

  function saveBlacklistArchive(list){
    BarakaSafety.validate({...db, blacklistArchive: list});
    db.blacklistArchive = BarakaSafety.clone(list);
  }

  function scanCandidatesAgainstBarakaHistory(){
    const blacklist = getBlacklistArchive();
    const results = [];

    db.candidates.forEach(c => {
      if(c.stage === 'Ditolak' || c.employeeId) return;
      const cName = normalizeName(c.name);
      const cPhone = normalizePhone(c.phone);
      const reasons = [];

      db.employees.forEach(e => {
        const eName = normalizeName(e.name);
        const ePhone = normalizePhone(e.phone);
        const nameMatch = cName && eName && (cName === eName || (cName.length > 5 && eName.includes(cName)));
        const phoneMatch = cPhone && ePhone && cPhone.length >= 9 && cPhone === ePhone;
        if(nameMatch || phoneMatch){
          reasons.push({
            source: e.active === 'Nonaktif' ? 'EKS-KARYAWAN BARAKA' : 'KARYAWAN AKTIF TERDAFTAR',
            detail: `Tercatat sebagai ${e.position} di Cabang ${e.branch} (NIB: ${e.code}, Status: ${e.active})`
          });
        }
      });

      blacklist.forEach(b => {
        const bName = normalizeName(b.name);
        const bPhone = normalizePhone(b.phone);
        const nameMatch = cName && bName && (cName === bName);
        const phoneMatch = cPhone && bPhone && cPhone.length >= 9 && cPhone === bPhone;
        if(nameMatch || phoneMatch){
          reasons.push({
            source: 'ARSIP EKS-KARYAWAN / RESIGN',
            detail: `Eks ${b.branch || 'Kalbar'} — Catatan: ${b.reason || 'Pernah bekerja di Baraka Express'}`
          });
        }
      });

      const dupCands = db.candidates.filter(other => other.id !== c.id && (
        (cName && normalizeName(other.name) === cName) ||
        (cPhone && cPhone.length >= 9 && normalizePhone(other.phone) === cPhone)
      ));
      if(dupCands.length){
        reasons.push({
          source: 'MELAMAR DOBEL LINTAS CABANG',
          detail: `Melamar juga di: ${dupCands.map(d => `${d.position} (${d.branch})`).join(', ')}`
        });
      }

      if(reasons.length) results.push({ candidate: c, reasons });
    });

    return results;
  }

  function executeManualEvalPaste(){
    const raw = document.querySelector('#eval-manual-text')?.value.trim() || '';
    if(!raw) throw Error('Tempelkan baris penilaian terlebih dahulu.');
    const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    let added = 0;

    mutate('Impor manual hasil evaluasi kinerja', () => {
      lines.forEach(line => {
        const parts = line.split(/\t|\|/).map(s => s.trim());
        const name = parts[0] || '';
        const score = Math.min(100, Math.max(0, Number(parts[1]) || 80));
        const rec = parts[2] || 'Lanjut';
        const evaluator = parts[3] || 'Kepala Cabang';
        const notes = parts[4] || '';

        const emp = db.employees.find(e => e.name.toLowerCase().includes(name.toLowerCase()));
        if(emp){
          db.reviews.unshift({
            id: HR.id(),
            empId: emp.id,
            title: `Evaluasi Kinerja (${evaluator}) — ${rec}`,
            type: emp.employment === 'Probation' ? 'Evaluasi Probation' : 'Evaluasi PKWT',
            date: HR.today(),
            status: 'Selesai',
            score: score,
            notes: `Rekomendasi: ${rec} | Penilai: ${evaluator} | Catatan: ${notes}`
          });
          added++;
        }
      });
    }, added + ' evaluasi disimpan');

    if(!added) throw Error('Nama karyawan tidak ditemukan di direktori.');
    closeModal();
    navigate('reviews');
    toast(`✅ ${added} hasil evaluasi berhasil dicatat ke modul Pengembangan!`);
  }

  document.addEventListener('click', async e => {
    const btn = e.target.closest?.('[data-rev8]');

    const act = btn.dataset.rev8;
    const id = btn.dataset.id;

    try {
      if(act === 'modal-ba-subsidi') openBaSubsidiLuarKotaModal('normal');
      else if(act === 'ba-sync-sheet-modal') openSyncOutDriversModal();
      else if(act === 'parse-out-drivers-paste') parseOutDriversPaste();

        saveOutDrivers(DEFAULT_OUT_OF_TOWN_DRIVERS);
        openSyncOutDriversModal();
        toast('Data Sopir Luar Kota dikembalikan ke 8 sopir default.');

      else if(act === 'ba-add-row'){
        const container = document.querySelector('#ba-sub-rows');
        if(container){
          container.insertAdjacentHTML('beforeend', `
            <div class="ba-input-row">
              <input type="text" name="s_name" placeholder="Nama Sopir">
              <input type="text" name="s_nib" value="DB-" placeholder="DB-Sopir">

              <button type="button" class="row-btn" data-rev8="ba-del-row" style="color:var(--red)">✕</button>
            </div>
          `);
          updateBaLiveTotal();
        }
      }
      else if(act === 'ba-del-row'){
        btn.closest('.ba-input-row')?.remove();
        updateBaLiveTotal();
      }
      else if(act === 'ba-print-pdf'){
        const htmlDoc = buildBaSubsidiHTML();
        printHTML(htmlDoc);
      }
      else if(act === 'ba-export-word'){
        const htmlDoc = buildBaSubsidiHTML();
        const per = (document.querySelector('#ba-sub-periode')?.value || 'Kalbar').replace(/\s+/g, '_');
        exportHtmlAsWordDoc(`BA_SUBSIDI_SOPIR_LUAR_KOTA_${per}.doc`, htmlDoc);
      }
      else if(act === 'modal-ex-detector') openExBarakaDetectorModal();
      else if(act === 'reject-ex-cand'){
        const c = db.candidates.find(x => x.id === id);
        if(c){
          mutate('Menggugurkan kandidat Eks-Baraka / Duplikat', () => { c.stage = 'Ditolak'; }, c.name);
          openExBarakaDetectorModal();
          render();
          toast(`Kandidat ${c.name} dipindahkan ke tahap Ditolak.`);
        }
      }
      else if(act === 'add-blacklist'){
        const name = document.querySelector('#bl-name')?.value.trim() || '';
        const phone = document.querySelector('#bl-phone')?.value.trim() || '';
        const br = document.querySelector('#bl-branch')?.value.trim() || '';
        const reason = document.querySelector('#bl-reason')?.value.trim() || 'Eks-Karyawan Baraka';
        if(!name) throw Error('Isi nama lengkap eks-karyawan.');
        const list = getBlacklistArchive();
        list.unshift({ name, phone, branch: br, reason });
        mutate('Menambah arsip Eks-Karyawan', () => { saveBlacklistArchive(list); }, name);
        openExBarakaDetectorModal();
        toast(`${name} ditambahkan ke daftar Eks-Karyawan.`);
      }
      else if(act === 'sync-nonaktif-to-bl'){
        const list = getBlacklistArchive();
        let count = 0;
        db.employees.filter(e => e.active === 'Nonaktif').forEach(e => {
          if(!list.some(x => normalizeName(x.name) === normalizeName(e.name))){
            list.unshift({ name: e.name, phone: e.phone, branch: `${e.branch} - ${e.position}`, reason: 'Nonaktif / Eks-Karyawan' });
            count++;
          }
        });
        mutate('Sinkronisasi karyawan nonaktif ke daftar Eks-Baraka', () => { saveBlacklistArchive(list); }, count + ' orang');
        openExBarakaDetectorModal();
        toast(`${count} karyawan nonaktif berhasil dimasukkan ke radar Eks-Baraka.`);
      }
      else if(act === 'modal-eval-sheet') openEvalSheetModal();
      else if(act === 'paste-eval-manual') openManualEvalPasteModal();
      else if(act === 'exec-eval-manual-paste') executeManualEvalPaste();
      else if(act === 'send-eval-wa-selected' || act === 'send-eval-wa-row'){
        const empId = act === 'send-eval-wa-row' ? id : document.querySelector('#eval-select-emp')?.value;
        const emp = HR.employee(db, empId);
        if(!emp) throw Error('Pilih karyawan terlebih dahulu.');
        const gform = document.querySelector('#eval-gform-link')?.value.trim() || auxGet('baraka_eval_gform_link') || '(Link Google Form Evaluasi)';
        if(gform.startsWith('http')) auxSet('baraka_eval_gform_link', gform);
        const txt = `Halo Bapak/Ibu *Kepala Cabang ${emp.branch}*,\n\nSehubungan dengan masa evaluasi kerja (*${emp.employment}*) karyawan atas nama:\n• *Nama:* ${emp.name} (${emp.code})\n• *Jabatan:* ${emp.position}\n• *Berakhir Pada:* ${HR.date(emp.endDate)}\n\nMohon kesediaannya mengisi *Formulir Penilaian Kinerja* melalui tautan berikut:\n${gform}\n\nTerima kasih atas kerja samanya.\n*${db.settings.officer}* — Personalia Baraka Express`;
        window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
      }
      else if(act === 'modal-exit-word') openExitAssetChecklistModal();
      else if(act === 'print-exit-pdf'){
        const htmlDoc = buildExitClearanceHTML();
        printHTML(htmlDoc);
      }
      else if(act === 'download-exit-doc'){
        const htmlDoc = buildExitClearanceHTML();
        exportHtmlAsWordDoc(`Exit_Clearance_Baraka_${HR.today()}.doc`, htmlDoc);
      }
    } catch(err){
      toast(err.message || 'Gagal memproses aksi.', true);
    }
  });

</style>
<script data-baraka-extension="official-documents">
BarakaRuntime.registerModule('official-documents', function(){
  'use strict';

  let VALID_SIGNATURE_SRC = '';
  try {
    const scripts = document.querySelectorAll('script');
    for(const s of scripts){
      const m = s.textContent.match(/data:image\/png;base64,iVBORw0KGgoAAAANSUhEUgAAASIAAAEi[^\s"']+/);
      if(m){ VALID_SIGNATURE_SRC = m[0]; break; }
    }
  } catch(e) {}

  let selectedDocFont = localStorage.getItem('baraka_doc_font') || "'Times New Roman', Times, serif";
  let selectedDocSize = localStorage.getItem('baraka_doc_size') || '11pt';

  const FONT_FAMILY_OPTIONS = [
    { value: "'Times New Roman', Times, serif", label: 'Times New Roman (Standar Surat Resmi)' },
    { value: "Arial, Helvetica, sans-serif", label: 'Arial (Modern & Bersih)' }
  ];

  const FONT_SIZE_OPTIONS = [
    { value: '10pt', label: '10 pt (Ringkas)' },
    { value: '11pt', label: '11 pt (Standar Ideal A4)' },
    { value: '11.5pt', label: '11.5 pt (Sedang)' },
    { value: '12pt', label: '12 pt (Besar Standar Word)' }
  ];

  // Surat Teguran (months: 0 = Tanpa Batas Waktu)
  const SP_LEVELS = [
    { value: 'Surat Teguran', label: 'Surat Teguran (Tanpa Batas Waktu ➔ Lanjut SP-1)', code: 'ST', months: 0 },
    { value: 'Surat Peringatan Pertama (SP-1)', label: 'Surat Peringatan Pertama / SP-1 (3 Bulan)', code: 'SP-1', months: 3 },
    { value: 'Surat Peringatan Kedua (SP-2)', label: 'Surat Peringatan Kedua / SP-2 (6 Bulan)', code: 'SP-2', months: 6 },
    { value: 'Surat Peringatan Ketiga (SP-3)', label: 'Surat Peringatan Ketiga / SP-3 (9 Bulan)', code: 'SP-3', months: 9 },
    { value: 'Surat Peringatan Ketiga (SP-3) + Skorsing', label: 'SP-3 + Skorsing (3 Bulan)', code: 'SP-3', months: 3 },
    { value: 'Surat Peringatan Ketiga (SP-3) + Mutasi', label: 'SP-3 + Mutasi (9 Bulan)', code: 'SP-3', months: 9 }
  ];

  const DEFAULT_SUBJECT_BY_TYPE = {
    'Surat keterangan kerja': 'Keterangan Karyawan Aktif',
    'Paklaring': 'Surat Pengalaman Kerja (Paklaring)',
    'Surat penawaran kerja': 'Penawaran Kerja (Offering Letter)',
    'Verifikasi reimbursement': 'Verifikasi Klaim Reimbursement Medis / Operasional',
    'Surat tugas': 'Penugasan Operasional & Kunjungan Cabang',
    'Surat mutasi': 'Mutasi & Rotasi Penempatan Kerja',
    'Pemberitahuan kontrak': 'Evaluasi Perpanjangan Kontrak Kerja (PKWT)',
    'Surat peringatan': 'Surat Peringatan Pertama (SP-1)',
    'Berita acara kejadian': 'Berita Acara Kejadian Operasional Cabang'
  };

  const DOC_CODE_BY_TYPE = {
    'Surat keterangan kerja': 'SKK',
    'Paklaring': 'PKL',
    'Surat penawaran kerja': 'OFR',
    'Verifikasi reimbursement': 'RMB',
    'Surat tugas': 'STG',
    'Surat mutasi': 'MTS',
    'Pemberitahuan kontrak': 'PKWT',
    'Berita acara kejadian': 'BA'
  };

  const ROMAN_MONTHS = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];

  function getBranchCode(branchName){
    const s = String(branchName || '').toUpperCase();
    if(s.includes('BARAT') || s.includes('KBPNK')) return 'KBPNK';
    if(s.includes('TIMUR')) return 'PTK-TIMUR';
    if(s.includes('PORT') || s.includes('POOL')) return 'POPNK';
    if(s.includes('MEMPAWAH') || s.includes('MPW')) return 'MPW';
    if(s.includes('SINGKAWANG') || s.includes('SKW')) return 'SKW';
    if(s.includes('SAMBAS') || s.includes('SBS')) return 'SBS';
    return 'KB';
  }

  function buildOfficialDocNumber(docType, spSubject, branchName){
    const today = HR.today();
    const year = today.slice(0, 4);
    const moIdx = Number(today.slice(5, 7)) - 1;
    const moRoman = ROMAN_MONTHS[moIdx] || 'X';
    const brCode = getBranchCode(branchName);
    const count = db.documents.filter(d => d.date?.startsWith(year)).length + 1;
    const seq = String(count).padStart(4, '0');

    let typeCode = DOC_CODE_BY_TYPE[docType] || 'HRD-BE';
    if(docType === 'Surat peringatan'){
      const foundSp = SP_LEVELS.find(x => x.value === spSubject);
      typeCode = foundSp ? foundSp.code : 'SP-1';
    }
    return `${seq}/${typeCode}/HRD-${brCode}/${moRoman}/${year}`;
  }

  function formatDocumentBodyHTML(rawText){
    let safe = E(rawText || '');
    safe = safe.replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>');
    return safe;
  }

  window.docValues = function(){
    let val = id => document.getElementById(id)?.value || '';
    const fFam = val('doc-font-family') || selectedDocFont;
    const fSize = val('doc-font-size') || selectedDocSize;
    selectedDocFont = fFam;
    selectedDocSize = fSize;
    return {
      type: val('doc-type'),
      empId: val('doc-employee'),
      number: val('doc-number'),
      date: val('doc-date'),
      subject: val('doc-subject'),
      recipient: val('doc-recipient'),
      body: val('doc-body'),
      fontFamily: fFam,
      fontSize: fSize,
      reviewed: document.getElementById('doc-reviewed')?.checked !== false,
      documentStatus: 'Draft',
      approvalHistory: [],
      revisionOf: documentDraft?.revisionOf || null
    };
  };

  function renderDynamicSubjectField(docType, currentSubject){
    if(docType === 'Surat peringatan'){
      const validSp = SP_LEVELS.some(x => x.value === currentSubject) ? currentSubject : SP_LEVELS[1].value;
      return `<label for="doc-subject">Pilih Tingkat Surat Peringatan / Teguran</label>
              <select id="doc-subject" name="doc-subject">
                ${SP_LEVELS.map(x => `<option value="${E(x.value)}" ${validSp===x.value?'selected':''}>${E(x.label)}</option>`).join('')}
              </select>`;
    } else {
      const cleanSubj = SP_LEVELS.some(x => x.value === currentSubject)
        ? (DEFAULT_SUBJECT_BY_TYPE[docType] || '')
        : (currentSubject || DEFAULT_SUBJECT_BY_TYPE[docType] || '');
      return `<label for="doc-subject">Subjek / Perihal Surat</label>
              <input id="doc-subject" name="doc-subject" type="text" value="${E(cleanSubj)}" placeholder="Ketik perihal surat...">`;
    }
  }

  // Template Narasi Surat (Khusus Surat Teguran = Tanpa Batas Waktu, Lanjut SP-1)
  window.docTemplate = function(d){
    let e = HR.employee(db, d.empId);
    let name = d.recipient || e?.name || '[Nama Karyawan]';
    let pos = e?.position || '[Jabatan]';
    let br = e?.branch || '[Cabang]';
    let subj = d.subject || DEFAULT_SUBJECT_BY_TYPE[d.type] || 'Surat Peringatan Pertama (SP-1)';

    if(d.type === 'Surat peringatan'){
      const today = d.date || HR.today();
      const startDateStr = HR.date(today, {day:'numeric', month:'long', year:'numeric'});
      const violationClause = d.notes
        ? `**${d.notes}**`
        : `**KARYAWAN TIDAK MASUK KERJA TANPA KETERANGAN / MELANGGAR SOP OPERASIONAL PERUSAHAAN**`;

      // A. JIKA SURAT TEGURAN (ST) -> TANPA BATAS WAKTU, PELANGGARAN BERIKUTNYA LANGSUNG SP-1
      if(subj === 'Surat Teguran'){
        return `Kepada Yth.
**Sdr. ${name}**
**${pos}** PT. Baraka Sarana Tama ${br}

Bersama dengan surat ini, perusahaan menyampaikan **Surat Teguran** resmi. Surat Teguran ini diterbitkan atas pelanggaran disiplin dan ketidaksesuaian SOP perusahaan yang Saudara lakukan yaitu ${violationClause}. Maka dengan ini, Manajemen memberikan **Surat Teguran** dengan ketentuan tegas sebagai berikut:

1. **Surat Teguran** ini berlaku efektif sejak tanggal diterbitkan (**${startDateStr}**) dan tercatat sebagai rekam jejak pembinaan kedisiplinan Saudara **tanpa batas waktu pemulihan**.
2. Apabila di kemudian hari Saudara kembali melakukan pelanggaran disiplin atau ketidaksesuaian SOP perusahaan, maka Manajemen Personalia akan langsung menindaklanjuti dengan menerbitkan **Surat Peringatan Pertama (SP-1)**.

Supaya Saudara dapat memperbaiki sikap, meningkatkan tanggung jawab, dan bekerja dengan profesional kembali, maka perusahaan memberikan teguran tertulis ini berdasarkan aturan yang berlaku. Apabila **Surat Teguran** ini tidak diindahkan dengan baik, maka perusahaan akan langsung mengeluarkan **Surat Peringatan Pertama (SP-1)**.

Demikian **Surat Teguran** ini diterbitkan supaya dapat dipatuhi sebagaimana mestinya. Untuk Saudara diharapkan agar segera memperbaiki diri.`;
      }

      // B. JIKA SP-1 (3 BLN), SP-2 (6 BLN), SP-3 (9 BLN), SP-3 SKORSING (3 BLN), SP-3 MUTASI (9 BLN)
      const foundSp = SP_LEVELS.find(x => x.value === subj);
      const mCount = foundSp ? foundSp.months : 3;

      let nextDate = today;
      for(let i = 0; i < mCount; i++) nextDate = HR.nextMonth(nextDate);
      const endDateStr = HR.date(nextDate, {day:'numeric', month:'long', year:'numeric'});
      const monthLabel = mCount === 3 ? 'tiga (3) bulan' : mCount === 6 ? 'enam (6) bulan' : 'sembilan (9) bulan';

      let nextLevelWarn = 'Surat Peringatan Kedua (SP-2)';
      if(subj.includes('SP-2')) nextLevelWarn = 'Surat Peringatan Ketiga (SP-3)';
      else if(subj.includes('SP-3')) nextLevelWarn = 'Pemutusan Hubungan Kerja (PHK)';

      let extraSanction = '';
      if(subj.includes('Skorsing')){
        extraSanction = `\n4. Sehubungan dengan diterbitkannya surat ini, Saudara dijatuhi sanksi tambahan berupa **SKORSING (pembebasan tugas sementara)** sesuai ketentuan perusahaan.`;
      } else if(subj.includes('Mutasi')){
        extraSanction = `\n4. Sehubungan dengan diterbitkannya surat ini, Manajemen menetapkan sanksi tambahan berupa **MUTASI penempatan/jabatan kerja**.`;
      }

      return `Kepada Yth.
**Sdr. ${name}**
**${pos}** PT. Baraka Sarana Tama ${br}

Bersama dengan surat ini, perusahaan harus menyampaikan **${subj}**. Kami mengeluarkan surat ini atas pelanggaran yang Saudara lakukan dengan melanggar SOP perusahaan yaitu ${violationClause}. Maka dengan ini, kami memberikan ${subj} dengan ketentuan:

1. ${subj} berlaku untuk **${monthLabel}** ke depan sejak diterbitkan yakni mulai tanggal **${startDateStr}** hingga **${endDateStr}**.
2. Apabila selama kurun waktu ${monthLabel} sejak tanggal penerbitan ${subj} Saudara tidak melakukan pelanggaran yang menjadi dasar atas diterbitkannya surat peringatan ini, maka ${subj} Saudara dinyatakan sudah tidak berlaku.
3. **${nextLevelWarn}** akan dikeluarkan oleh Manajemen Personalia jika dalam kurun waktu ${monthLabel}, Saudara melakukan tindakan pelanggaran kembali.${extraSanction}

Supaya Saudara dapat memperbaiki sikap dan bekerja dengan profesional kembali, maka perusahaan menjatuhkan sanksi berdasarkan aturan yang berlaku dan disepakati. Apabila ${subj} ini tidak direspon dengan baik, maka dari itu perusahaan akan mengeluarkan **${nextLevelWarn}**.

Demikian ${subj} ini diterbitkan supaya dapat ditaati sebagaimana mestinya. Untuk Saudara diharapkan agar memperbaiki diri.`;
    }

    const bodies = {
      'Berita acara kejadian': `Pada hari ini, tanggal **${HR.date(d.date,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}**, telah dibuat Berita Acara (BA) Kejadian Operasional sehubungan dengan peristiwa: **${d.subject||'Insiden Operasional Cabang'}**.\n\n**Kronologi Kejadian & Hasil Pemeriksaan:**\n${d.notes||'1. Waktu & Lokasi Kejadian: \n2. Uraian Kronologi Faktual: \n3. Kerugian / Dampak Operasional: \n4. Tindakan Penanganan & Pertanggungjawaban: '}\n\nDemikian Berita Acara Kejadian ini dibuat dengan sebenar-benarnya oleh pihak terkait untuk dipergunakan sebagai dokumen resmi pertanggungjawaban dan klaim internal ${db.settings.company}.`,
      'Surat keterangan kerja': `Yang bertanda tangan di bawah ini, **${db.settings.officer}** selaku Personalia Daerah Kalbar ${db.settings.company} (${db.settings.legalName}), menerangkan dengan sesungguhnya bahwa:\n\nSaudara/i **${name}** adalah benar karyawan aktif kami yang bertugas sebagai **${pos}** pada penempatan **Cabang ${br}** sejak tanggal **${HR.date(e?.startDate)}**.\n\nSurat keterangan ini diterbitkan untuk keperluan **${d.subject||'Administrasi Bank / Pengurusan BPJS / Keperluan Internal'}**. Demikian surat ini dibuat agar dapat dipergunakan sebagaimana mestinya.`,
      'Paklaring': `Yang bertanda tangan di bawah ini, **${db.settings.officer}** selaku Personalia Daerah Kalbar ${db.settings.company} (${db.settings.legalName}), menerangkan bahwa:\n\nSaudara/i **${name}** pernah bekerja di perusahaan kami dengan jabatan terakhir sebagai **${pos}** di **Cabang ${br}**, terhitung sejak **${HR.date(e?.startDate)}** sampai dengan **${HR.date(e?.endDate||d.date)}**.\n\nSelama masa baktinya, yang bersangkutan telah menunjukkan dedikasi dan kontribusi yang baik. Kami mengucapkan terima kasih atas kerja sama yang telah terjalin dan mendoakan kesuksesan di masa depan.`,
      'Surat penawaran kerja': `Kepada Yth. Saudara/i **${name}**,\n\nBerdasarkan hasil seluruh rangkaian seleksi yang telah Anda ikuti, Manajemen ${db.settings.company} Regional ${db.settings.region} dengan senang hati menyampaikan **Penawaran Kerja (Offering Letter)** dengan ketentuan pokok:\n\n1. Posisi Jabatan : **${pos}**\n2. Penempatan     : **Cabang ${br}**\n3. Status Kerja   : **${e?.employment||'Masa Percobaan (Probation) / PKWT'}**\n4. Tanggal Mulai  : **${HR.date(d.date)}**\n\nMohon menandatangani surat penawaran ini sebagai bentuk konfirmasi kesediaan bergabung bersama keluarga besar ${db.settings.company}.`,
      'Verifikasi reimbursement': `Telah diterima dan diverifikasi pengajuan klaim penggantian biaya (**Reimbursement Medis / Operasional**) atas nama **${name}** (${pos} - ${br}).\n\n**Rincian Verifikasi Personalia:**\n- Perihal & Nominal Disetujui : **${d.subject||'Sesuai Kwitansi Terlampir'}**\n- Kelengkapan Bukti Nota/Resep: **Lengkap & Terverifikasi**\n\nDokumen verifikasi ini menjadi dasar pencairan dana oleh bagian Keuangan / Kas Cabang.`,
      'Surat tugas': `Manajemen ${db.settings.company} Regional ${db.settings.region} dengan ini memberikan penugasan resmi kepada Saudara/i **${name}** (${pos}) untuk melaksanakan: **${d.subject||'Kunjungan Operasional & Audit Cabang'}**.\n\nPenugasan ini berlaku efektif mulai tanggal **${HR.date(d.date)}**. Segala biaya perjalanan dinas dan operasional mengacu pada ketentuan perusahaan dan wajib dipertanggungjawabkan setelah penugasan selesai.`,
      'Surat mutasi': `Sehubungan dengan kebutuhan organisasi dan optimalisasi operasional ${db.settings.company} Area ${db.settings.region}, Manajemen menetapkan mutasi/rotasi penempatan kerja terhadap Saudara/i **${name}**:\n\n- Jabatan / Cabang Semula : **${pos} / ${br}**\n- Jabatan / Cabang Baru   : **${d.subject||'[Isi Jabatan & Cabang Baru]'}**\n- Efektif Berlaku Mulai   : **${HR.date(d.date)}**\n\nAgar yang bersangkutan segera melakukan serah terima pekerjaan dan inventaris kepada pejabat terkait sebelum tanggal efektif tersebut.`,
      'Pemberitahuan kontrak': `Kepada Saudara/i **${name}** (${pos} - Cabang ${br}),\n\nBerdasarkan catatan administrasi Personalia, masa berlaku Perjanjian Kerja Waktu Tertentu (PKWT) / Evaluasi Anda berakhir pada tanggal **${HR.date(e?.endDate||d.date)}**.\n\nSehubungan dengan hal tersebut, kami menyampaikan perihal: **${d.subject||'Evaluasi Perpanjangan Kontrak Kerja'}**. Silakan berkoordinasi dengan Kepala Cabang dan HRD untuk penyelesaian administrasi selanjutnya.`
    };
    return bodies[d.type] || bodies['Surat keterangan kerja'];
  };

  window.documents = function(){
    let d = documentDraft || {
      type: docTypes[0],
      empId: '',
      number: buildOfficialDocNumber(docTypes[0], '', 'Port Pontianak'),
      date: HR.today(),
      subject: DEFAULT_SUBJECT_BY_TYPE[docTypes[0]],
      recipient: '',
      body: '',
      fontFamily: selectedDocFont,
      fontSize: selectedDocSize,
      reviewed: true
    };
    if(!d.body) d.body = window.docTemplate(d);

    return pageHead(
      'Studio Dokumen & Surat Resmi HRD',
      'Kustomisasi jenis/ukuran font (Times New Roman / Arial), tebalkan teks (Bold), dan cetak bersih 1 halaman A4 tanpa tulisan browser.',
      actButton('doc-print', '🖨️ Cetak / Simpan PDF (A4)', 'print', 'primary') + actButton('doc-save', '💾 Simpan ke Arsip', 'plus')
    ) +
    '<div class="doc-editor">' +
      '<div class="card">' +
        '<div class="card-head"><h2>Parameter & Format Surat</h2></div>' +
        '<div class="card-body">' +
          '<div class="field-grid" id="doc-form">' +
            selectField('doc-type', 'Jenis Dokumen Resmi', opts(docTypes, d.type)) +
            selectField('doc-employee', 'Pilih Karyawan (Otomatis Isi NIB, Jabatan & Cabang)', empOptions(d.empId, '-- Pilih dari Direktori Karyawan --')) +
            inputField('doc-number', 'Nomor Surat Resmi (Otomatis)', d.number) +
            inputField('doc-date', 'Tanggal Surat Diterbitkan', d.date, 'date') +
            `<div class="field" id="doc-subject-container">${renderDynamicSubjectField(d.type, d.subject)}</div>` +
            inputField('doc-recipient', 'Nama Penerima (Sesuai KTP)', d.recipient || '') +
            selectField('doc-font-family', 'Jenis Font Cetak (Times New Roman / Arial)', opts(FONT_FAMILY_OPTIONS, d.fontFamily || selectedDocFont)) +
            selectField('doc-font-size', 'Ukuran Font Cetak', opts(FONT_SIZE_OPTIONS, d.fontSize || selectedDocSize)) +
            `<div class="field full">
              <label for="doc-body">Isi Lengkap Surat (Blok teks lalu klik tombol "B Bold" untuk menebalkan kata)</label>
              <div class="doc-format-toolbar">
                <button type="button" class="doc-format-btn" id="btn-bold-selection" title="Blok kata di bawah lalu klik ini untuk menebalkan (Bold)">
                  <span style="font-weight:900;font-family:serif;font-size:13px">B</span> Bold Teks Terpilih
                </button>
                <span style="font-size:11px;color:var(--muted)">Tips: Kamu juga bisa mengapit kata dengan dua bintang <code>**seperti ini**</code> agar tercetak <b>tebal (Bold)</b>.</span>
              </div>
              <textarea id="doc-body" name="doc-body" style="min-height:210px">${E(d.body)}</textarea>
            </div>` +
          '</div>' +
          '<label class="pill-check"><input type="checkbox" id="doc-reviewed" ' + (d.reviewed !== false ? 'checked' : '') + '>Dokumen resmi final (hilangkan watermark DRAF saat dicetak)</label>' +
          '<div class="setting-buttons" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">' +
            actButton('doc-print', '🖨️ Cetak / Simpan PDF (A4)', 'print', 'primary') +
            actButton('doc-save', '💾 Simpan ke Arsip', 'check', 'soft') +
            actButton('doc-template', '🔄 Muat Ulang Narasi Template', 'spark') +
            actButton('doc-new', '+ Reset Baru', 'plus') +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;background:var(--surface);padding:10px 14px;border:1px solid var(--line);border-radius:10px">' +
          '<strong style="font-size:12.5px">📄 Pratinjau Kertas A4 (Bebas Tulisan Browser Atas/Bawah)</strong>' +
          actButton('doc-print', '🖨️ Cetak / Simpan PDF Sekarang', 'print', 'sm primary') +

        `<tr>
          <td><strong>${E(x.number)}</strong><span class="sub">${HR.date(x.date)}</span></td>

          <td>${E(x.recipient)}</td>
          <td>${E(x.subject||'-')}</td>

  // Render Kertas Surat: Jabatan "Personalia Daerah Kalbar" Ditaruh di Bawah Nama Muhammad Erwin
  window.letterHTML = function(d){
    let company = d.companySnapshot || db.settings;
    let e = d.employeeSnapshot || HR.employee(db, d.empId);
    let name = d.recipient || e?.name || '[Nama Karyawan/Penerima]';
    let nib = e?.code || e?.pusatMeta?.nib || '-';
    let position = e?.position || '[Jabatan]';
    let branchName = e?.branch || company.region;
    let subjTitle = (d.type === 'Surat peringatan' && d.subject ? d.subject : d.type).toUpperCase();

    const fontFam = d.fontFamily || selectedDocFont || "'Times New Roman', Times, serif";
    const fontSz  = d.fontSize || selectedDocSize || '11pt';

    return `
      <article class="paper doc-official-letter" style="font-family:${E(fontFam)} !important; font-size:${E(fontSz)} !important;">
