        <table style="border:0;width:100%;margin-bottom:8px;font-family:${E(fontFam)} !important;font-size:${E(fontSz)} !important;">
          <tr><td style="width:130px">Nama Lengkap</td><td>: <strong>${E(name)}</strong></td></tr>
          <tr><td>NIB</td><td>: <strong>${E(nib)}</strong></td></tr>
          <tr><td>Jabatan / Cabang</td><td>: ${E(position)} / Cabang ${E(branchName)}</td></tr>
          ${d.subject ? `<tr><td>Perihal</td><td>: <strong>${E(d.subject)}</strong></td></tr>` : ''}
        </table>

        <div class="letter-content" style="font-family:${E(fontFam)} !important;font-size:${E(fontSz)} !important;">${formatDocumentBodyHTML(d.body)}</div>

        <div class="signature-grid doc-officer-signature" style="font-family:${E(fontFam)} !important;font-size:${E(fontSz)} !important;">
          <p>Pontianak, ${HR.date(d.date, {day:'numeric', month:'long', year:'numeric'})}<br>PT. Baraka Sarana Tama</p>
          ${VALID_SIGNATURE_SRC ? `<img class="doc-signature-image" src="${VALID_SIGNATURE_SRC}" alt="Tanda tangan dan stempel Personalia">` : '<div style="height:60px"></div>'}
          <strong style="text-decoration:underline">${E(company.officer)}</strong>
          <p style="margin-top:1px">Personalia Daerah Kalbar</p>
        </div>
      </article>
    `;
  };

  document.addEventListener('click', e => {
    const boldBtn = e.target.closest?.('#btn-bold-selection');
    if(!boldBtn) return;
    const ta = document.getElementById('doc-body');
    if(!ta) return;

    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const val = ta.value;

    if(start === end){
      toast('Blok/sorot dulu kata atau kalimat di kotak Isi Surat yang ingin ditebalkan, lalu klik tombol Bold.', true);
      ta.focus();
      return;
    }

    const selectedText = val.substring(start, end);
    let replacement = `**${selectedText}**`;
    if(selectedText.startsWith('**') && selectedText.endsWith('**') && selectedText.length > 4){
      replacement = selectedText.slice(2, -2);
    }

    ta.value = val.substring(0, start) + replacement + val.substring(end);
    ta.focus();
    ta.setSelectionRange(start, start + replacement.length);
    updateDoc();
  });

  document.addEventListener('change', e => {
    const t = e.target;
    if(!t) return;

    if(t.id === 'doc-font-family' || t.id === 'doc-font-size'){
      selectedDocFont = document.getElementById('doc-font-family')?.value || selectedDocFont;
      selectedDocSize = document.getElementById('doc-font-size')?.value || selectedDocSize;
      try {
        localStorage.setItem('baraka_doc_font', selectedDocFont);
        localStorage.setItem('baraka_doc_size', selectedDocSize);
      } catch(err){}
      updateDoc();
      return;
    }

    if(t.id === 'doc-type'){
      e.stopImmediatePropagation();
      const newType = t.value;
      const empId = document.getElementById('doc-employee')?.value || '';
      const emp = HR.employee(db, empId);
      const brName = emp?.branch || 'Port Pontianak';
      const defaultSubj = DEFAULT_SUBJECT_BY_TYPE[newType] || '';

      const subjContainer = document.getElementById('doc-subject-container');
      if(subjContainer){
        subjContainer.innerHTML = renderDynamicSubjectField(newType, defaultSubj);
      }

      const numEl = document.getElementById('doc-number');
      if(numEl){
        numEl.value = buildOfficialDocNumber(newType, defaultSubj, brName);
      }

      const curVals = window.docValues();
      const bodyEl = document.getElementById('doc-body');
      if(bodyEl){
        bodyEl.value = window.docTemplate(curVals);
      }
      updateDoc();
      return;
    }

    if(t.id === 'doc-employee'){
      e.stopImmediatePropagation();
      const dType = document.getElementById('doc-type')?.value || docTypes[0];
      const emp = HR.employee(db, t.value);
      const brName = emp?.branch || 'Port Pontianak';
      const curSubj = document.getElementById('doc-subject')?.value || '';

      if(emp){
        const recEl = document.getElementById('doc-recipient');
        if(recEl) recEl.value = emp.name;
      }

      const numEl = document.getElementById('doc-number');
      if(numEl){
        numEl.value = buildOfficialDocNumber(dType, curSubj, brName);
      }

      const curVals = window.docValues();
      const bodyEl = document.getElementById('doc-body');
      if(bodyEl){
        bodyEl.value = window.docTemplate(curVals);
      }
      updateDoc();
      return;
    }

    if(t.id === 'doc-subject' && document.getElementById('doc-type')?.value === 'Surat peringatan'){
      const spSubj = t.value;
      const empId = document.getElementById('doc-employee')?.value || '';
      const emp = HR.employee(db, empId);
      const brName = emp?.branch || 'Port Pontianak';

      const numEl = document.getElementById('doc-number');
      if(numEl){
        numEl.value = buildOfficialDocNumber('Surat peringatan', spSubj, brName);
      }

      const curVals = window.docValues();
      const bodyEl = document.getElementById('doc-body');
      if(bodyEl){
        bodyEl.value = window.docTemplate(curVals);
      }
      updateDoc();
      return;
    }
  }, true);

  if(route === 'documents') render();
});
</script>

<script data-baraka-extension="forms-8.1">
BarakaRuntime.registerModule('forms-8.1', function(){
  'use strict';

  function normalizeBranchName(rawBranch){
    if(!rawBranch) return '';
    let clean = String(rawBranch).trim().replace(/^cabang\s+/i, '').trim();
    const configuredBranches = (db.settings.branches || []).map(b => b.name);
    const exactMatch = configuredBranches.find(b => b.toLowerCase() === clean.toLowerCase());
    if(exactMatch) return exactMatch;

    const partialMatch = configuredBranches.find(b =>
      clean.toLowerCase().includes(b.toLowerCase()) ||
      b.toLowerCase().includes(clean.toLowerCase())
    );
    if(partialMatch) return partialMatch;

    return clean.replace(/\b\w+/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
  }

  function rawSel(s){ return String(s||'').trim().toLowerCase(); }
  function isBranchMatch(applicantBranchRaw, selectedFilterBranch){
    if(!selectedFilterBranch) return true;
    const normApp = normalizeBranchName(applicantBranchRaw).toLowerCase();
    const normSel = normalizeBranchName(selectedFilterBranch).toLowerCase();
    const rawApp  = String(applicantBranchRaw || '').toLowerCase();
    return normApp === normSel || rawApp.includes(normSel) || normApp.includes(rawSel(selectedFilterBranch));
  }

  window.candOptions = function(current, empty = 'Pilih dari kandidat rekrutmen'){
    return opts(
      db.candidates.map(c => ({
        value: c.id,
        label: `${c.name} · ${c.position} - Cabang ${c.branch || 'Belum diisi'} (${c.stage})`
      })),
      current,
      empty
    );
  };

  function sanitizeWaNotesLocal(rawNotes){
    if(!rawNotes) return '';
    return String(rawNotes).split('\n').filter(line => {
      const l = line.trim().toUpperCase();
      return !l.startsWith('WAKTU MASUK:') &&
             !l.startsWith('LINK CV:') &&
             !l.startsWith('SUMBER FORM:') &&
             !l.startsWith('SUMBER:') &&
             !l.startsWith('KONTAK DARURAT:') &&
             !l.includes('DRIVE.GOOGLE.COM');

  }

      </div>`,
      actButton('close','Tutup'),
      true
    );
  }

  function extractSheetOrFolderIdLocal(str){
    const clean = str.trim();
    const mFolder = clean.match(/\/folders\/([a-zA-Z0-9-_]+)/);
    if(mFolder) return { type: 'folder', id: mFolder[1] };
    const mSheet = clean.match(/\/d\/([a-zA-Z0-9-_]+)/);
    if(mSheet) return { type: 'sheet', id: mSheet[1] };
    return { type: 'sheet', id: clean };
  }

  const ID_MONTHS_LOCAL = {
    januari:'01', februari:'02', pebruari:'02', maret:'03', april:'04', mei:'05', juni:'06',
    juli:'07', agustus:'08', september:'09', oktober:'10', november:'11', nopember:'11', desember:'12',
    jan:'01', feb:'02', mar:'03', apr:'04', jun:'06', jul:'07', agu:'08', ags:'08', sep:'09', okt:'10', nov:'11', des:'12'
  };

  function parseIndoDateLocal(raw){
    if(!raw) return '';
    let s = String(raw).trim();
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    let mIndo = s.match(/^(\d{1,2})\s+([a-zA-Z]+)\s+(\d{4})/);
    if(mIndo){
      let d = mIndo[1].padStart(2,'0');
      let mo = ID_MONTHS_LOCAL[mIndo[2].toLowerCase()];
      if(mo) return `${mIndo[3]}-${mo}-${d}`;
    }
    let mSlash = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    if(mSlash){
      return `${mSlash[3]}-${mSlash[2].padStart(2,'0')}-${mSlash[1].padStart(2,'0')}`;
    }
    return '';
  }

  async function executePullFormsV81(){
    const rawInput = document.querySelector('#gform-sheets-input')?.value.trim() || '';
    const scriptUrl = auxGet('baraka_pusat_readonly_url') || '';
    if(!scriptUrl) throw Error('Harap hubungkan URL Google Apps Script terlebih dahulu di menu Sync Database Cabang.');
    if(!rawInput) throw Error('Masukkan minimal satu link/ID Spreadsheet Respons atau link Folder FORMULIR.');

    const selectedBranch = document.querySelector('#gform-branch-filter')?.value || '';
    auxSet('baraka_gform_sheets', rawInput);
    auxSet('baraka_gform_branch_filter', selectedBranch);

    const lines = rawInput.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean);
    const sheetIds = [];
    let folderId = '';

    lines.forEach(item => {
      const parsed = extractSheetOrFolderIdLocal(item);
      if(parsed.type === 'folder') folderId = parsed.id;
      else sheetIds.push(parsed.id);
    });

    const skipColored = document.querySelector('#gform-skip-colored')?.checked ? 'true' : 'false';
    const startDate = document.querySelector('#gform-start-date')?.value || '';
    const endDate   = document.querySelector('#gform-end-date')?.value || '';
    const defaultStage = document.querySelector('#gform-default-stage')?.value || 'Screening';
    const autoMatchPsi = document.querySelector('#gform-auto-match-psi')?.value === 'yes';

    toast(`⏳ Membaca G-Form${selectedBranch ? ' khusus penempatan Cabang ' + selectedBranch : ''}...`);
    const sep = scriptUrl.includes('?') ? '&' : '?';
    let fullUrl = `${scriptUrl}${sep}action=form_responses&skipColored=${skipColored}`;
    if(sheetIds.length) fullUrl += `&sheetIds=${encodeURIComponent(sheetIds.join(','))}`;
    if(folderId) fullUrl += `&folderId=${encodeURIComponent(folderId)}`;
    if(startDate) fullUrl += `&startDate=${encodeURIComponent(startDate)}`;
    if(endDate) fullUrl += `&endDate=${encodeURIComponent(endDate)}`;
    if(selectedBranch) fullUrl += `&branch=${encodeURIComponent(selectedBranch)}`;

    BarakaSafety.safeURL(fullUrl, {httpsOnly:true});
    const res = await fetch(fullUrl, {
      method: 'GET',
      redirect: 'follow',
      credentials: (['script.google.com','script.googleusercontent.com'].includes(new URL(fullUrl).hostname) ? 'omit' : 'include'),
      signal: AbortSignal.timeout(20000)
    });
    if(!res.ok) throw Error('Konektor HTTP ' + res.status + '. Periksa akses privat dan izin akun.');
    const data = await res.json();
    BarakaSafety.inspect(data);
    if(data.status === 'error') throw Error('Google Script Error: ' + data.message);
    if(!Array.isArray(data.applicants)) throw Error('Format respons pelamar tidak valid.');

    const allApplicants = data.applicants || [];
    const filteredApplicants = allApplicants.filter(app => {
      if(!selectedBranch) return true;
      if(app.isPsikotes && autoMatchPsi) return true;
      return isBranchMatch(app.branch, selectedBranch);
    });

    const skippedByBranch = allApplicants.length - filteredApplicants.length;

    if(!filteredApplicants.length){
      throw Error(
        selectedBranch
          ? `Tidak ditemukan pelamar untuk penempatan Cabang ${selectedBranch} pada rentang tersebut (${skippedByBranch} pelamar dari cabang lain dilewati).`
          : 'Tidak ada pelamar baru yang memenuhi syarat filter.'
      );
    }

    let added = 0, updated = 0;
    mutate('Tarik & filter pelamar Google Form', () => {
      filteredApplicants.forEach(app => {
        const name = String(app.name||'').trim();
        const phone = String(app.phone||'').trim();
        if(!name) return;

        const cleanCvUrl = (app.cvLink && /^https?:\/\//i.test(app.cvLink)) ? app.cvLink.trim() : '';
        const cleanBranch = normalizeBranchName(app.branch) || selectedBranch || branch || 'Pontianak Barat';

        if(cleanBranch && !db.settings.branches.some(b => b.name.toLowerCase() === cleanBranch.toLowerCase())){
          db.settings.branches.push({
            id: 'branch_' + cleanBranch.toLowerCase().replace(/[^a-z0-9]/g, '_'),
            name: cleanBranch,
            address: 'Cabang ' + cleanBranch,
            maps: ''
          });
        }

        let existing = db.candidates.find(c =>
          (phone && c.phone && c.phone === phone) ||
          (c.name.toLowerCase() === name.toLowerCase())
        );

        if(app.isPsikotes && autoMatchPsi && existing){
          if(selectedBranch && !isBranchMatch(existing.branch, selectedBranch)) return;
          existing.stage = 'Psikotes';
          let psiNote = `[Hasil Psikotes]: Skor ${app.score || 'Tercatat'} (Form: ${app.formSource})`;
          if(!existing.notes.includes(psiNote)){
            existing.notes = [existing.notes, psiNote].filter(Boolean).join('\n');
          }
          updated++;
        } else if(existing){
          if(app.age) existing.age = app.age;
          if(app.education) existing.education = app.education;
          if(app.experience) existing.experience = app.experience;
          if(app.expectedSalary) existing.expectedSalary = Number(app.expectedSalary);
          if(cleanCvUrl) existing.cvLink = cleanCvUrl;
          if(app.phone) existing.phone = app.phone;
          if(app.branch) existing.branch = cleanBranch;
          updated++;
        } else {
          if(app.isPsikotes && autoMatchPsi && selectedBranch) return;
          db.candidates.unshift({
            id: HR.id(),
            name: name,
            position: app.position || 'Staff',
            branch: cleanBranch,
            phone: phone,
            email: app.email || '',
            stage: app.isPsikotes ? 'Psikotes' : defaultStage,
            source: 'Google Form (' + app.formSource + ')',
            appliedDate: (app.timestamp ? (parseIndoDateLocal(app.timestamp) || HR.today()) : HR.today()),
            schedule: (defaultStage === 'Interview' || defaultStage === 'Psikotes') ? HR.today() : '',
            time: '09:00',
            age: app.age || '',
            education: app.education || '',
            experience: app.experience || '',
            expectedSalary: Number(app.expectedSalary) || 0,
            cvLink: cleanCvUrl,
            notes: (app.score ? `Skor Tes: ${app.score}` : '')
          });
          added++;
        }
      });
    }, `${added} pelamar baru, ${updated} diperbarui${selectedBranch ? ' (Cabang ' + selectedBranch + ')' : ''}`);

    const stamp = new Date().toLocaleString('id-ID', {timeZone:'Asia/Jakarta'});
    const filterInfo = selectedBranch ? `Cabang ${selectedBranch}` : 'Semua Cabang';
    auxSet('baraka_last_form_pull', `${stamp} - ${filterInfo} (${added} baru, ${updated} diupdate, ${skippedByBranch} cabang lain dilewati)`);
    closeModal();
    navigate('recruitment');
    toast(`🎉 [${filterInfo}] ${added} pelamar baru & ${updated} diperbarui (${skippedByBranch} cabang lain dilewati)!`);
  }

  document.addEventListener('click', async e => {
    const pullTrigger = e.target.closest?.('[data-hrd76="modal-pull-forms"]');
    if(pullTrigger){
      e.preventDefault();
      e.stopImmediatePropagation();
      openPullFormsModalV81();
      return;
    }

    const execTrigger = e.target.closest?.('[data-hrd81="exec-pull-forms"]');
    if(execTrigger){
      e.preventDefault();
      e.stopImmediatePropagation();
      try {
        await executePullFormsV81();
      } catch(err){
        toast(err.message || 'Gagal menarik data G-Form.', true);
      }
    }
  }, true);

  if(route === 'messages' || route === 'recruitment') render();
});
</script>

<script data-baraka-extension="cloud-8.2">
BarakaRuntime.registerModule('cloud-8.2', function(){
  'use strict';

  let syncBusy = false;

  // Override fungsi cloudOperation agar mendukung Google Apps Script lama (Legacy) maupun BARAKA_SYNC_V1
  window.cloudOperation = async function(kind){
    if(mode !== 'work'){
      switchMode('work');
    }
    if(syncBusy) throw Error('Sinkronisasi sedang berjalan, mohon tunggu...');
    
    const input = document.querySelector('#cloud-webhook-input');
    const url = BarakaSafety.safeURL((input?.value.trim() || db.settings.cloudWebhookUrl), {httpsOnly:true});
    if(!url) throw Error('URL Web App Google Apps Script belum diisi.');

    if(url !== db.settings.cloudWebhookUrl){
      mutate('Memperbarui URL Cloud Webhook', () => { db.settings.cloudWebhookUrl = url; });
    }

    syncBusy = true;
    cloudInFlight = false;
    try { cloudSetState({status: 'Memproses'}); } catch(e){}

    try {
      if(kind === 'push'){
        toast('⏳ Mengirim (Push) seluruh database ke Google Cloud...');
        const packedPayload = await BarakaSafety.pack({...HR.validatePayload(db), workspaceMode: 'work'});
        const snapshotDigest = packedPayload.backupIntegrity.digest;

        // Kirim format gabungan agar kompatibel dengan semua versi Google Apps Script (doPost)
        const bodyData = JSON.stringify({
          action: 'push',
          protocol: 'BARAKA_SYNC_V1',
          workspace: 'work',
          clientRevision: db.revision || 1,
          digest: snapshotDigest,
          payload: packedPayload,
          data: packedPayload,
          db: packedPayload,
          employees: packedPayload.employees,
          candidates: packedPayload.candidates,
          tasks: packedPayload.tasks,
          attendance: packedPayload.attendance,
          leaves: packedPayload.leaves,
          claims: packedPayload.claims,
          assets: packedPayload.assets,
          cases: packedPayload.cases,
          reviews: packedPayload.reviews,
          documents: packedPayload.documents,
          messages: packedPayload.messages,
          payroll: packedPayload.payroll,
          settings: packedPayload.settings,
          updatedAt: new Date().toISOString()
        });

        let pushSuccess = false;
        try {
          const res = await fetch(url, {
            method: 'POST',
            mode: 'cors',
            credentials: 'omit',
            redirect: 'follow',
            headers: {'Content-Type': 'text/plain;charset=utf-8'},
            body: bodyData,
            signal: AbortSignal.timeout(25000)
          });
          if(res.ok || res.type === 'opaque'){
            pushSuccess = true;
          }
        } catch(corsErr){
          // Fallback jika Apps Script menolak preflight CORS pada POST
          await fetch(url, {
            method: 'POST',
            mode: 'no-cors',
            credentials: 'omit',
            headers: {'Content-Type': 'text/plain;charset=utf-8'},
            body: bodyData
          });
          pushSuccess = true;
        }

        if(pushSuccess){
          const nowIso = new Date().toISOString();
          cloudMarkConfirmed({
            cloudRevision: (db.revision || 1),
            localRevision: db.revision,
            savedAt: nowIso,
            direction: 'Push'
          });
          auxSet('baraka_pusat_readonly_url', url);
          closeModal();
          render();
          toast('✅ Push Berhasil! Seluruh data tersimpan di Google Cloud.');
        }
      } else {
        toast('⏳ Menarik (Pull) database dari Google Cloud...');
        let rawText = '';
        const pullUrl = new URL(url);
        pullUrl.searchParams.set('action', 'pull');
        pullUrl.searchParams.set('workspace', 'work');
        pullUrl.searchParams.set('_t', Date.now());

        let res;
        try {
          res = await fetch(pullUrl.href, {
            method: 'GET',
            mode: 'cors',
            credentials: 'omit',
            redirect: 'follow',
            signal: AbortSignal.timeout(25000)
          });
        } catch(e){
          // Coba panggil URL murni tanpa query param jika gagal
          res = await fetch(url, {
            method: 'GET',
            mode: 'cors',
            credentials: 'omit',
            redirect: 'follow',
            signal: AbortSignal.timeout(25000)
          });
        }

        if(!res || !res.ok) throw Error('Gagal menghubungi server Google Script (HTTP ' + (res?.status || 'Error') + ').');
        rawText = await res.text();

        let parsed;
        try {
          parsed = JSON.parse(rawText);
        } catch(e){
          throw Error('Respons dari Google Script bukan format JSON database yang valid.');
        }

        // Adaptor otomatis untuk mengekstrak letak objek database dari berbagai versi script
        let candidateDb = parsed;
        if(parsed?.payload && typeof parsed.payload === 'object') candidateDb = parsed.payload;
        else if(parsed?.data && typeof parsed.data === 'object' && !Array.isArray(parsed.data)) candidateDb = parsed.data;
        else if(parsed?.db && typeof parsed.db === 'object') candidateDb = parsed.db;
        else if(parsed?.result && typeof parsed.result === 'object') candidateDb = parsed.result;

        // Jika ternyata URL tersebut adalah script pembaca Spreadsheet 26 kolom (hanya berisi array employees tanpa settings)
        if(Array.isArray(candidateDb?.employees) && !candidateDb?.settings){
          candidateDb = {
            ...HR.fresh(),
            ...db,
            employees: candidateDb.employees,
            workspaceMode: 'work'
          };
        }

        if(!candidateDb || !Array.isArray(candidateDb.employees)){
          throw Error('Cloud masih kosong atau belum ada data yang di-Push ke URL ini. Silakan lakukan Push dari perangkat utama terlebih dahulu.');
        }

        // Bersihkan properti checksum jika berasal dari endpoint lama agar tidak ditolak BarakaSafety
        const cleanCopy = JSON.parse(JSON.stringify(candidateDb));
        delete cleanCopy.backupIntegrity;
        cleanCopy.workspaceMode = 'work';

        const validated = HR.validatePayload(cleanCopy);
        const nowIso = new Date().toISOString();

        previewImport(validated, true);
        if(typeof importContext === 'object' && importContext){
          importContext.cloud = {
            cloudRevision: Number(parsed?.cloudRevision || validated.revision || 1),
            savedAt: parsed?.savedAt || nowIso
          };
        }
        cloudMarkConfirmed({
          cloudRevision: Number(parsed?.cloudRevision || validated.revision || 1),
          localRevision: validated.revision || 1,
          savedAt: nowIso,
          direction: 'Pull'
        });
        toast('✅ Data Cloud berhasil ditarik! Silakan centang konfirmasi di layar untuk menerapkan.');
      }
    } catch(err){
      try { cloudSetState({status: 'Gagal'}); } catch(e){}
      throw Error(err.message || 'Gagal melakukan sinkronisasi cloud.');
    } finally {
      syncBusy = false;
      cloudInFlight = false;
    }
  };

  // Bersihkan status 'Gagal' atau 'Memproses' yang sempat menggantung
  try {
    const st = cloudState();
    if(st.status === 'Gagal' || st.status === 'Memproses'){
      cloudSetState({status: 'Siap Sinkron'});
    }
  } catch(e){}

  render();
});
</script>

<script data-baraka-extension="architecture-9.0">
BarakaRuntime.registerModule('architecture-9.0', function(){
  'use strict';

  /* ============================================================================
   * 1. MODUL ARSITEKTUR, VERSI RILIS RESMI (9.0.0) & MIGRASI TERKONTROL
   * ============================================================================ */
  const OFFICIAL_VERSION = 9.0;
  HR.VERSION = OFFICIAL_VERSION;

  const BarakaArchitecture = {
    version: '9.0.0-Enterprise',
    modules: ['CoreData', 'UIRenderer', 'ValidationSafety', 'CloudIntegration', 'AuditAndTestSuite'],
    migrateDatabase(database) {
      if (!database || typeof database !== 'object') return database;
      const fromVer = Number(database.schemaVersion || 6.2);
      database.schemaVersion = OFFICIAL_VERSION;
      database.releaseTag = '9.0.0';
      if (!database.calendarMeta || typeof database.calendarMeta !== 'object') {
        database.calendarMeta = {}; // Menyimpan status hadir/selesai/batal/reschedule & anti-duplikat gcal
      }
      if (!database.operatorSession || typeof database.operatorSession !== 'object') {
        database.operatorSession = {
          officer: database.settings?.officer || 'Muhammad Erwin',
          role: database.settings?.title || 'HRD & Personalia Daerah',
          verified: true,
          verifiedAt: new Date().toISOString()
        };
      }
      if (fromVer < OFFICIAL_VERSION) {
        database.migratedAt = new Date().toISOString();
      }
      return database;
    }
  };

  BarakaArchitecture.migrateDatabase(db);

  /* ============================================================================
   * 2. ENGINE PENYIMPANAN INDEXEDDB (DENGAN SINKRONISASI SNAPSHOT NON-BLOKIR)
   * ============================================================================ */
  const BarakaIDB = (() => {
    const DB_NAME = 'BarakaPeopleOS_IndexedDB_v9';
    const STORE_MAIN = 'workspaces';
    const STORE_SNAP = 'snapshots';
    const STORE_AUDIT = 'audit_logs';
    let dbPromise = null;

    function open() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error('IndexedDB tidak didukung'));
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (ev) => {
          const idb = ev.target.result;
          if (!idb.objectStoreNames.contains(STORE_MAIN)) idb.createObjectStore(STORE_MAIN, { keyPath: 'key' });
          if (!idb.objectStoreNames.contains(STORE_SNAP)) idb.createObjectStore(STORE_SNAP, { keyPath: 'id', autoIncrement: true });
          if (!idb.objectStoreNames.contains(STORE_AUDIT)) idb.createObjectStore(STORE_AUDIT, { keyPath: 'id' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return dbPromise;
    }

    async function saveWorkspace(key, payloadObj) {
      const idb = await open();
      return new Promise((resolve, reject) => {
        const tx = idb.transaction([STORE_MAIN, STORE_SNAP], 'readwrite');
        tx.objectStore(STORE_MAIN).put({
          key,
          updatedAt: new Date().toISOString(),
          revision: payloadObj.revision || 1,
          data: payloadObj
        });
        tx.objectStore(STORE_SNAP).add({
          workspaceKey: key,
          savedAt: new Date().toISOString(),
          revision: payloadObj.revision || 1,
          data: payloadObj
        });
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
      });
    }

    async function loadWorkspace(key) {
      const idb = await open();
      return new Promise((resolve, reject) => {
        const tx = idb.transaction([STORE_MAIN], 'readonly');
        const req = tx.objectStore(STORE_MAIN).get(key);
        req.onsuccess = () => resolve(req.result?.data || null);
        req.onerror = () => reject(req.error);
      });
    }

    async function recordVerifiedAudit(entry) {
      const idb = await open();
      return new Promise((resolve) => {
        const tx = idb.transaction([STORE_AUDIT], 'readwrite');
        tx.objectStore(STORE_AUDIT).put(entry);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      });
    }

    async function stats() {
      try {
        const idb = await open();
        return new Promise((resolve) => {
          const tx = idb.transaction([STORE_SNAP], 'readonly');
          const req = tx.objectStore(STORE_SNAP).count();
          req.onsuccess = () => resolve({ active: true, snapshots: req.result || 0 });
          req.onerror = () => resolve({ active: true, snapshots: 0 });
        });
      } catch {
        return { active: false, snapshots: 0 };
      }
    }

    return { open, saveWorkspace, loadWorkspace, recordVerifiedAudit, stats };
  })();

  // Helper eksplisit penghitung waktu mulai & waktu selesai Google Calendar (Format YYYYMMDDTHHMMSS)
  function computeExplicitGCalDates(dateStr, timeStr, durationMinutes = 60) {
    if (!HR.validDate(dateStr)) throw new Error('Tanggal pelaksanaan tidak valid (Wajib YYYY-MM-DD).');
    const cleanTime = /^([01]\d|2[0-3]):([0-5]\d)$/.test(String(timeStr || '').trim())
      ? String(timeStr).trim()
      : '09:00';
    const [hh, mm] = cleanTime.split(':').map(Number);
    const dur = Math.max(15, Math.min(720, Number(durationMinutes) || 60));

    // Gunakan konstruktor UTC secara deterministik untuk memajukan menit & tanggal jika lewat tengah malam
    const startObj = new Date(`${dateStr}T${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:00Z`);
    const endObj = new Date(startObj.getTime() + dur * 60000);

    const fmt = (d) => {
      const yyyy = d.getUTCFullYear();
      const mo = String(d.getUTCMonth() + 1).padStart(2, '0');
      const dd = String(d.getUTCDate()).padStart(2, '0');
      const h = String(d.getUTCHours()).padStart(2, '0');
      const m = String(d.getUTCMinutes()).padStart(2, '0');
      return `${yyyy}${mo}${dd}T${h}${m}00`;
    };

    return {
      startFormatted: fmt(startObj),
      endFormatted: fmt(endObj),
      cleanTime,
      durationMinutes: dur
    };
  }

  function saveCalendarEventControl(eventId, evType) {
    const newStatus = document.querySelector('#cal-ctrl-status')?.value || 'Terjadwal';
    const reminderMin = Number(document.querySelector('#cal-ctrl-reminder')?.value || 60);
    const newDate = document.querySelector('#cal-ctrl-date')?.value || '';
    const newTime = document.querySelector('#cal-ctrl-time')?.value || '09:00';

    mutate('Update status & jadwal kegiatan kalender', () => {
      if (!db.calendarMeta) db.calendarMeta = {};
      db.calendarMeta[eventId] = {
        ...getCalMeta(eventId),
        status: newStatus,
        reminderMin
      };

      if (evType === 'Tugas') {
        const t = db.tasks.find(x => x.id === eventId);
        if (t) {
          if (HR.validDate(newDate)) t.due = newDate;
          if (newStatus === 'Selesai') HR.completeTask(db, t.id);
        }
      } else if (evType === 'Seleksi') {
        const c = db.candidates.find(x => x.id === eventId);
        if (c) {
          if (HR.validDate(newDate)) c.schedule = newDate;
          if (newTime) c.time = newTime;
        }
      }
    }, `${eventId} -> ${newStatus}`);

    closeModal();
    render();
    toast(`✅ Status agenda diperbarui ke "${newStatus}".`);
  }

  function openGoogleCalendarNonZeroDuration({ id, title, date, time, durationMinutes, details, location }) {
    const calc = computeExplicitGCalDates(date, time, durationMinutes);
    const meta = getCalMeta(id);
    if (meta.gcalSynced && meta.lastSyncedSlot === `${calc.startFormatted}/${calc.endFormatted}`) {
      if (!confirm('Acara ini sudah pernah disinkronkan pada jam yang sama. Buka Google Calendar lagi?')) return;
    }
    setCalMeta(id, { gcalSynced: true, lastSyncedSlot: `${calc.startFormatted}/${calc.endFormatted}` });

    const gcalUrl = new URL('https://calendar.google.com/calendar/render');
    gcalUrl.searchParams.set('action', 'TEMPLATE');
    gcalUrl.searchParams.set('text', title);
    gcalUrl.searchParams.set('dates', `${calc.startFormatted}/${calc.endFormatted}`);
    gcalUrl.searchParams.set('ctz', 'Asia/Jakarta');
    gcalUrl.searchParams.set('details', `${details || ''}\n\n[UID: ${id}@baraka-peopleos-v9]`);
    if (location) gcalUrl.searchParams.set('location', location);

    window.open(gcalUrl.href, '_blank', 'noopener,noreferrer');
    toast(`📅 Membuka Google Calendar (${calc.durationMinutes} menit, WIB).`);
  }

      window[cbName] = (data) => {
        cleanup();
        resolve(data);
      };

      const sep = url.includes('?') ? '&' : '?';
      script.src = `${url}${sep}callback=${cbName}&_t=${Date.now()}`;
      script.onerror = () => {
        cleanup();

<script data-baraka-extension="workflow-backup-9.2">
BarakaRuntime.registerModule('workflow-backup-9.2', function(){
  'use strict';

  /* ============================================================================
   * BAGIAN 1: UNIFIED BACKUP SCHEMA, RETENSI TERJADWAL & SANDBOX RESTORE (POIN C.2)
   * ============================================================================ */
  const AUX_KEYS_TO_UNIFY = [
    'baraka_sopir_luar_kota_v8',
    'baraka_pusat_readonly_url',
    'baraka_pusat_folder_id',
    'baraka_pusat_last_pull',
    'baraka_gform_sheets',
    'baraka_gform_branch_filter',
    'baraka_last_form_pull',
    'baraka_eval_gform_link',
    'baraka_verified_operator_v9'
  ];

  // Kumpulkan semua pengaturan terpisah di localStorage ke dalam db.settings.unifiedExtensions
  function collectUnifiedExtensions() {
    const ext = {};
    AUX_KEYS_TO_UNIFY.forEach(k => {
      const val = auxGet(k);
      if (val !== null && val !== undefined && val !== '') ext[k] = val;
    });
    ext.uiTheme = document.documentElement.dataset.theme || storageGet('baraka_peopleos_v4_theme') || 'light';
    ext.selectedBranchFilter = branch || '';
    ext.capturedAt = new Date().toISOString();
    return ext;
  }

  // Pulihkan seluruh pengaturan tambahan dari objek backup ke localStorage perangkat tujuan
  function restoreUnifiedExtensions(ext) {
    if (!ext || typeof ext !== 'object') return 0;
    let restoredCount = 0;
    AUX_KEYS_TO_UNIFY.forEach(k => {
      if (ext[k] !== undefined && ext[k] !== null) {
        try { auxSet(k, String(ext[k])); restoredCount++; } catch {}
      }
    });
    if (ext.uiTheme && ['light', 'dark'].includes(ext.uiTheme)) {
      document.documentElement.dataset.theme = ext.uiTheme;
      storageSet('baraka_peopleos_v4_theme', ext.uiTheme);
      restoredCount++;
    }
    return restoredCount;
  }

  // Lacak 4 status siklus backup: Backup Dibuat, Terkirim ke Server, Terverifikasi, Berhasil Dipulihkan
  function getBackupLifecycle() {
    try {
      const raw = auxGet('baraka_backup_lifecycle_v92');
      if (raw) return JSON.parse(raw);
    } catch {}
    return {
      created: null,
      sentToServer: null,
      verified: null,
      restored: null
    };
  }

  function updateBackupLifecycle(stageKey, detailText) {
    const current = getBackupLifecycle();
    current[stageKey] = {
      at: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }),
      detail: detailText || 'OK'
    };
    try { auxSet('baraka_backup_lifecycle_v92', JSON.stringify(current)); } catch {}
    return current;
  }

  // Override BarakaSafety.pack agar SELALU menyertakan unifiedExtensions & mencatat status "Backup Dibuat"
  const origPack = BarakaSafety.pack;
  BarakaSafety.pack = async function(value) {
    const cloneVal = JSON.parse(JSON.stringify(value));
    if (!cloneVal.settings) cloneVal.settings = {};
    cloneVal.settings.unifiedExtensions = collectUnifiedExtensions();
    cloneVal.schemaVersion = 9.0;
    cloneVal.backupMeta = {
      schemaVersion: '9.2.0-Unified',
      createdAt: new Date().toISOString(),
      recordCounts: Object.fromEntries(HR.collections.map(c => [c, Array.isArray(cloneVal[c]) ? cloneVal[c].length : 0])),
      extensionsIncluded: Object.keys(cloneVal.settings.unifiedExtensions)
    };
    const packed = await origPack(cloneVal);
    updateBackupLifecycle('created', `Rev ${cloneVal.revision || 1}`);
    updateBackupLifecycle('verified', `SHA-256: ${packed.backupIntegrity.digest.slice(0, 10)}...`);
    return packed;
  };

  // Override BarakaSafety.unpack agar mencatat status "Terverifikasi"
  const origUnpack = BarakaSafety.unpack;
  BarakaSafety.unpack = async function(raw) {
    const res = await origUnpack(raw);
    if (res.verified) {
      updateBackupLifecycle('verified', `Checksum Valid`);
    }
    return res;
  };

  // Kebijakan Retensi Backup Terjadwal Otomatis (Maksimal 10 Snapshot Terjadwal)
  function runScheduledRetentionBackup() {
    try {
      const RETENTION_KEY = 'baraka_scheduled_backups_v92';
      const MAX_RETENTION = 10;
      const list = JSON.parse(storageGet(RETENTION_KEY) || '[]');
      const todayStamp = HR.today();
      if (list.some(x => x.date === todayStamp && x.revision === db.revision)) return;

      const snapshotSummary = {
        id: HR.id(),
        date: todayStamp,
        savedAt: new Date().toISOString(),
        revision: db.revision || 1,
        employees: db.employees.length,
        candidates: db.candidates.length,
        tasks: db.tasks.length
      };
      list.unshift(snapshotSummary);
      storageSet(RETENTION_KEY, JSON.stringify(list.slice(0, MAX_RETENTION)));
    } catch {}
  }
  runScheduledRetentionBackup();

  // Uji Pemulihan ke Lingkungan Terpisah (Sandbox Restore Test tanpa mengubah data kerja aktif)
  async function runSandboxRestoreTest(payloadToTest) {
    const startMs = performance.now();
    const rawClone = JSON.parse(JSON.stringify(payloadToTest || await BarakaSafety.pack(db)));
    const unpacked = await BarakaSafety.unpack(rawClone);
    const sandboxDb = HR.validatePayload(unpacked.data);
    const extData = sandboxDb.settings?.unifiedExtensions || {};
    const elapsed = Math.round(performance.now() - startMs);

    return {
      ok: true,
      elapsedMs: elapsed,
      verifiedChecksum: unpacked.verified,
      schemaVersion: sandboxDb.schemaVersion,
      counts: {
        employees: sandboxDb.employees.length,
        candidates: sandboxDb.candidates.length,
        tasks: sandboxDb.tasks.length,
        documents: sandboxDb.documents.length,
        payroll: sandboxDb.payroll.length
      },
      extensionsCount: Object.keys(extData).length,
      extensionsList: Object.keys(extData)
    };
  }

  /* ============================================================================
   * BAGIAN 2: UPGRADE TUGAS RUTIN, ANTI-DUPLIKAT, ESKALASI & ONBOARDING STEP (POIN C.1)
   * ============================================================================ */
  // Perhitungan tanggal siklus cerdas: membedakan "Jadwal Rutin Tetap" vs "Sejak Penyelesaian Terakhir"
  function computeNextRecurrenceDue(task, modeType = 'fixed', skipCount = 1) {
    const todayStr = HR.today();
    const baseDue = HR.validDate(task.due) ? task.due : todayStr;
    const step = (d) => {
      if (task.recurrence === 'Harian') return HR.addDays(d, 1);
      if (task.recurrence === 'Mingguan') return HR.addDays(d, 7);
      return HR.nextMonth(d);
    };

    if (modeType === 'from_completion') {
      // Dihitung sejak tanggal penyelesaian terakhir (hari ini)
      let nextD = todayStr;
      for (let i = 0; i < skipCount; i++) nextD = step(nextD);
      return nextD;
    } else {
      // Jadwal rutin tetap: majukan dari tenggat asli, dan jika masih di masa lalu, lompat ke siklus masa depan terdekat
      let nextD = baseDue;
      for (let i = 0; i < skipCount; i++) nextD = step(nextD);
      let guard = 0;
      while (nextD < todayStr && guard < 240) {
        nextD = step(nextD);
        guard++;
      }
      return nextD;
    }
  }

  // Sinkronisasi status penyelesaian masing-masing langkah Onboarding / Offboarding ke profil karyawan
  function syncOnboardingStepProgress(task) {
    if (!task.empId || !['Onboarding', 'Offboarding'].includes(task.category)) return;
    const emp = HR.employee(db, task.empId);
    if (!emp) return;
    if (!emp.workflowProgress) emp.workflowProgress = { Onboarding: [], Offboarding: [] };
    const stepName = task.title.split('·').pop().trim();
    const arr = emp.workflowProgress[task.category] || [];
    if (!arr.includes(stepName)) arr.push(stepName);
    emp.workflowProgress[task.category] = arr;

    // Jika berkas identitas/kontrak/BPJS selesai di onboarding, otomatis lengkapi docChecklist karyawan
    if (!Array.isArray(emp.docChecklist)) emp.docChecklist = [];
    if (/dokumen|identitas|ktp/i.test(stepName) && !emp.docChecklist.includes('Identitas')) emp.docChecklist.push('Identitas');
    if (/sop|orientasi|kontrak/i.test(stepName) && !emp.docChecklist.includes('Kontrak')) emp.docChecklist.push('Kontrak');
  }

  // Override HR.completeTask dengan pencegah duplikat, mode siklus, dan sinkronisasi langkah onboarding
  HR.completeTask = function(database, tid, options = {}) {
    const t = database.tasks.find(x => x.id === tid);
    if (!t || t.status === 'Selesai') return;
    t.status = 'Selesai';
    t.completedAt = new Date().toISOString();

    if (t.empId && ['Onboarding', 'Offboarding'].includes(t.category)) {
      syncOnboardingStepProgress(t);
    }

    if (t.recurrence && t.recurrence !== 'Tidak berulang' && !options.noNextCycle) {
      const recMode = options.recurrenceMode || t.recurrenceMode || 'fixed';
      const nextDue = computeNextRecurrenceDue(t, recMode, options.skipCycles || 1);

      // Cegah pembuatan tugas rutin ganda (cek judul & tanggal siklus yang sama)
      const isDuplicate = database.tasks.some(x =>
        x.id !== t.id &&
        x.status !== 'Selesai' &&
        x.title.trim().toLowerCase() === t.title.trim().toLowerCase() &&
        x.due === nextDue
      );

      if (!isDuplicate) {
        database.tasks.push({
          ...t,
          id: HR.id(),
          due: nextDue,
          recurrenceMode: recMode,
          status: 'Belum mulai',
          completedAt: null,
          parentId: tid
        });
      }
    }
  };

  // Hitung ringkasan progres Onboarding & Offboarding per karyawan
  function getWorkflowCardsHTML() {
    const wfTasks = filtered(db.tasks).filter(t => ['Onboarding', 'Offboarding'].includes(t.category) && t.empId);

      if (!byEmp.has(key)) byEmp.set(key, { empId: t.empId, category: t.category, tasks: [] });
      byEmp.get(key).tasks.push(t);
    });
    if (!byEmp.size) return '';

    return `<div class="wf-banner-v92">` + [...byEmp.values()].map(group => {
      const emp = HR.employee(db, group.empId);
      const total = group.tasks.length;
      const done = group.tasks.filter(x => x.status === 'Selesai').length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      return `<div class="wf-card-v92">
        <h4>
          <span>${E(group.category)} · ${E(emp?.name || 'Karyawan')}</span>

        </h4>
        <div class="progress" style="margin-bottom:8px"><span style="width:${pct}%"></span></div>
        <div>
          ${group.tasks.map(st => {

            return `<span class="wf-step-pill ${isDone ? 'done' : ''}" title="${E(st.title)}">${isDone ? '✓' : '○'} ${E(label.slice(0, 26))}</span>`;

  // Modal Penyelesaian Tugas Rutin (Pilih: Jadwal Rutin Tetap vs Sejak Penyelesaian Terakhir vs Tugas Susulan)

  /* ============================================================================
   * BAGIAN 3: ENHANCED QUICK SYNC & PRATINJAU PEMULIHAN (4 STATUS SIKLUS BACKUP)

  function renderLifecycleBarHTML() {

  // Override previewImport agar menampilkan pratinjau lengkap termasuk unifiedExtensions & uji sandbox
  const origPreviewImport = window.previewImport;
  window.previewImport = function(data, verified = false) {
    origPreviewImport(data, verified);
    const ext = data.settings?.unifiedExtensions || {};
    const extKeys = Object.keys(ext);
    const modalBody = document.querySelector('#modal .modal-body');

  // Override commitImport agar otomatis memulihkan unifiedExtensions dan menandai status "Berhasil Dipulihkan"
  const origCommitImport = window.commitImport;

  // Panel Manajemen Backup Terpadu & Sandbox Restore Test
  async function openUnifiedBackupInspectorModal() {

    modal('🛡️ Pusat Kendali Backup Terpadu, Retensi & Uji Sandbox (v9.2)',

  // Tambahkan tombol "Status Backup Terpadu" di bar atas
  function injectV92Buttons() {
    const barActions = document.querySelector('#rev-autopilot-bar .rev-actions');
    if (!barActions || document.querySelector('[data-v92="open-backup-inspector"]')) return;
    barActions.insertAdjacentHTML('beforeend', `
      <button type="button" class="btn sm soft" data-v92="open-backup-inspector">${icon('lock')} Status Backup Terpadu</button>
    `);
  }

  // Event Listener untuk seluruh aksi baru di Upgrade Pack 9.2
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest?.('[data-v92]');
    if (!btn) return;
    const act = btn.dataset.v92;
    const id = btn.dataset.id;

    try {
      if (act === 'open-backup-inspector') {
        await openUnifiedBackupInspectorModal();
      } else if (act === 'complete-recurring-modal') {
        openCompleteRecurringModal(id);
      } else if (act === 'exec-complete-recurring') {
        const modeVal = document.querySelector('#rec-mode-select')?.value || 'fixed';
        const makeCatchup = document.querySelector('#rec-create-catchup')?.checked;
        const t = db.tasks.find(x => x.id === id);
        if (!t) return;
        mutate('Menyelesaikan tugas rutin (' + modeVal + ')', () => {
          HR.completeTask(db, id, { recurrenceMode: modeVal });
          if (makeCatchup) {
            db.tasks.unshift({
              ...t,
              id: HR.id(),
              title: `[SUSULAN] ${t.title}`,
              due: HR.addDays(HR.today(), 1),
              recurrence: 'Tidak berulang',
              status: 'Belum mulai',
              notes: `Tugas susulan dari siklus yang terlambat (${t.due})`
            });
          }
        }, t.title);
        closeModal();
        render();
        toast('✅ Tugas rutin diselesaikan & siklus masa depan telah dijadwalkan!');
      } else if (act === 'skip-cycle') {
        const t = db.tasks.find(x => x.id === id);
        if (!t) return;
        const nextDue = computeNextRecurrenceDue(t, 'fixed', 1);
        mutate('Melewatkan 1 siklus tugas rutin', () => {
          t.due = nextDue;
          t.notes = `${t.notes || ''}\n[Siklus dilewatkan pada ${HR.today()} ke ${nextDue}]`.trim();
        }, `${t.title} -> ${nextDue}`);
        render();
        toast(`⏭️ 1 siklus dilewatkan. Tenggat berikutnya: ${HR.date(nextDue)}.`);
      } else if (act === 'dedup-tasks') {
        const seen = new Set();
        let removed = 0;
        mutate('Membersihkan tugas rutin ganda', () => {
          db.tasks = db.tasks.filter(t => {
            if (t.status === 'Selesai') return true;
            const signature = `${t.title.trim().toLowerCase()}|${t.due}|${t.empId || ''}`;
            if (seen.has(signature)) {
              removed++;
              return false;
            }
            seen.add(signature);
            return true;
          });
        }, `${removed} duplikat dihapus`);
        render();
        toast(removed ? `🧹 ${removed} tugas ganda berhasil dibersihkan!` : '✓ Tidak ada tugas ganda ditemukan.');
      } else if (act === 'remind-pic-wa') {
        const t = db.tasks.find(x => x.id === id);
        if (!t) return;
        const emp = t.empId ? HR.employee(db, t.empId) : null;
        const txt = `🔔 *PENGINGAT TENGGAT TUGAS HRD — BARAKA EXPRESS*\n\nHalo *${t.owner}*,\nMengingatkan tugas berikut telah melewati batas tenggat waktu:\n\n• *Tugas:* ${t.title}\n• *Kategori:* ${t.category}\n• *Tenggat:* ${HR.date(t.due)}\n• *Prioritas:* ${t.priority}\n\nMohon segera diselesaikan atau perbarui statusnya. Terima kasih.`;
        const phone = (emp?.phone || '').replace(/\D/g, '').replace(/^0/, '62');
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(txt)}`, '_blank');
      } else if (act === 'escalate-task') {
        const t = db.tasks.find(x => x.id === id);
        if (!t) return;
        mutate('Eskalasi tugas lewat tenggat', () => {
          t.priority = 'Tinggi';
          t.escalatedTo = 'Korwil / Kepala Cabang';
          t.notes = `${t.notes || ''}\n[ESKALASI ${HR.today()}]: Melewati tenggat, dieskalasikan ke Korwil/Kacab.`.trim();
        }, t.title);
        render();
        toast(`⚠️ Tugas "${t.title}" telah dieskalasikan dengan prioritas Tinggi!`);
      }
    } catch (err) {
      toast(err.message || 'Gagal memproses perintah.', true);
    }
  });

  // Tandai status "Terkirim ke Server" saat Push Cloud berhasil
  const origCloudMark = window.cloudMarkConfirmed;
  if (typeof origCloudMark === 'function') {
    window.cloudMarkConfirmed = function(receipt) {
      origCloudMark(receipt);
      if (receipt?.direction === 'Push') {
        updateBackupLifecycle('sentToServer', `Cloud Rev ${receipt.cloudRevision || 1}`);
      }
    };
  }

  BarakaRuntime.addRenderHook('workflow-backup-9.2', function() {
    injectV92Buttons();
  });

  injectV92Buttons();
});
</script>

<script src="Baraka_OneDrive_Sync_Vault.js" onerror="window.__barakaLocalVaultMissing=true"></script>
<script data-baraka-extension="vault-9.3">
BarakaRuntime.registerModule('vault-9.3', function(){
  'use strict';

  const VAULT_FILENAME = 'Baraka_OneDrive_Sync_Vault.js';

  // Kode Google Apps Script Universal (Mendukung Push, Pull, JSONP, Database 26 Kolom & G-Form)
  const UNIVERSAL_GAS_CODE = `/**
 * BARAKA PEOPLEOS 9.3 — UNIVERSAL CLOUD SYNC & DRIVE CONNECTOR
 * Cara Pasang:
 * 1. Buka https://script.google.com -> Proyek Baru
 * 2. Hapus kode lama, tempel seluruh kode ini, lalu klik Simpan (ikon disket)
 * 3. Klik Terapkan (Deploy) -> Deployment Baru -> Pilih jenis: Aplikasi Web (Web App)
 * 4. Eksekusi sebagai: "Saya (Me)" | Siapa yang memiliki akses: "Siapa saja (Anyone)" -> Klik Terapkan
 * 5. Salin URL Web App yang muncul ke Baraka PeopleOS.
 */
const PROP_KEY = 'BARAKA_PEOPLEOS_CLOUD_SNAPSHOT';

function doGet(e) {
  const params = (e && e.parameter) ? e.parameter : {};
  const action = params.action || 'pull';
  const callback = params.callback || '';

  let result = { ok: true, protocol: 'BARAKA_SYNC_V1', status: 'success' };
  try {
    const raw = PropertiesService.getScriptProperties().getProperty(PROP_KEY);
    // Coba baca juga dari Google Drive jika ukuran melebihi batas Properties
    let savedObj = raw ? JSON.parse(raw) : null;
    if (savedObj && savedObj.driveFileId) {
      const fileTxt = DriveApp.getFileById(savedObj.driveFileId).getBlob().getDataAsString();
      savedObj = JSON.parse(fileTxt);
    }

    if (action === 'status') {
      result.cloudRevision = savedObj ? (savedObj.cloudRevision || 1) : 0;
      result.digest = savedObj ? (savedObj.digest || '') : '';
      result.savedAt = savedObj ? savedObj.savedAt : null;
    } else {
      if (!savedObj || !savedObj.payload) {
        result = { ok: false, status: 'empty', message: 'Cloud masih kosong. Lakukan Push terlebih dahulu.' };
      } else {
        result.cloudRevision = savedObj.cloudRevision || 1;
        result.digest = savedObj.digest || '';
        result.savedAt = savedObj.savedAt || new Date().toISOString();
        result.payload = savedObj.payload;
      }
    }
  } catch (err) {
    result = { ok: false, status: 'error', message: String(err) };
  }

  const jsonString = JSON.stringify(result);
  if (callback) {
    return ContentService.createTextOutput(callback + '(' + jsonString + ');')
      .setMimeType(ContentService.MimeType.JAVASCRIPT);
  }
  return ContentService.createTextOutput(jsonString)
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  try {
    const body = JSON.parse(e.postData.contents);
    const payload = body.payload || body.data || body.db || body;
    const nextRev = Number(body.clientRevision || 1);
    const savedAt = new Date().toISOString();
    const record = {
      cloudRevision: nextRev,
      clientRevision: nextRev,
      requestId: body.requestId || '',
      digest: body.digest || (payload.backupIntegrity ? payload.backupIntegrity.digest : ''),
      savedAt: savedAt,
      payload: payload
    };

    const serialized = JSON.stringify(record);
    if (serialized.length < 400000) {
      PropertiesService.getScriptProperties().setProperty(PROP_KEY, serialized);
    } else {
      // Simpan ke file Google Drive jika lebih dari 400 KB
      const files = DriveApp.getFilesByName('Baraka_PeopleOS_Cloud_Vault.json');
      let file;
      if (files.hasNext()) {
        file = files.next();
        file.setContent(serialized);
      } else {
        file = DriveApp.createFile('Baraka_PeopleOS_Cloud_Vault.json', serialized, MimeType.PLAIN_TEXT);
      }
      PropertiesService.getScriptProperties().setProperty(PROP_KEY, JSON.stringify({
        cloudRevision: nextRev,
        digest: record.digest,
        savedAt: savedAt,
        driveFileId: file.getId()
      }));
    }

    return ContentService.createTextOutput(JSON.stringify({
      ok: true,
      protocol: 'BARAKA_SYNC_V1',
      requestId: record.requestId,
      digest: record.digest,
      clientRevision: nextRev,
      cloudRevision: nextRev,
      savedAt: savedAt
    })).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({
      ok: false,
      status: 'error',
      message: String(err)
    })).setMimeType(ContentService.MimeType.JSON);
  }
}`;

  // Muat ulang file Baraka_OneDrive_Sync_Vault.js secara dinamis dari folder yang sama (Tanpa Fetch/CORS!)
  function loadLocalOneDriveVault() {
    return new Promise((resolve) => {
      const s = document.createElement('script');
      s.src = VAULT_FILENAME + '?t=' + Date.now();
      s.onload = () => {
        s.remove();
        resolve(window.__BARAKA_ONEDRIVE_VAULT__ || null);
      };
      s.onerror = () => {
        s.remove();
        resolve(window.__BARAKA_ONEDRIVE_VAULT__ || null);
      };
      document.head.appendChild(s);
    });
  }

  // Simpan file Vault OneDrive (.js) agar bisa langsung dibaca otomatis dari folder OneDrive tanpa internet/CORS
  async function saveLocalOneDriveVaultFile(packedData) {
    const jsContent = `window.__BARAKA_ONEDRIVE_VAULT__ = ${JSON.stringify({
      savedAt: new Date().toISOString(),
      revision: packedData.revision || 1,
      payload: packedData
    }, null, 2)};\n`;

    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: VAULT_FILENAME,
          types: [{ description: 'Baraka OneDrive Sync Vault', accept: { 'application/javascript': ['.js'] } }]
        });
        const writable = await handle.createWritable();
        await writable.write(jsContent);
        await writable.close();
        window.__BARAKA_ONEDRIVE_VAULT__ = { savedAt: new Date().toISOString(), revision: packedData.revision || 1, payload: packedData };
        return true;
      } catch (err) {
        if (err.name === 'AbortError') return false;
      }
    }
    download(VAULT_FILENAME, jsContent, 'application/javascript;charset=utf-8');
    window.__BARAKA_ONEDRIVE_VAULT__ = { savedAt: new Date().toISOString(), revision: packedData.revision || 1, payload: packedData };
    return true;
  }

  // Override cloudOperation agar memiliki Auto-Fallback ke OneDrive Local Vault jika Google Script terkena blokir CORS
  let busy93 = false;
  const prevCloudOp = window.cloudOperation;

  window.cloudOperation = async function(kind) {
    if (mode !== 'work') switchMode('work');
    if (busy93) throw new Error('Sinkronisasi sedang berjalan...');
    busy93 = true;

    try {
      if (kind === 'push') {
        const packedPayload = await BarakaSafety.pack({ ...HR.validatePayload(db), workspaceMode: 'work' });
        // Simpan cadangan ke IndexedDB & LocalStorage Vault
        try { auxSet('baraka_local_vault_fallback', JSON.stringify(packedPayload)); } catch {}

        // Coba Push ke Google Script jika URL valid
        const input = document.querySelector('#cloud-webhook-input');
        const rawUrl = (input?.value.trim() || db.settings.cloudWebhookUrl || '').trim();
        let gasOk = false;
        if (rawUrl) {
          try {
            await fetch(rawUrl, {
              method: 'POST',
              mode: 'no-cors',
              credentials: 'omit',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({
                action: 'push',
                protocol: 'BARAKA_SYNC_V1',
                workspace: 'work',
                clientRevision: db.revision || 1,
                digest: packedPayload.backupIntegrity.digest,
                payload: packedPayload
              })
            });
            gasOk = true;
          } catch {}
        }

        const nowIso = new Date().toISOString();
        cloudMarkConfirmed({
          cloudRevision: db.revision || 1,
          localRevision: db.revision || 1,
          savedAt: nowIso,
          direction: 'Push'
        });
        closeModal();
        render();
        toast(gasOk
          ? '✅ Push Berhasil! Data telah dikirim ke Cloud & disimpan di Vault lokal.'
          : '✅ Data disimpan di Vault lokal! Gunakan tombol Simpan Vault OneDrive untuk pindah perangkat.');
        return;
      }

      // MODE PULL: Coba tarik dari Google Script dulu; jika gagal (Failed to fetch), otomatis tarik dari OneDrive Vault!
      toast('⏳ Mencari data Cloud & OneDrive Vault...');
      let pulledPayload = null;
      let pullSource = '';

      const input = document.querySelector('#cloud-webhook-input');
      const rawUrl = (input?.value.trim() || db.settings.cloudWebhookUrl || '').trim();

      if (rawUrl) {
        try {
          // Coba JSONP terlebih dahulu karena bebas blokir CORS file://
          const cbName = 'barakaPullCb_' + Date.now();
          const jsonpData = await new Promise((resolve, reject) => {
            const sc = document.createElement('script');
            const tm = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 8000);
            function cleanup() { clearTimeout(tm); delete window[cbName]; sc.remove(); }
            window[cbName] = (d) => { cleanup(); resolve(d); };
            const sep = rawUrl.includes('?') ? '&' : '?';
            sc.src = `${rawUrl}${sep}action=pull&callback=${cbName}&_t=${Date.now()}`;
            sc.onerror = () => { cleanup(); reject(new Error('script_err')); };
            document.head.appendChild(sc);
          });
          if (jsonpData && (jsonpData.payload || jsonpData.employees)) {
            pulledPayload = jsonpData.payload || jsonpData;
            pullSource = 'Google Cloud (JSONP)';
          }
        } catch {
          try {
            const r = await fetch(rawUrl + (rawUrl.includes('?') ? '&' : '?') + 'action=pull&_t=' + Date.now(), { method: 'GET', credentials: 'omit' });
            if (r.ok) {
              const j = await r.json();
              if (j && (j.payload || j.employees)) {
                pulledPayload = j.payload || j;
                pullSource = 'Google Cloud (HTTPS)';
              }
            }
          } catch {}
        }
      }

      // Fallback 1: Cek file Baraka_OneDrive_Sync_Vault.js di folder OneDrive yang sama
      if (!pulledPayload) {
        const localVault = await loadLocalOneDriveVault();
        if (localVault && localVault.payload) {
          pulledPayload = localVault.payload;
          pullSource = 'OneDrive Sync Vault (Folder Lokal)';
        }
      }

      // Fallback 2: Cek cadangan Vault internal
      if (!pulledPayload) {
        try {
          const internalRaw = auxGet('baraka_local_vault_fallback') || storageGet('baraka_peopleos_v4_recovery');
          if (internalRaw) {
            const parsedInt = JSON.parse(internalRaw);
            if (parsedInt && Array.isArray(parsedInt.employees) && parsedInt.employees.length > 0) {
              pulledPayload = parsedInt;
              pullSource = 'Titik Pemulihan Lokal';
            }
          }
        } catch {}
      }

      if (!pulledPayload) {
        // Buka panduan interaktif tanpa melempar error merah yang membingungkan
        openCloudTroubleshootingModal();
        return;
      }

      const cleanCopy = JSON.parse(JSON.stringify(pulledPayload));
      delete cleanCopy.backupIntegrity;
      cleanCopy.workspaceMode = 'work';
      const validated = HR.validatePayload(cleanCopy);

      previewImport(validated, true);
      cloudMarkConfirmed({
        cloudRevision: validated.revision || 1,
        localRevision: validated.revision || 1,
        savedAt: new Date().toISOString(),
        direction: 'Pull'
      });
      toast(`✅ Berhasil menarik data dari ${pullSource}! Centang konfirmasi di layar untuk menerapkan.`);
    } finally {
      busy93 = false;
      cloudInFlight = false;
    }
  };

  function openCloudTroubleshootingModal() {
    modal('☁️ Panduan Aktivasi Cloud Sync & OneDrive Vault (Bebas Error CORS)',
      notice('<b>Kenapa muncul "Failed to fetch"?</b> Karena URL Google Script bawaan belum berisi data dari akun utamamu, atau script Google kamu belum mendukung respons JSONP untuk file HTML lokal (<code>file://</code>).', 'amber') +
      `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
        <div style="padding:14px;background:var(--mint);border:1px solid #a8d5c2;border-radius:10px">
          <h3 style="margin:0 0 6px;font-size:13.5px;color:var(--green-dark)">🚀 Cara 1: Sinkronisasi OneDrive (Paling Cepat & Tanpa Setting Script)</h3>
          <p style="font-size:11.5px;margin:0 0 10px;line-height:1.5">Karena file HTML ini sudah ada di folder <b>OneDrive\\Dokumen\\AI</b>, kamu bisa menyimpan file <code>${VAULT_FILENAME}</code> di folder yang sama. Setiap perangkat yang membuka folder OneDrive ini otomatis langsung sinkron!</p>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button type="button" class="btn sm primary" data-v93="save-onedrive-vault">${icon('down')} Simpan ke Folder OneDrive</button>
            <button type="button" class="btn sm soft" data-action="choose-backup">${icon('up')} Pilih File .JSON Manual</button>
          </div>
        </div>
        <div style="padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:10px">
          <h3 style="margin:0 0 6px;font-size:13.5px;color:var(--text)">🏢 Cara 2: Tarik Data Karyawan dari Google Drive Pusat</h3>
          <p style="font-size:11.5px;margin:0 0 10px;line-height:1.5">Jika kamu ingin mengisi daftar karyawan dari folder Google Drive <b>22 PONTIANAK</b> (STAFF, TKBM, SOPIR, NON-STAFF), gunakan menu khusus di bawah ini:</p>
          <button type="button" class="btn sm primary" data-hrd76="modal-pusat-sync">${icon('cloud')} Buka Sync Database Cabang</button>
        </div>
      </div>
      <details style="border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)">
        <summary style="cursor:pointer;font-weight:700;font-size:12px;color:var(--green-dark)">🔧 Ingin Google Apps Script Cloud Sync bekerja 100% dari file://? Klik di sini untuk Salin Kode Script Universal</summary>
        <p class="note" style="margin:8px 0">Salin kode di bawah ini ke <b>script.google.com</b> dan pilih <i>Deploy -> Web App -> Who has access: Anyone</i>:</p>
        <textarea readonly id="gas-universal-code" style="width:100%;min-height:130px;font-family:monospace;font-size:10.5px;padding:8px;border:1px solid var(--line);border-radius:6px">${E(UNIVERSAL_GAS_CODE)}</textarea>
        <div class="setting-buttons" style="margin-top:8px">
          <button type="button" class="btn sm primary" data-v93="copy-gas-code">${icon('copy')} Salin Kode Google Apps Script Universal</button>
        </div>
      </details>`,
      actButton('close', 'Tutup'),
      true
    );
  }

  document.addEventListener('click', async (e) => {
    const btn = e.target.closest?.('[data-v93]');
    if (!btn) return;
    const act = btn.dataset.v93;
    try {
      if (act === 'save-onedrive-vault') {
        const packed = await BarakaSafety.pack({ ...HR.validatePayload(db), workspaceMode: 'work' });
        const ok = await saveLocalOneDriveVaultFile(packed);
        if (ok) toast(`✅ File ${VAULT_FILENAME} berhasil disimpan! Simpan di folder OneDrive yang sama dengan HTML ini.`);
      } else if (act === 'copy-gas-code') {
        await copy(UNIVERSAL_GAS_CODE);
      }
    } catch (err) {
      toast(err.message || 'Gagal menjalankan aksi.', true);
    }
  });
});
</script>

<script data-baraka-extension="execution-center-9.4">
BarakaRuntime.registerModule('execution-center-9.4', function(){
  'use strict';

  /* ============================================================================
   * 1. STATE FILTER GLOBAL KONSISTEN, JEJAK PEKERJAAN TERAKHIR & PRIVASI GAJI/MEDIS
   * ============================================================================ */
  let globalPicFilter = '';
  let globalUrgencyFilter = '';
  let privacyMaskEnabled = (auxGet('baraka_privacy_mask_v94') === 'true');

  // Override HR.money agar otomatis menyamarkan nominal gaji/klaim ketika Mode Privasi aktif
  const origMoney = HR.money;
  HR.money = function(n) {
    if (privacyMaskEnabled) return 'Rp ••••••••';
    return origMoney(n);
  };

  function applyPrivacyBodyClass() {
    document.body.classList.toggle('privacy-masked', privacyMaskEnabled);
  }
  applyPrivacyBodyClass();

  function saveLastWorkState(title, targetRoute, entityType = '', recordId = '') {
    const info = {
      title: String(title || titles[targetRoute] || 'Pekerjaan Terakhir'),
      route: targetRoute || route,
      entity: entityType || '',
      id: recordId || '',
      at: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
    };
    try { auxSet('baraka_last_work_v94', JSON.stringify(info)); } catch {}
  }

  function getLastWorkState() {
    try {
      const raw = auxGet('baraka_last_work_v94');
      if (raw) return JSON.parse(raw);
    } catch {}
    return null;
  }

  // Hitung jumlah pekerjaan/data yang belum lengkap vs total di seluruh modul
  function computeIncompleteMetrics() {
    const now = HR.today();
    const emps = HR.activeEmployees(db).filter(inBranch);
    const incompleteEmps = emps.filter(e => {
      const m = e.pusatMeta || {};
      const noBank = !(m.bankAccount || /rek/i.test(e.notes || ''));
      const noDoc = !Array.isArray(e.docChecklist) || e.docChecklist.length < 3;
      const noPhone = !e.phone;
      return noBank || noDoc || noPhone;
    });
    const openTasks = db.tasks.filter(t => t.status !== 'Selesai' && inBranch(t));
    const overdueTasks = openTasks.filter(t => t.due && t.due < now);
    const pendingLeaves = db.leaves.filter(l => l.status === 'Menunggu' && inBranch(l));
    const pendingClaims = db.claims.filter(c => c.status === 'Menunggu' && inBranch(c));
    const activeCandidates = db.candidates.filter(c => !['Diterima', 'Ditolak'].includes(c.stage) && inBranch(c));
    const draftPayrolls = db.payroll.filter(p => p.month === period && p.status === 'Draf' && inBranch(p));
    const missingPayrollEmps = emps.filter(e => !db.payroll.some(p => p.empId === e.id && p.month === period));

    return {
      totalEmps: emps.length,
      incompleteEmps: incompleteEmps.length,
      totalTasks: db.tasks.filter(inBranch).length,
      openTasks: openTasks.length,
      overdueTasks: overdueTasks.length,
      pendingLeaves: pendingLeaves.length,
      pendingClaims: pendingClaims.length,
      activeCandidates: activeCandidates.length,
      draftPayrolls: draftPayrolls.length,
      missingPayrollEmps: missingPayrollEmps.length
    };
  }

  /* ============================================================================
   * 2. BAR FILTER KONSISTEN DI SEMUA MODUL + TOMBOL LANJUTKAN PEKERJAAN TERAKHIR
   * ============================================================================ */
  function injectGlobalConsistentFilterBar() {
    const contentEl = document.querySelector('#content');
    const targetAnchor = document.querySelector('#rev8-command-bar') || document.querySelector('#rev-autopilot-bar') || contentEl?.querySelector('.page-heading');
    if (!targetAnchor || document.querySelector('#global-filter-bar-v94')) return;

    const metrics = computeIncompleteMetrics();
    const lastWork = getLastWorkState();
    const picList = [...new Set([
      db.settings.officer,
      'Kepala Cabang',
      'Kepala Port',
      'Korwil',
      ...db.tasks.map(t => t.owner).filter(Boolean)
    ])];

    const bar = document.createElement('div');
    bar.id = 'global-filter-bar-v94';
    bar.className = 'global-filter-bar-v94';
    bar.innerHTML = `
      <div class="gf-group">
        <strong style="font-size:11.5px;color:var(--green-dark)">🎛️ Filter Global:</strong>
        <input type="month" id="gf-period" class="gf-select" value="${E(period)}" title="Filter Periode Bulanan">
        <select id="gf-branch" class="gf-select" title="Filter Cabang">
          ${branchOptions(branch, 'Semua Cabang (' + db.settings.branches.length + ')')}
        </select>
        <select id="gf-pic" class="gf-select" title="Filter PIC / Penanggung Jawab">
          ${opts([{ value: '', label: 'Semua PIC' }, ...picList.map(p => ({ value: p, label: 'PIC: ' + p }))], globalPicFilter)}
        </select>
        <select id="gf-urgency" class="gf-select" title="Filter Tingkat Urgensi">
          ${opts([
            { value: '', label: 'Semua Urgensi' },
            { value: 'high', label: '🔴 Kritis / Tinggi' },
            { value: 'medium', label: '🟡 Sedang / Segera' },
            { value: 'low', label: '🟢 Normal / Rendah' }
          ], globalUrgencyFilter)}
        </select>
        <span class="incomplete-pill" title="Jumlah item yang masih belum selesai / belum lengkap">
          ⚠️ Belum Lengkap: ${metrics.openTasks} tugas · ${metrics.incompleteEmps}/${metrics.totalEmps} profil · ${metrics.pendingLeaves + metrics.pendingClaims} persetujuan
        </span>
      </div>
      <div class="gf-group">
        ${lastWork ? `
          <button type="button" class="resume-work-pill" data-v94="resume-last-work" title="Kembali ke aktivitas terakhir yang kamu kerjakan">

        <button type="button" class="btn sm soft" data-v94="open-bulk-modal" title="Tindakan massal dengan pratinjau sebelum disimpan">

        <button type="button" class="btn sm ${privacyMaskEnabled ? 'primary' : 'soft'}" data-v94="toggle-privacy" title="Sembunyikan/tampilkan nominal gaji dan rincian klaim medis">

  }

  /* ============================================================================
   * 3. PUSAT KENDALI EKSEKUSI PEKERJAAN HRD DI DASHBOARD (POIN A)
   * ============================================================================ */
  function buildActionButtonsForInsight(item) {
    if (item.type === 'Kontrak') {
      return `
        <button type="button" class="btn sm soft" data-hrd76="extend-contract" data-id="${E(item.entityId)}" data-months="6">+6 Bln</button>

    }

    }
    if (item.type === 'Cuti') {
      return `
        <button type="button" class="btn sm primary" data-action="approve-leave" data-id="${E(item.entityId)}">✓ Setujui</button>
        <button type="button" class="btn sm soft" data-action="reject-leave" data-id="${E(item.entityId)}">Tolak</button>
      `;
    }
    if (item.type === 'Klaim') {
      return `
        <button type="button" class="btn sm primary" data-action="approve-claim" data-id="${E(item.entityId)}">✓ Verifikasi & Setujui</button>
        <button type="button" class="btn sm soft" data-action="claim-doc" data-id="${E(item.entityId)}">📄 Form</button>
      `;
    }
    if (item.type === 'Rekrutmen') {
      return `
        <button type="button" class="btn sm primary" data-action="candidate-message" data-id="${E(item.entityId)}">💬 Undang WA</button>
        <button type="button" class="btn sm soft" data-action="edit" data-entity="candidate" data-id="${E(item.entityId)}">Detail</button>
